<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account · Advantage AI</title>
<meta name="description" content="Sign in to see your reports, your progress, or your team.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#15261C">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Newsreader:opsz,wght@6..72,400..600&display=swap" rel="stylesheet">
<style>
/* Same tokens as Home (DESIGN.md): one dark court-green palette. */
:root {
  --font-serif: "Newsreader", "Iowan Old Style", Georgia, serif;
  --font-sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --text-sm: 1rem; --text-base: 1.125rem; --text-lg: 1.25rem; --text-xl: 1.5rem; --text-2xl: 2rem;
  --leading-tight: 1.1; --leading-body: 1.55;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-5: 24px; --space-6: 32px; --space-7: 48px; --space-8: 64px;
  --col: 860px; --tap: 48px;
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-pill: 999px;
  color-scheme: dark;
  --bg: #15261C; --surface: #1C3226; --surface-2: #243D2F; --line: #31503D; --line-strong: #46684F;
  --ink: #F1F6EF; --ink-2: #DFEADD; --muted: #C3D3C3; --dim: #9AAE9C;
  --accent: #8ED19D; --accent-strong: #A6DFB2; --accent-soft: #24452F; --on-accent: #0C1E11;
  --bad: #E0907F;
  --focus: 0 0 0 3px var(--bg), 0 0 0 5px var(--accent);
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 var(--text-base)/var(--leading-body) var(--font-sans);
  -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: none; box-shadow: var(--focus); border-radius: var(--radius-sm); }
h1, h2, h3 { margin: 0; font-weight: 500; text-wrap: balance; }
h1 { font: 500 var(--text-2xl)/var(--leading-tight) var(--font-serif); letter-spacing: -0.015em; }
h2 { font: 500 var(--text-xl)/var(--leading-tight) var(--font-serif); }
h3 { font-size: var(--text-base); font-weight: 650; }
.wrap { width: 100%; max-width: var(--col); margin: 0 auto; padding: 0 16px; }
main.wrap { padding-top: var(--space-6); padding-bottom: var(--space-8); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: var(--space-5);
  margin-top: var(--space-5); }
.lead { color: var(--muted); margin: var(--space-2) 0 0; }
.tabs { display: flex; gap: var(--space-1); margin-top: var(--space-5); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tabs button { min-height: var(--tap); padding: 0 var(--space-4); border: 0; background: none; color: var(--muted);
  font: 600 var(--text-base) var(--font-sans); cursor: pointer; border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
form { display: grid; gap: var(--space-4); max-width: 420px; }
label { display: grid; gap: var(--space-1); font-weight: 600; }
label small { font-weight: 400; color: var(--dim); }
input { font: inherit; min-height: var(--tap); padding: 0 var(--space-3); border-radius: var(--radius-sm);
  border: 1px solid var(--line-strong); background: var(--bg); color: var(--ink); }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: var(--tap); padding: 0 var(--space-5);
  border: 0; border-radius: var(--radius-pill); background: var(--accent); color: var(--on-accent); font: 650 var(--text-base) var(--font-sans);
  cursor: pointer; text-decoration: none; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line-strong); }
.btn.small { min-height: 40px; padding: 0 var(--space-4); font-size: var(--text-sm); }
.msg { min-height: 1.5em; margin: 0; color: var(--bad); }
/* Show/hide eye inside password boxes */
.pw-wrap { position: relative; display: block; }
.pw-wrap input { width: 100%; padding-right: var(--tap); }
.pw-eye { position: absolute; top: 0; right: 0; width: var(--tap); height: 100%; display: grid; place-items: center;
  border: 0; background: none; color: var(--dim); cursor: pointer; border-radius: var(--radius-sm); }
.pw-eye:hover { color: var(--ink); }
.pw-eye .eye-off { display: none; }
.pw-eye[aria-pressed="true"] .eye-on { display: none; }
.pw-eye[aria-pressed="true"] .eye-off { display: block; }
.hidden { display: none !important; }
.who { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-3); }
.code { font: 650 var(--text-xl)/1 ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: .12em; color: var(--accent-strong); }
.focus { background: var(--accent-soft); border-color: var(--accent); }
.focus .eyebrow { color: var(--accent-strong); font-size: var(--text-sm); font-weight: 650; text-transform: uppercase; letter-spacing: .08em; }
.focus h2 { margin-top: var(--space-2); }
table { width: 100%; border-collapse: collapse; margin-top: var(--space-3); font-size: var(--text-sm); }
th, td { text-align: left; padding: var(--space-3) var(--space-2); border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--dim); font-weight: 600; }
.trend { display: inline-block; padding: 2px 10px; border-radius: var(--radius-pill); background: var(--surface-2); color: var(--ink-2);
  font-size: .9rem; font-weight: 650; white-space: nowrap; }
.trend.shrinking { background: var(--accent-soft); color: var(--accent-strong); }
.trend.growing { background: rgba(224,144,127,.16); color: var(--bad); }
.spark { display: inline-flex; align-items: flex-end; gap: 3px; height: 28px; vertical-align: middle; }
.spark i { display: block; width: 8px; min-height: 2px; border-radius: 2px; background: var(--line-strong); }
.spark i:last-child { background: var(--accent); }
.muted { color: var(--muted); }
/* Short rows that open for detail (fixes, players, history) */
summary { cursor: pointer; list-style: none; }
summary::-webkit-details-marker { display: none; }
summary .chev { flex: none; margin-left: auto; color: var(--dim); transition: transform 200ms; }
details[open] > summary .chev { transform: rotate(180deg); }
.fold > summary { display: flex; align-items: center; gap: var(--space-3); min-height: var(--tap); }
.fixes, .roster, .trends, .history, .team-focus, .r-problems { list-style: none; margin: var(--space-3) 0 0; padding: 0; }
.fix, .roster > li { border-top: 1px solid var(--line); }
.fix summary, .roster summary { display: flex; align-items: center; gap: var(--space-3); min-height: 56px; padding: var(--space-2) 0; }
.rank { flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft);
  color: var(--accent-strong); font-weight: 700; font-size: .95rem; }
.fix-title { font: 500 var(--text-lg)/1.25 var(--font-serif); }
.try { margin: 0 0 var(--space-2); }
.steps { margin: 0 0 var(--space-4); display: grid; grid-template-columns: max-content 1fr; gap: var(--space-2) var(--space-4); }
.steps dt { color: var(--dim); font-weight: 600; }
.steps dd { margin: 0; }
.more { margin: var(--space-3) 0 0; }
.trends li { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) 0; border-top: 1px solid var(--line); }
.t-title { flex: 1; }
.history li { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-4); padding: var(--space-2) 0; border-top: 1px solid var(--line); }
.team-focus li { padding: var(--space-3) 0; border-top: 1px solid rgba(166,223,178,.25); }
.team-focus li:first-child { border-top: 0; }
.tf-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: var(--space-2); }
.tf-head h3 { font: 500 var(--text-lg)/1.25 var(--font-serif); }
.tf-drill { margin: var(--space-1) 0 0; color: var(--ink-2); }
.r-name { font-weight: 650; min-width: 6rem; }
.r-top { flex: 1; color: var(--ink-2); }
.r-body { padding: 0 0 var(--space-3); }
.r-problems { margin: 0 0 var(--space-2); padding-left: 1.4em; list-style: decimal; }
.r-problems li { padding: 2px 0; }
.r-actions { margin: 0; color: var(--muted); font-size: var(--text-sm); }
.r-label { margin: 0 0 var(--space-1); color: var(--dim); font-size: var(--text-sm); font-weight: 600; }
.focus > h2 { margin-bottom: var(--space-2); }
.good { list-style: none; margin: var(--space-3) 0 0; padding: 0; }
.good li { display: flex; flex-wrap: wrap; justify-content: space-between; gap: var(--space-1) var(--space-3);
  padding: var(--space-3) 0; border-top: 1px solid var(--line); }
.good li:first-child { border-top: 0; }
.g-title { font: 500 var(--text-lg)/1.25 var(--font-serif); }
.good .muted { flex-basis: 100%; font-size: var(--text-sm); }
.good li.tf-head .muted { flex-basis: auto; }
.ones td { vertical-align: middle; }
.history li { display: block; }
.h-top { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); }
.h-stats { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-4); margin-top: var(--space-1); font-size: var(--text-sm); }
.h-pts b { font-variant-numeric: tabular-nums; }
.result { padding: 2px 10px; border-radius: var(--radius-sm); font-weight: 800; font-size: .9rem; letter-spacing: .06em; }
.result.win { background: var(--accent); color: var(--on-accent); }
.result.loss { background: var(--bad); color: #2A0F0A; }
.set-result { color: var(--dim); font-size: var(--text-sm); display: inline-flex; align-items: center; gap: var(--space-2); }
.chip { min-height: 32px; padding: 0 var(--space-3); border-radius: var(--radius-pill); border: 1px solid var(--line-strong);
  background: none; color: var(--ink); font: 600 var(--text-sm) var(--font-sans); cursor: pointer; }
.chip:hover { border-color: var(--accent); }
.small-link { font-size: var(--text-sm); color: var(--dim); }
.linkish { border: 0; background: none; padding: 0; font: inherit; color: var(--accent); text-decoration: underline; cursor: pointer; }
@media (max-width: 559px) {
  .steps { grid-template-columns: 1fr; gap: 0; }
  .steps dd { margin-bottom: var(--space-2); }
  .roster summary { flex-wrap: wrap; }
  .r-top { flex-basis: 100%; order: 3; }
  .panel { padding: var(--space-4); }
  .hide-phone { display: none; }
}
</style>
<link rel="stylesheet" href="site.css">
<script src="site.js"></script>
<script src="passcode.js"></script>
</head>
<body>
<header id="topbar" data-page="account"></header>
<main class="wrap" id="main">
  <!-- Signed out: sign in, join a team, or (coaches) create one -->
  <section id="signedOut" class="hidden" aria-labelledby="authH">
    <h1 id="authH">Your account</h1>
    <p class="lead">Sign in to keep your reports in one place and see your progress across matches.</p>
    <div class="tabs" role="tablist" aria-label="Account">
      <button type="button" role="tab" id="tab-signin" aria-controls="f-signin" aria-selected="true">Sign in</button>
      <button type="button" role="tab" id="tab-join" aria-controls="f-join" aria-selected="false">Join my team</button>
      <button type="button" role="tab" id="tab-coach" aria-controls="f-coach" aria-selected="false">I'm a coach</button>
    </div>
    <div class="panel">
      <form id="f-signin" data-api="/api/auth/signin" role="tabpanel" aria-labelledby="tab-signin">
        <label>Username <input name="username" autocomplete="username" required autocapitalize="none"></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
        <button class="btn" type="submit">Sign in</button>
        <p class="msg" role="alert"></p>
        <p class="muted">Forgot your password? Your coach can set a new one for you.</p>
      </form>
      <form id="f-join" class="hidden" data-api="/api/auth/join" role="tabpanel" aria-labelledby="tab-join">
        <label>Team code <small>6 letters, from your coach</small><input name="code" required autocapitalize="characters" maxlength="6"></label>
        <label>Your name <small>as your coach knows you</small><input name="name" autocomplete="name" required maxlength="40"></label>
        <label>Username <small>3-24 letters or numbers; no email needed</small><input name="username" autocomplete="username" required autocapitalize="none"></label>
        <label>Password <small>at least 8 characters</small><input name="password" type="password" autocomplete="new-password" required minlength="8"></label>
        <button class="btn" type="submit">Join team</button>
        <p class="msg" role="alert"></p>
      </form>
      <form id="f-coach" class="hidden" data-api="/api/auth/create-team" role="tabpanel" aria-labelledby="tab-coach">
        <label>Team name <input name="team_name" required maxlength="60" placeholder="e.g. Varsity Boys"></label>
        <label>Your name <input name="name" autocomplete="name" required maxlength="40"></label>
        <label>Username <input name="username" autocomplete="username" required autocapitalize="none"></label>
        <label>Password <small>at least 8 characters</small><input name="password" type="password" autocomplete="new-password" required minlength="8"></label>
        <p class="muted">You'll be asked for the app passcode (from Rudra) if this device doesn't have it yet.</p>
        <button class="btn" type="submit">Create team</button>
        <p class="msg" role="alert"></p>
      </form>
    </div>
  </section>

  <!-- Signed in -->
  <section id="signedIn" class="hidden">
    <div class="who">
      <div><h1 id="hello">Hi</h1><p class="lead" id="teamLine"></p></div>
      <button class="btn ghost small" id="signOut" type="button">Sign out</button>
    </div>
    <div id="coachBox" class="hidden">
      <p class="lead">Team code <span class="code" id="teamCode"></span> <span class="muted">· players join with it</span></p>
      <div id="teamFocus"></div>
      <div class="panel">
        <h2>Players</h2>
        <div id="teamTable"><p class="muted">Loading…</p></div>
      </div>
    </div>
    <div id="progressBox"></div>
  </section>
</main>
<footer id="sitefoot"></footer>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// Tabs
const tabs = ["signin", "join", "coach"];
function showTab(name) {
  tabs.forEach((t) => {
    $(`tab-${t}`).setAttribute("aria-selected", String(t === name));
    $(`f-${t}`).classList.toggle("hidden", t !== name);
  });
}
tabs.forEach((t) => $(`tab-${t}`).addEventListener("click", () => showTab(t)));

// Eye button on every password box, to check what was typed.
const EYE = `<svg class="eye-on" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
  <svg class="eye-off" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7a9.8 9.8 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>`;
document.querySelectorAll('input[type="password"]').forEach((input) => {
  const wrap = document.createElement("span");
  wrap.className = "pw-wrap";
  input.replaceWith(wrap);
  wrap.appendChild(input);
  const b = document.createElement("button");
  b.type = "button";
  b.className = "pw-eye";
  b.setAttribute("aria-label", "Show what I typed");
  b.setAttribute("aria-pressed", "false");
  b.innerHTML = EYE;
  b.addEventListener("click", () => {
    const show = input.type === "password";
    input.type = show ? "text" : "password";
    b.setAttribute("aria-pressed", String(show));
    b.setAttribute("aria-label", show ? "Hide what I typed" : "Show what I typed");
    input.focus();
  });
  wrap.appendChild(b);
});
if (location.hash === "#join") showTab("join");

// Sign in / join / create team: all three answer {session, user}
document.querySelectorAll("form[data-api]").forEach((f) => {
  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = f.querySelector(".msg");
    msg.textContent = "";
    const btn = f.querySelector("button[type=submit]");
    btn.disabled = true;
    try {
      const res = await fetch(f.dataset.api, { method: "POST", body: new FormData(f) });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) { msg.textContent = data.error || `Something went wrong (${res.status}).`; return; }
      Site.setSession(data.session);
      await render();
    } catch (err) {
      msg.textContent = "Couldn't reach the server. Check your connection and try again.";
    } finally { btn.disabled = false; }
  });
});

$("signOut").addEventListener("click", async () => {
  await fetch("/api/auth/signout", { method: "POST" }).catch(() => {});
  Site.setSession(null);
  render();
});

// ── Progress (players: their own; coaches: tap a player) ────────────────
function spark(rates) {
  const max = Math.max(...rates, 1);
  return `<span class="spark" aria-hidden="true">${rates.map((r) => `<i style="height:${Math.max(2, Math.round(28 * r / max))}px"></i>`).join("")}</span>`;
}
function fmtDate(d) {
  if (!d) return "";
  const t = new Date(d + "T12:00:00");
  return isNaN(t) ? esc(d) : t.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
const CHEV = `<svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>`;
const TREND_WORDS = { shrinking: "↓ shrinking", growing: "↑ growing", "about the same": "→ same", "not enough yet": "new" };
const trendPill = (t) => `<span class="trend ${t === "shrinking" ? "shrinking" : t === "growing" ? "growing" : ""}">${esc(TREND_WORDS[t] || t)}</span>`;

// Player dashboard: short. This week's one thing, 3 fixes (details fold), trends, history folded.
function progressHtml(p) {
  if (!p.matches.length) {
    return `<div class="panel"><h2>Your progress</h2>
      <p class="lead">No matches yet. When you (or a teammate) type your name in the player boxes while marking the court, the match shows up here.</p></div>`;
  }
  const fixes = p.fixes || [];
  const focusFix = p.focus && fixes.find((f) => f.id === p.focus.id);
  const focusTry = focusFix && focusFix.advice.try_this;
  const focus = p.focus ? `<div class="panel focus"><div class="eyebrow">This week</div>
      <h2>${esc(p.focus.title)}</h2>${focusTry ? `<p class="lead"><strong>Try this:</strong> ${esc(focusTry)}</p>` : ""}</div>` : "";
  const fixList = fixes.length ? `<div class="panel"><h2>Your fixes</h2>
      <ol class="fixes">${fixes.map((f, i) => {
        const a = f.advice || {};
        const steps = [["In matches", a.match_strategy], ["Habit", a.habit], ["Drill", a.practice_drill]].filter(([, t]) => t);
        return `<li class="fix"><details><summary>
            <span class="rank">${i + 1}</span><span class="fix-title">${esc(a.headline || f.title)}</span>${trendPill(f.trend)}${CHEV}</summary>
          ${a.try_this ? `<p class="try"><strong>Try this:</strong> ${esc(a.try_this)}</p>` : ""}
          ${steps.length ? `<dl class="steps">${steps.map(([k, t]) => `<dt>${k}</dt><dd>${esc(t)}</dd>`).join("")}</dl>` : ""}
        </details></li>`;
      }).join("")}</ol>
      <p class="more"><a href="${Site.reportUrl(fixes[0].job_id)}">Open the full report</a></p></div>` : "";
  const good = (p.strengths || []).length ? `<div class="panel"><h2>What you did well</h2>
      <ul class="good">${p.strengths.map((s) => `<li><span class="g-title">${esc(s.title)}</span>
        ${s.detail ? `<span class="muted">${esc(s.detail)}</span>` : ""}</li>`).join("")}</ul></div>` : "";
  const trends = p.weaknesses.slice(0, 4).map((w) => `<li><span class="t-title">${esc(w.title)}</span>${spark(w.rates)}${trendPill(w.trend)}</li>`).join("");
  const history = p.matches.slice().reverse().map((m) => {
    const tag = m.result
      ? `<span class="result ${m.result}">${m.result === "win" ? "WIN" : "LOSS"}</span>
         <button class="linkish small-link" type="button" data-result="${m.result === "win" ? "loss" : "win"}" data-job="${esc(m.job_id)}"
           aria-label="Change to ${m.result === "win" ? "loss" : "win"}">change</button>`
      : `<span class="set-result">Result? <button class="chip" type="button" data-result="win" data-job="${esc(m.job_id)}">Won</button>
         <button class="chip" type="button" data-result="loss" data-job="${esc(m.job_id)}">Lost</button></span>`;
    const pts = m.points_won != null ? `<span class="h-pts">Points <b>${m.points_won}–${m.points_lost}</b></span>` : "";
    const sets = m.sets && m.sets.length ? `<span class="h-pts">Sets <b>${m.sets.map(esc).join(", ")}</b></span>` : "";
    return `<li><div class="h-top"><a href="${Site.reportUrl(m.job_id)}">${fmtDate(m.date)}</a>${tag}</div>
      <div class="h-stats">${pts}${sets}${m.top_fix ? `<span class="muted">#1 fix: ${esc(m.top_fix.title)}</span>` : ""}</div></li>`;
  }).join("");
  return `${focus}${good}${fixList}
    ${trends ? `<div class="panel"><h2>Trends</h2><ul class="trends">${trends}</ul></div>` : ""}
    <details class="panel fold"><summary><h2>Match history (${p.matches.length})</h2>${CHEV}</summary><ul class="history">${history}</ul></details>`;
}

async function showProgress(keepHistoryOpen) {
  const box = $("progressBox");
  if (!keepHistoryOpen) box.innerHTML = '<p class="muted">Loading progress…</p>';
  const res = await fetch("/api/progress");
  const data = await res.json().catch(() => ({}));
  box.innerHTML = res.ok ? progressHtml(data) : `<p class="msg">${esc(data.error || "Couldn't load progress.")}</p>`;
  if (keepHistoryOpen) box.querySelector("details.fold")?.setAttribute("open", "");
}
// Win/Loss: set from the score or points; the player can change it (videos often stop before the match ends).
$("progressBox").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-result]");
  if (!b) return;
  b.disabled = true;
  const fd = new FormData();
  fd.set("job_id", b.dataset.job);
  fd.set("result", b.dataset.result);
  await fetch("/api/me/result", { method: "POST", body: fd }).catch(() => {});
  showProgress(true);
});

// Coach: high level only. Team weak spots with a drill each, then one line per player.
async function showTeam() {
  const res = await fetch("/api/team");
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { $("teamTable").innerHTML = `<p class="msg">${esc(data.error || "Couldn't load the team.")}</p>`; return; }
  if (!data.players.length) {
    $("teamFocus").innerHTML = "";
    $("teamTable").innerHTML = '<p class="muted">No players yet. Share the team code above.</p>';
    return;
  }
  const withReports = data.players.filter((p) => p.matches).length;
  const ofPlayers = (n) => `<span class="muted">${n} of ${withReports} player${withReports === 1 ? "" : "s"}</span>`;
  const weak = data.team_focus.length ? `<div class="panel focus"><h2>Team weak spots</h2>
      <ol class="team-focus">${data.team_focus.map((t) => `<li>
        <div class="tf-head"><h3>${esc(t.title)}</h3>${ofPlayers(t.players.length)}</div>
        ${t.drill ? `<p class="tf-drill"><strong>Team drill:</strong> ${esc(t.drill)}</p>` : ""}</li>`).join("")}</ol></div>` : "";
  const strong = (data.team_strengths || []).length ? `<div class="panel"><h2>Team strengths</h2>
      <ul class="good">${data.team_strengths.map((s) => `<li class="tf-head"><span class="g-title">${esc(s.title)}</span>${ofPlayers(s.players.length)}</li>`).join("")}</ul></div>` : "";
  const firsts = data.players.filter((p) => p.problems.length);
  const ones = firsts.length ? `<div class="panel"><h2>#1 fix for each player</h2>
      <table class="ones"><thead><tr><th>Player</th><th>#1 fix</th><th>Trend</th></tr></thead><tbody>
      ${firsts.map((p) => `<tr><td class="r-name">${esc(p.name)}</td><td>${esc(p.problems[0].title)}</td><td>${trendPill(p.problems[0].trend)}</td></tr>`).join("")}
      </tbody></table></div>` : "";
  $("teamFocus").innerHTML = weak + strong + ones;
  $("teamTable").innerHTML = `<ul class="roster">${data.players.map((p) => {
    return `<li><details><summary>
        <span class="r-name">${esc(p.name)}</span>
        <span class="r-top muted">${p.matches ? `${p.matches} match${p.matches === 1 ? "" : "es"}${p.latest ? ` · last ${fmtDate(p.latest.date)}` : ""}` : "No report yet"}</span>
        ${CHEV}</summary>
      <div class="r-body">
        ${p.problems.length ? `<p class="r-label">Top fixes</p><ol class="r-problems">${p.problems.map((x) => `<li>${esc(x.title)} ${trendPill(x.trend)}</li>`).join("")}</ol>` : ""}
        <p class="r-actions">${p.latest ? `<a href="${Site.reportUrl(p.latest.job_id)}">Latest report</a> · ` : ""}
          <button class="linkish" type="button" data-reset="${esc(p.username)}" data-name="${esc(p.name)}">New password</button></p>
      </div></details></li>`;
  }).join("")}</ul>`;
}
$("teamTable").addEventListener("click", async (e) => {
  const reset = e.target.closest("[data-reset]");
  if (reset) {
    const pw = prompt(`New password for ${reset.dataset.name} (at least 8 characters). Tell them in person.`);
    if (!pw) return;
    const fd = new FormData();
    fd.set("player", reset.dataset.reset);
    fd.set("new_password", pw);
    const res = await fetch("/api/team/reset-password", { method: "POST", body: fd });
    const data = await res.json().catch(() => ({}));
    alert(res.ok ? "Done. They can sign in with the new password now." : (data.error || "Couldn't change it."));
  }
});

async function render() {
  const me = Site.session() ? await fetch("/api/me").then((r) => r.json()).catch(() => ({})) : {};
  const user = me.user;
  $("signedOut").classList.toggle("hidden", !!user);
  $("signedIn").classList.toggle("hidden", !user);
  if (!user) return;
  $("hello").textContent = `Hi, ${user.name}`;
  $("teamLine").textContent = `${user.role === "coach" ? "Coach of" : "Player on"} ${me.team?.name || "your team"}`;
  const coach = user.role === "coach";
  $("coachBox").classList.toggle("hidden", !coach);
  if (coach) {
    $("teamCode").textContent = me.team.code;
    $("progressBox").innerHTML = "";
    $("teamLine").textContent = `Coach of ${me.team?.name || "your team"}`;
    showTeam();
  } else {
    showProgress();
  }
}
render();
</script>
</body>
</html>
