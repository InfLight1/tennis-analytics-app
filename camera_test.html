<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera Check · Advantage AI</title>
<meta name="description" content="Checks what this phone can record inside Advantage AI.">
<meta name="theme-color" content="#15261C">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Newsreader:opsz,wght@6..72,400..600&display=swap" rel="stylesheet">
<style>
/* Same dark court-green tokens as Home and the report (see DESIGN.md). */
:root {
  --font-serif: "Newsreader", "Iowan Old Style", Georgia, serif;
  --font-sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --text-sm: 0.9375rem; --text-base: 1.0625rem; --text-lg: 1.1875rem; --text-2xl: 2rem;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px; --space-7: 48px; --space-8: 64px;
  --gutter: 16px; --col: 760px; --tap: 48px;
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-pill: 999px;
  color-scheme: dark;
  --bg: #15261C; --surface: #1C3226; --surface-2: #243D2F; --line: #31503D; --line-strong: #46684F;
  --ink: #F1F6EF; --ink-2: #DFEADD; --muted: #C3D3C3; --dim: #9AAE9C;
  --accent: #8ED19D; --accent-soft: #24452F; --on-accent: #10200F; --bad: #E0907F;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 var(--text-base)/1.55 var(--font-sans); -webkit-font-smoothing: antialiased; }
.wrap { max-width: calc(var(--col) + 2 * var(--gutter)); margin: 0 auto; padding: 0 var(--gutter); }
h1 { margin: var(--space-7) 0 var(--space-3); font: 500 2.5rem/1.1 var(--font-serif); letter-spacing: -0.02em; }
p { margin: 0 0 var(--space-3); color: var(--ink-2); max-width: 62ch; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: var(--tap); padding: 0 var(--space-5);
  border-radius: var(--radius-pill); border: 0; background: var(--accent); color: var(--on-accent); font: 650 var(--text-base)/1 var(--font-sans); cursor: pointer; }
.btn:disabled { opacity: .5; cursor: default; }
video { display: block; width: 100%; margin-top: var(--space-5); border-radius: var(--radius-md); background: #000; aspect-ratio: 16 / 9; object-fit: contain; }
#progress { margin-top: var(--space-3); color: var(--muted); }
.panel { margin: var(--space-5) 0 var(--space-8); padding: var(--space-5); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); }
.verdict { font: 500 1.5rem/1.3 var(--font-serif); color: var(--ink); margin-bottom: var(--space-4); }
.verdict.bad { color: var(--bad); }
dl { display: grid; grid-template-columns: auto 1fr; gap: var(--space-2) var(--space-4); margin: 0; }
dt { color: var(--muted); }
dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.hidden { display: none !important; }
</style>
<link rel="stylesheet" href="site.css">
</head>
<body>
<header id="topbar" data-page="test"></header>
<main class="wrap">
  <h1>Camera check</h1>
  <p>Checks what this phone can record inside Advantage AI. Hold the phone sideways, point it at anything, and press Start. It records for 20 seconds. Nothing is uploaded or saved.</p>
  <button type="button" class="btn" id="startBtn">Start camera check</button>
  <video id="preview" muted playsinline autoplay class="hidden"></video>
  <div id="progress" role="status"></div>
  <section class="panel hidden" id="results" aria-live="polite">
    <div class="verdict" id="verdict"></div>
    <dl id="facts"></dl>
  </section>
</main>
<footer id="sitefoot"></footer>
<script src="site.js"></script>
<script src="recorder.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const SECONDS = 20;
const mb = (b) => (b / (1024 * 1024)).toFixed(1);

function show(verdict, bad, facts) {
  $("verdict").textContent = verdict;
  $("verdict").classList.toggle("bad", bad);
  $("facts").innerHTML = facts.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
  $("results").classList.remove("hidden");
}

$("startBtn").addEventListener("click", async () => {
  $("startBtn").disabled = true;
  $("results").classList.add("hidden");
  let cam;
  try {
    cam = await Recorder.openCamera();
  } catch (e) {
    show(`The camera didn't open: ${e.message}`, true, [["Browser", navigator.userAgent]]);
    $("startBtn").disabled = false;
    return;
  }
  const v = $("preview");
  v.srcObject = cam.stream;
  v.classList.remove("hidden");
  await v.play().catch(() => {});
  const s = cam.track.getSettings();
  const sizes = [];
  let rec;
  try {
    rec = Recorder.start(cam.stream, (blob) => { sizes.push(blob.size); });
  } catch (e) {
    cam.track.stop();
    show(`Recording didn't start: ${e.message}`, true, [["Browser", navigator.userAgent]]);
    $("startBtn").disabled = false;
    return;
  }
  const t0 = Date.now();
  for (let left = SECONDS; left > 0; left--) {
    $("progress").textContent = `Recording… ${left} s left`;
    await new Promise((r) => setTimeout(r, 1000));
  }
  await rec.stop();
  const secs = (Date.now() - t0) / 1000;
  cam.track.stop();
  v.classList.add("hidden");
  $("progress").textContent = "";

  const total = sizes.reduce((a, b) => a + b, 0);
  const w = s.width || v.videoWidth, h = s.height || v.videoHeight;
  const long = Math.max(w, h), short = Math.min(w, h);
  const sideways = w >= h;
  const fourK = short >= 2160;
  const hd = short >= 1080;
  const perMin = total / secs * 60;
  const verdict = !hd ? `This phone gives only ${short}p in a web page: too small for good results.`
    : fourK ? "4K works here: recording in the app keeps full accuracy."
    : `This phone gives ${short}p in a web page: recording in the app works, a little less accurate than 4K.`;
  show(verdict, !hd, [
    ["Picture size", `${long} × ${short} (${fourK ? "4K" : `${short}p`})`],
    ["Frames per second", s.frameRate ? Math.round(s.frameRate) : "not reported"],
    ["Held sideways", sideways ? "yes" : "no: turn the phone sideways and run it again"],
    ["Recording format", rec.type || "browser default"],
    ["Asked-for quality", `${(rec.bitrate / 1e6).toFixed(1)} Mbps`],
    ["Size", `${mb(total)} MB in ${Math.round(secs)} s = about ${Math.round(perMin / (1024 * 1024))} MB per minute`],
    ["Pieces", `${sizes.length} (one every ~4 s)`],
    ["Browser", navigator.userAgent],
  ]);
  $("startBtn").textContent = "Run it again";
  $("startBtn").disabled = false;
});
</script>
</body>
</html>
