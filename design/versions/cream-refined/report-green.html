<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match Report · Advantage AI</title>
<meta name="description" content="Example match report: what is costing each player points and what to practise.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Newsreader:opsz,wght@6..72,400..600&display=swap" rel="stylesheet">
<script>
  try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
/* ── Design tokens: every decision lives here ─────────────────────────── */
:root {
  --font-serif: "Newsreader", "Iowan Old Style", Georgia, serif;
  --font-sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --text-sm: 0.9375rem;
  --text-base: 1.0625rem;
  --text-lg: 1.1875rem;
  --text-xl: 1.5rem;
  --text-2xl: 2rem;
  --text-display: clamp(2.25rem, 1.5rem + 3.6vw, 3.5rem);
  --text-num: 2.25rem;
  --leading-tight: 1.08;
  --leading-snug: 1.3;
  --leading-body: 1.55;
  --tracking-display: -0.025em;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-5: 24px; --space-6: 32px; --space-7: 48px; --space-8: 64px; --space-9: 96px;
  --gutter: 16px;
  --col: 760px;
  --tap: 48px;
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-pill: 999px;
  --bar-w: 3px;
  --ring-size: 168px;
  --ring-size-phone: 136px;
  --ring-num: 2.75rem;
  --panel-pad: var(--space-6);
  --panel-gap: var(--space-5);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --dur: 220ms;

  color-scheme: light;
  --bg: #E8EFE6;
  --surface: #FBFCFA;
  --surface-2: #E0E9DD;
  --line: #CBD8C7;
  --line-strong: #A9BCA5;
  --ink: #122016;
  --ink-2: #213226;
  --muted: #3A4C3E;
  --dim: #58695B;
  --accent: #23683A;
  --accent-strong: #215630;
  --accent-soft: #D7E8D5;
  --on-accent: #FFFFFF;
  --bad: #A2443A;
  --bad-soft: #F5E4DF;
  /* chart segments: one hue per view, stepped in strength */
  --won-1: #2B6A3B; --won-2: #5E9468; --won-3: #93BB98; --won-4: #C4DBC4;
  --lost-1: #A2443A; --lost-2: #C2756A; --lost-3: #D9A399; --lost-4: #EBCBC3; --lost-5: #6E2E27; --lost-6: #463F35;
  --shadow-1: 0 1px 2px rgba(18, 40, 24, 0.06), 0 10px 28px -14px rgba(18, 40, 24, 0.25);
  --focus: 0 0 0 3px var(--bg), 0 0 0 5px var(--accent);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0E1912; --surface: #15251A; --surface-2: #1C3123; --line: #284031; --line-strong: #3A5743;
    --ink: #F1F6EF; --ink-2: #DFEADD; --muted: #C3D3C3; --dim: #9AAE9C;
    --accent: #8ED19D; --accent-strong: #A6DFB2; --accent-soft: #1E3A27; --on-accent: #10200F;
    --bad: #E0907F; --bad-soft: #3A2622;
    --won-1: #86C795; --won-2: #5F9D6C; --won-3: #3F7449; --won-4: #2C4F33;
    --lost-1: #E0907F; --lost-2: #B86C5E; --lost-3: #8E4E43; --lost-4: #66382F; --lost-5: #F2C2B7; --lost-6: #D6CFC2;
    --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 32px -16px rgba(0, 0, 0, 0.6);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0E1912; --surface: #15251A; --surface-2: #1C3123; --line: #284031; --line-strong: #3A5743;
  --ink: #F1F6EF; --ink-2: #DFEADD; --muted: #C3D3C3; --dim: #9AAE9C;
  --accent: #8ED19D; --accent-strong: #A6DFB2; --accent-soft: #1E3A27; --on-accent: #10200F;
  --bad: #E0907F; --bad-soft: #3A2622;
  --won-1: #86C795; --won-2: #5F9D6C; --won-3: #3F7449; --won-4: #2C4F33;
  --lost-1: #E0907F; --lost-2: #B86C5E; --lost-3: #8E4E43; --lost-4: #66382F; --lost-5: #F2C2B7; --lost-6: #D6CFC2;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 32px -16px rgba(0, 0, 0, 0.6);
}

/* ── Base ─────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: var(--space-5); }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 400 var(--text-base)/var(--leading-body) var(--font-sans);
  -webkit-font-smoothing: antialiased; caret-color: var(--accent); scrollbar-color: var(--line-strong) var(--bg); }
::selection { background: var(--accent); color: var(--on-accent); }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
:focus-visible { outline: none; box-shadow: var(--focus); border-radius: var(--radius-sm); }
h1, h2, h3 { margin: 0; font-weight: 500; text-wrap: balance; }
h2 { font: 500 var(--text-2xl)/var(--leading-tight) var(--font-serif); letter-spacing: -0.015em; }
h3 { font: 600 var(--text-lg)/var(--leading-snug) var(--font-sans); }
p { margin: 0; text-wrap: pretty; }
.muted { color: var(--muted); }
.wrap { max-width: calc(var(--col) + 2 * var(--gutter)); margin: 0 auto; padding: 0 var(--gutter); }
.num { font-variant-numeric: tabular-nums; }

/* ── Top bar ──────────────────────────────────────────────────────────── */
.topbar { border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 0 var(--space-2); min-height: 64px; }
.brand-ai { color: var(--accent); }
.brand { display: inline-flex; align-items: center; gap: 10px; min-height: var(--tap); margin-right: auto;
  color: var(--ink); text-decoration: none; font-weight: 650; font-size: var(--text-lg); letter-spacing: -0.01em; }
.nav { display: flex; gap: var(--space-1); }
.nav a { display: inline-flex; align-items: center; min-height: var(--tap); padding: 0 var(--space-3);
  color: var(--ink-2); text-decoration: none; font-weight: 550; border-radius: var(--radius-sm); }
.nav a:hover { color: var(--ink); background: var(--surface-2); }
.theme-btn { width: var(--tap); height: var(--tap); display: grid; place-items: center; border: 1px solid var(--line);
  background: transparent; color: var(--ink); border-radius: var(--radius-pill); cursor: pointer; }
.theme-btn:hover { background: var(--surface-2); }
.theme-btn .moon { display: none; }
:root[data-theme="dark"] .theme-btn .sun { display: none; }
:root[data-theme="dark"] .theme-btn .moon { display: block; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .theme-btn .sun { display: none; }
  :root:not([data-theme="light"]) .theme-btn .moon { display: block; }
}
@media (max-width: 559px) {
  .theme-btn { order: 2; }
  .nav { order: 3; width: 100%; margin: 0 calc(-1 * var(--space-3)); }
}

/* ── Page head + tabs ─────────────────────────────────────────────────── */
.page-head { padding: var(--space-7) 0 var(--space-5); }
.page-head .label { color: var(--muted); font-weight: 550; }
.page-head h1 { margin-top: var(--space-1); font: 500 var(--text-display)/var(--leading-tight) var(--font-serif); letter-spacing: var(--tracking-display); }
.page-head h1 .vs { color: var(--muted); font-style: italic; font-weight: 400; }
.page-head .score { margin-top: var(--space-2); font-size: var(--text-lg); color: var(--ink-2); }
.page-head .score b { color: var(--ink); font-variant-numeric: tabular-nums; }

.tabs { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--line); }
.tabs button { min-height: 56px; border: 0; background: transparent; cursor: pointer; color: var(--dim);
  font: 500 var(--text-xl)/1 var(--font-serif); letter-spacing: -0.01em; position: relative; border-radius: 0;
  transition: color var(--dur) var(--ease-out); }
.tabs button:hover { color: var(--ink-2); }
.tabs button[aria-selected="true"] { color: var(--ink); }
.tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: var(--bar-w); background: var(--accent); border-radius: 2px; }

.first-fix { display: grid; grid-template-columns: 1fr auto; gap: var(--space-2) var(--space-4); align-items: start;
  margin: var(--space-5) 0 0; padding: var(--space-5) var(--space-5) var(--space-5) calc(var(--space-5) + var(--bar-w));
  position: relative; border-radius: var(--radius-lg); background: var(--accent-soft); color: var(--ink); text-decoration: none;
  transition: background var(--dur) var(--ease-out); }
.first-fix::before { content: ""; position: absolute; left: 0; top: var(--space-4); bottom: var(--space-4); width: 4px; border-radius: 0 3px 3px 0; background: var(--accent); }
.first-fix:hover { background: color-mix(in oklab, var(--accent-soft), var(--accent) 12%); }
.first-fix .ff-label { grid-column: 1 / -1; font-weight: 650; color: var(--accent); letter-spacing: 0.01em; }
.first-fix .ff-text { font: 500 var(--text-2xl)/var(--leading-snug) var(--font-serif); letter-spacing: -0.015em; text-wrap: pretty; }
.first-fix .pts { font-size: var(--text-base); min-height: 34px; padding: 0 14px; margin-top: 4px; }
.first-fix .ff-go { grid-column: 1 / -1; display: inline-flex; align-items: center; gap: var(--space-2); margin-top: var(--space-1); font-weight: 650; color: var(--accent); }
.first-fix .ff-go svg { flex: none; }
@media (max-width: 559px) {
  .first-fix { grid-template-columns: 1fr; padding: var(--space-4) var(--space-4) var(--space-4) calc(var(--space-4) + var(--bar-w)); }
  .first-fix .ff-text { font-size: var(--text-xl); }
  .first-fix .pts { justify-self: start; margin-top: 0; }
}

/* ── Sections ─────────────────────────────────────────────────────────── */
.sec { margin-top: var(--panel-gap); padding: var(--panel-pad); background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-1); scroll-margin-top: var(--space-4); }
@media (max-width: 559px) { .sec { padding: var(--space-5) var(--space-4); } }
.sec > h2 { margin-bottom: var(--space-5); }
.sec-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-5); }

/* hero */
.tags { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-bottom: var(--space-5); }
.tag { display: inline-flex; align-items: center; min-height: 32px; padding: 0 var(--space-3); border-radius: var(--radius-pill);
  border: 1px solid var(--line-strong); color: var(--ink-2); font-weight: 550; font-size: var(--text-sm); }
.rings { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-5); }
.ring-item { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--space-3); }
.ring { position: relative; width: var(--ring-size); height: var(--ring-size); flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .val { position: absolute; inset: 0; display: grid; place-items: center; font: 500 var(--ring-num)/1 var(--font-serif); font-variant-numeric: tabular-nums; }
.ring-lbl { font-weight: 650; font-size: var(--text-lg); }
.ring-ctx { color: var(--muted); font-variant-numeric: tabular-nums; }
@media (max-width: 559px) {
  :root { --ring-size: var(--ring-size-phone); --ring-num: 2.25rem; }
  .rings { gap: var(--space-3); }
}
.minis { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); margin: var(--space-6) 0 0; padding: 0; }
.mini { padding: var(--space-4); background: var(--surface-2); border-radius: var(--radius-md); }
.mini .mv { margin: 0; font: 500 var(--text-num)/1 var(--font-serif); font-variant-numeric: tabular-nums; }
.mini .mv.todo { font: 600 var(--text-base)/2.25rem var(--font-sans); color: var(--muted); }
.mini .ml { margin-top: var(--space-2); color: var(--ink-2); font-size: var(--text-sm); font-weight: 550; }
.summary { margin-top: var(--space-6); font: 400 1.3125rem/1.5 var(--font-serif); color: var(--ink); max-width: 62ch; }

/* lost/won switch */
.seg { display: inline-flex; padding: 3px; border-radius: var(--radius-pill); background: var(--surface-2); }
.seg button { min-height: 42px; min-width: 76px; padding: 0 var(--space-4); border: 0; border-radius: var(--radius-pill);
  background: transparent; color: var(--ink-2); font: 600 var(--text-base)/1 var(--font-sans); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }
.bar { display: flex; gap: 2px; height: 28px; border-radius: var(--radius-sm); overflow: hidden; }
.bar span { min-width: 6px; }
.legend { list-style: none; margin: var(--space-4) 0 0; padding: 0; }
.legend li { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) 0; border-top: 1px solid var(--line); color: var(--ink-2); }
.legend li:first-child { border-top: 0; }
.legend i { width: 14px; height: 14px; border-radius: 4px; flex: none; }
.legend .n { margin-left: auto; font-weight: 650; color: var(--ink); font-variant-numeric: tabular-nums; }
.legend .total { color: var(--muted); }

/* fixes: vertical list, the open (or first) one carries the green bar */
.fixes { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-5); }
.fix { position: relative; display: grid; grid-template-columns: 2.5rem 1fr; gap: 0 var(--space-3); padding: var(--space-1) 0 var(--space-1) var(--space-5); }
.fix::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: var(--bar-w); border-radius: 2px; background: var(--line); transition: background var(--dur) var(--ease-out); }
.fix.is-first::before, .fix:has(details[open])::before { background: var(--accent); }
.rank { font: 500 2.5rem/1 var(--font-serif); color: var(--dim); font-variant-numeric: tabular-nums; }
.fix.is-first .rank, .fix:has(details[open]) .rank { color: var(--accent); }
.fix-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-2) var(--space-3); }
.fix-head h3 { text-wrap: pretty; font: 500 var(--text-xl)/var(--leading-snug) var(--font-serif); letter-spacing: -0.01em; flex: 1 1 14ch; }
.pts { display: inline-flex; align-items: center; min-height: 28px; padding: 0 10px; border-radius: var(--radius-pill);
  font-weight: 700; font-size: var(--text-sm); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pts.lost { color: var(--bad); background: var(--bad-soft); }
.pts.won { color: var(--accent); background: var(--accent-soft); }
.try { margin-top: var(--space-3); color: var(--ink-2); max-width: 62ch; }
.try b { color: var(--ink); font-weight: 650; }
.moments { margin-top: var(--space-3); color: var(--muted); font-size: var(--text-sm); }
.moments .t { color: var(--ink-2); font-weight: 600; font-variant-numeric: tabular-nums; }
.fix-body { grid-column: 2; min-width: 0; }
@media (max-width: 559px) {
  .fix { grid-template-columns: 1fr; padding-left: var(--space-4); }
  .rank { font-size: 2rem; margin-bottom: var(--space-2); }
  .fix-body { grid-column: 1; }
}
details.more { margin-top: var(--space-3); }
details summary { list-style: none; cursor: pointer; }
details summary::-webkit-details-marker { display: none; }
details.more > summary { display: inline-flex; align-items: center; gap: var(--space-2); min-height: var(--tap); font-weight: 650; color: var(--accent); }
details summary svg { flex: none; transition: transform var(--dur) var(--ease-out); }
details[open] > summary svg { transform: rotate(180deg); }
.advice { display: grid; gap: var(--space-4); padding: var(--space-4) var(--space-5); background: var(--surface-2); border-radius: var(--radius-md); }
.advice div { color: var(--ink-2); max-width: 62ch; }
.advice b { display: block; color: var(--ink); font-weight: 650; margin-bottom: 2px; }

/* keep doing */
.keeps { list-style: none; margin: 0; padding: 0; }
.keep { display: flex; align-items: baseline; gap: var(--space-3); padding: var(--space-4) 0; border-top: 1px solid var(--line); }
.keep:first-child { border-top: 0; padding-top: 0; }
.keep h3 { flex: 1; text-wrap: pretty; font: 500 var(--text-lg)/var(--leading-snug) var(--font-serif); font-size: 1.3125rem; }
.ai-note { margin-top: var(--space-6); color: var(--muted); font-size: var(--text-sm); max-width: 62ch; }

/* folds */
details.fold { margin-top: var(--space-3); padding: 0 var(--panel-pad); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); }
#player > details.fold { margin-top: var(--panel-gap); }
@media (max-width: 559px) { details.fold { padding: 0 var(--space-4); } }
details.fold > summary { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); min-height: 64px;
  font: 500 var(--text-xl)/1.2 var(--font-serif); color: var(--ink); }
details.fold > summary:hover { color: var(--accent); }
details.fold > summary svg { color: var(--muted); }
.fold-body { padding: 0 0 var(--space-6); }
.fold-body p + p { margin-top: var(--space-3); }
.fold-body p { color: var(--ink-2); max-width: 66ch; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); }
.tile { padding: var(--space-4); background: var(--surface-2); border-radius: var(--radius-md); }
.tile .v { font: 500 var(--text-num)/1 var(--font-serif); font-variant-numeric: tabular-nums; }
.tile .l { margin-top: var(--space-2); font-weight: 600; font-size: var(--text-sm); }
.tile .c { color: var(--muted); font-size: var(--text-sm); font-variant-numeric: tabular-nums; }
@media (max-width: 459px) {
  .tiles { grid-template-columns: 1fr; }
  .tile { padding: var(--space-3) var(--space-4); display: grid; grid-template-columns: 5.5rem 1fr; align-items: baseline; gap: 0 var(--space-3); }
  .tile .l { margin: 0; }
  .tile .c { grid-column: 2; }
  .tile .v { grid-row: span 2; }
}
.sub-h { margin: var(--space-7) 0 var(--space-4); font: 600 var(--text-lg)/1.3 var(--font-sans); }
.early { list-style: none; margin: 0; padding: 0; }
.early li { padding: var(--space-3) 0; border-top: 1px solid var(--line); color: var(--ink-2); }
.early li:first-child { border-top: 0; }
.playstyle { margin-top: var(--space-6); }

#tip { position: fixed; z-index: 10; display: none; max-width: 260px; padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm);
  background: var(--ink); color: var(--bg); font-size: var(--text-sm); pointer-events: none; box-shadow: var(--shadow-1); }
.end { height: var(--space-8); }

@media (min-width: 768px) {
  :root { --gutter: 24px; }
  .page-head { padding-top: var(--space-8); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } html { scroll-behavior: auto; } }
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="index-green.html" aria-label="Advantage AI, home">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
        <circle cx="14" cy="14" r="12.5" fill="var(--accent)"/>
        <path d="M5.2 5.6c4.4 3.6 4.4 13.2 0 16.8M22.8 5.6c-4.4 3.6-4.4 13.2 0 16.8" fill="none" stroke="var(--bg)" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span>Advantage <span class="brand-ai">AI</span></span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="index-green.html#new">New analysis</a>
      <a href="index-green.html#reports">My reports</a>
    </nav>
    <button type="button" class="theme-btn" id="themeBtn" aria-label="Switch light/dark" title="Switch light/dark">
      <svg class="sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <header class="page-head">
    <div class="label">Match report</div>
    <h1 id="title"></h1>
    <p class="score" id="subtitle"></p>
  </header>
  <div class="tabs" role="tablist" aria-label="Player" id="tabs"></div>

function clock(sec) {
  const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, ss = String(sec % 60).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${ss}` : `${m}:${ss}`;
}
const MAX_MOMENTS = 5;
function momentsLine(moments) {
  if (!moments || !moments.length) return "";
  const shown = moments.slice(0, MAX_MOMENTS).map((t) => `<span class="t">${clock(t)}</span>`).join(" · ");
  const more = moments.length > MAX_MOMENTS ? ` and ${moments.length - MAX_MOMENTS} more` : "";
  return `<p class="moments">Find these moments in your video: ${shown}${more}</p>`;
}
const firstSentence = (t) => (t || "").split(/(?<=[.!?])\s/)[0];
const headlineOf = (p) => (p.advice && p.advice.headline) || p.title;

// One fix, always the same shape: rank, headline, −N pts, one line (Try this / Why), times, fold.
function fixCard(p, rank, first) {
  const a = p.advice;
  const pts = p.points ? `<span class="pts lost">−${p.points} pts</span>` : "";
  const tryLine = a ? (a.try_this || firstSentence(a.match_strategy)) : "";
  const line = tryLine ? `<b>Try this:</b> ${esc(tryLine)}` : `<b>Why:</b> ${esc(p.detail)}`;
  const steps = !a ? [] : [["In matches", a.match_strategy], ["Habit to build", a.habit], ["Practice drill", a.practice_drill]].filter(([, t]) => t);
  return `<li class="fix${first ? " is-first" : ""}" id="fix-${esc(p.id)}">
    <div class="rank" aria-label="Number ${rank}">${rank}</div>
    <div class="fix-body">
      <div class="fix-head"><h3>${esc(headlineOf(p))}</h3>${pts}</div>
      <p class="try">${line}</p>
      ${momentsLine(p.moments)}
      <details class="more"><summary>${a ? "How to practise it" : "Details"} ${CHEV}</summary>
        <div class="advice">${steps.map(([h, t]) => `<div><b>${h}</b>${esc(t)}</div>`).join("")}<div><b>Why</b>${esc(p.detail)}</div></div>
      </details>
    </div>
  </li>`;
}

function ring(value, color, label, ctx) {
  const v = value === null || value === undefined ? null : Math.max(0, Math.min(100, value));
  const C = 2 * Math.PI * 42;
  const arc = !v ? "" : `<circle cx="50" cy="50" r="42" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(C * v / 100).toFixed(1)} ${C.toFixed(1)}"/>`;
  return `<div class="ring-item"><div class="ring" role="img" aria-label="${esc(label)}: ${pct(v)}, ${esc(ctx)}">
      <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="var(--surface-2)" stroke-width="10"/>${arc}</svg>
      <div class="val">${pct(v)}</div></div>
    <div><div class="ring-lbl">${esc(label)}</div><div class="ring-ctx">${esc(ctx)}</div></div></div>`;
}

function stackedBar(parts, total, verb, palette) {
  const shown = parts.filter((x) => x.n > 0);
  if (!total || !shown.length) return `<p class="muted">No points ${verb} yet.</p>`;
  const bar = shown.map((x) => `<span style="flex:${x.n};background:var(--${palette}-${x.slot})" data-tip="${esc(x.label)}: ${x.n} of ${total} points ${verb} (${Math.round(100 * x.n / total)}%)"></span>`).join("");
  const legend = shown.map((x) => `<li><i style="background:var(--${palette}-${x.slot})"></i>${esc(x.label)}<span class="n">${x.n}</span></li>`).join("");
  return `<div class="bar" role="img" aria-label="${esc(shown.map((x) => `${x.label} ${x.n}`).join(", "))}">${bar}</div>
    <ul class="legend">${legend}<li class="total">Total points ${verb}<span class="n">${total}</span></li></ul>`;
}

function render() {
  const P = DATA.players, ids = Object.keys(P);
  $("title").innerHTML = ids.map((id) => esc(P[id].name)).join(' <span class="vs">vs</span> ');
  $("subtitle").innerHTML = `Points won: <b>${P[ids[0]].stats.points_won}–${P[ids[1]].stats.points_won}</b>`;
  $("tabs").innerHTML = ids.map((id) => `<button type="button" role="tab" id="tab-${id}" data-id="${id}" aria-selected="${id === current}" tabindex="${id === current ? 0 : -1}">${esc(P[id].name)}</button>`).join("");
  $("player").setAttribute("aria-labelledby", `tab-${current}`);
  renderPlayer(P[current]);
  $("coverage").innerHTML = DATA.coverage.notes.map((n) => `<p>${esc(n)}</p>`).join("") +
    `<p>Patterns need at least ${DATA.min_sample.occurrences} occurrences out of ${DATA.min_sample.chances} chances before they're ranked; smaller ones are listed as early signs.</p>`;
}
$("tabs").addEventListener("click", (e) => {

});
$("tabs").addEventListener("keydown", (e) => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const ids = Object.keys(DATA.players), i = ids.indexOf(current);
  current = ids[(i + (e.key === "ArrowRight" ? 1 : ids.length - 1)) % ids.length];
  render(); $(`tab-${current}`).focus();
});

    </section>

    <section class="sec" aria-labelledby="barH">
      <div class="sec-head"><h2 id="barH">How ${esc(pl.name)} ${barView} points</h2>
        <div class="seg" role="group" aria-label="Show points lost or won">
          <button type="button" data-view="lost" aria-pressed="${barView === "lost"}">Lost</button>
          <button type="button" data-view="won" aria-pressed="${barView === "won"}">Won</button>
        </div></div>
      ${barView === "lost" ? stackedBar(lostParts, s.points_lost, "lost", "lost") : stackedBar(wonParts, s.points_won, "won", "won")}
    </section>

    <section class="sec" id="fixes" aria-labelledby="fixH">
      <h2 id="fixH">${top.length ? `Top ${top.length} things to fix` : "Things to fix"}</h2>
      ${top.length ? `<ol class="fixes">${top.map((p, i) => fixCard(p, i + 1, i === 0)).join("")}</ol>` : `<p class="muted">Not enough tracked points yet to rank anything.</p>`}
    </section>

    ${keeps.length ? `<section class="sec" aria-labelledby="keepH"><h2 id="keepH">Keep doing</h2>
      <ul class="keeps">${keeps.slice(0, 3).map((p) => `<li class="keep"><h3>${esc(headlineOf(p))}</h3>${p.points ? `<span class="pts won">+${p.points} pts</span>` : ""}</li>`).join("")}</ul>
      <p class="ai-note">Tips are written by AI from the tracked patterns. They cover tactics and practice, not stroke technique.</p>
    </section>` : ""}

    <details class="fold"><summary>More stats ${CHEV}</summary>
      <div class="fold-body">
        <div class="tiles">
          <div class="tile"><div class="v">${pct(sv.first_serve_in_pct)}</div><div class="l">First serves in</div><div class="c">${sv.first_serves - sv.first_serve_faults} of ${sv.first_serves}</div></div>
          <div class="tile"><div class="v">${pct(sv.service_points_won_pct)}</div><div class="l">Won on serve</div><div class="c">of ${sv.points_served} points</div></div>
          <div class="tile"><div class="v">${pct(rt.return_points_won_pct)}</div><div class="l">Won on return</div><div class="c">of ${rt.return_points} points</div></div>
        </div>
        ${fixes.length > 3 ? `<h3 class="sub-h">Also worth working on</h3><ol class="fixes">${fixes.slice(3).map((p, i) => fixCard(p, i + 4, false)).join("")}</ol>` : ""}
        ${early.length ? `<h3 class="sub-h">Early signs (too few to rank yet)</h3><ul class="early">${early.map((p) => `<li>${esc(p.detail)}</li>`).join("")}</ul>` : ""}
        <p class="muted playstyle">${esc(pl.playstyle.summary)}</p>
      </div>
    </details>`;
}
$("player").addEventListener("click", (e) => {
  const b = e.target.closest(".seg button");
  if (b && b.dataset.view !== barView) { barView = b.dataset.view; renderPlayer(DATA.players[current]); document.querySelector(`.seg button[data-view="${barView}"]`).focus(); }
});

document.addEventListener("pointermove", (e) => {
  const t = e.target.closest && e.target.closest("[data-tip]");
  const tip = $("tip");
  if (!t) { tip.style.display = "none"; return; }
  tip.textContent = t.dataset.tip;
  tip.style.display = "block";
  tip.style.left = Math.max(8, Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8)) + "px";
  tip.style.top = (e.clientY - tip.offsetHeight - 12) + "px";
});

render();
</script>
</body>
</html>
