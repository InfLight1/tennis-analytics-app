<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

/* ===== Design tokens: Etched (paper + pen-and-ink, tennis green for key data) ===== */
:root {
  color-scheme: light;
  --paper: #f3f2ee;
  --paper-2: #e8e7e1;
  --ink: #161615;
  --ink-2: #3b3b38;
  --ink-3: #66655f;
  --rule: #9a9993;
  --hair: #c9c8c1;
  --green: #1b7447;
  --green-soft: #d9eadf;
  --on-green: #ffffff;
  --red: #a2392c;
  --on-ink: #f3f2ee;
  --focus: #1b7447;

  --font-sans: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;

  --fs-xs: 0.875rem;   /* 14px: mono labels only */
  --fs-sm: 0.9375rem;  /* 15px */
  --fs-body: 1.0625rem;/* 17px */
  --fs-lg: 1.1875rem;  /* 19px */
  --fs-h3: 1.1875rem;
  --fs-h2: 1.5rem;
  --fs-h1: clamp(2rem, 6.4vw, 3rem);
  --fs-num: 1.75rem;
  --lh-body: 1.55;
  --lh-tight: 1.15;

  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px; --s8: 64px;
  --gutter: 16px;
  --col: 760px;
  --tap: 48px;
  --radius: 0;
  --shadow: none;
  --stroke: 1.5px;
  --dash: 1px dashed var(--rule);
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #151513; --paper-2: #20201d; --ink: #edece6; --ink-2: #c9c8c1; --ink-3: #9d9c95;
    --rule: #55544f; --hair: #3a3936; --green: #63c98f; --green-soft: #1d3326; --on-green: #0c1a11;
    --red: #e58b7d; --on-ink: #151513; --focus: #63c98f;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #151513; --paper-2: #20201d; --ink: #edece6; --ink-2: #c9c8c1; --ink-3: #9d9c95;
  --rule: #55544f; --hair: #3a3936; --green: #63c98f; --green-soft: #1d3326; --on-green: #0c1a11;
  --red: #e58b7d; --on-ink: #151513; --focus: #63c98f;
}

/* ===== Base ===== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--font-sans); font-size: var(--fs-body); line-height: var(--lh-body);
  overflow-x: hidden;
}
h1, h2, h3 { margin: 0; line-height: var(--lh-tight); letter-spacing: -0.015em; }
h1 { font-size: var(--fs-h1); font-weight: 800; letter-spacing: -0.03em; }
h2 { font-size: var(--fs-h2); font-weight: 700; }
h3 { font-size: var(--fs-h3); font-weight: 700; }
p { margin: 0; }
a { color: var(--ink); text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
a:hover { color: var(--green); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
b, strong { font-weight: 700; }
.mono { font-family: var(--font-mono); }

/* ===== Page grid: dashed column lines, like a ruled notebook ===== */
.topbar-wrap { border-bottom: var(--dash); }
.wrap {
  max-width: calc(var(--col) + 2 * var(--gutter)); margin: 0 auto; padding: 0 var(--gutter);
  border-left: var(--dash); border-right: var(--dash);
}
.sec { padding: var(--s7) 0; border-top: var(--dash); margin: 0 calc(-1 * var(--gutter)); padding-left: var(--gutter); padding-right: var(--gutter); scroll-margin-top: 8px; }
.sec-head { margin-bottom: var(--s5); }
.sec-head p { color: var(--ink-2); margin-top: var(--s2); }

/* ===== Top bar ===== */
.topbar { display: flex; align-items: center; gap: var(--s2); min-height: 64px; flex-wrap: wrap; }
.brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.125rem; letter-spacing: -0.02em; text-decoration: none; margin-right: auto; min-height: var(--tap); }
.brand:hover { color: var(--ink); }
.mark { width: 26px; height: 26px; background: var(--ink); position: relative; flex: none; }
.mark::before { content: ""; position: absolute; inset: 7px; border: 2px solid var(--paper); }
.mark::after { content: ""; position: absolute; left: 3px; right: 3px; top: 12px; height: 2px; background: var(--paper); }
.nav { display: flex; gap: var(--s1); }
.navlink { display: inline-flex; align-items: center; min-height: var(--tap); padding: 0 var(--s3); text-decoration: none; font-weight: 500; color: var(--ink-2); border-bottom: 3px solid transparent; }
.navlink[aria-current="page"] { color: var(--ink); border-bottom-color: var(--green); }
.navlink:hover { color: var(--ink); }
.theme-btn {
  min-height: var(--tap); min-width: var(--tap); padding: 0 var(--s3); background: transparent; color: var(--ink);
  border: var(--stroke) solid var(--ink); border-radius: var(--radius); font: 500 var(--fs-xs)/1 var(--font-mono); cursor: pointer;
}
@media (max-width: 560px) {
  .nav { order: 3; width: 100%; border-top: var(--dash); margin: 0 calc(-1 * var(--gutter)); padding: 0 calc(var(--gutter) - var(--s3)); width: calc(100% + 2 * var(--gutter)); }
}

/* ===== Buttons and inputs ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
  min-height: var(--tap); padding: 0 var(--s5); border: var(--stroke) solid var(--ink); border-radius: var(--radius);
  background: transparent; color: var(--ink); font: 700 var(--fs-body)/1 var(--font-sans); text-decoration: none; cursor: pointer;
  white-space: nowrap; transition: transform .15s var(--ease), background-color .15s var(--ease);
}
.btn:hover { color: var(--ink); background: var(--paper-2); }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--ink); color: var(--on-ink); }
.btn-primary:hover { background: var(--ink-2); color: var(--on-ink); }
.btn[disabled] { border-style: dashed; border-color: var(--ink-3); background: transparent; color: var(--ink-3); cursor: not-allowed; transform: none; }
.file-pick { position: relative; overflow: hidden; }
.file-pick input { position: absolute; inset: 0; opacity: 0; cursor: pointer; font-size: 0; }
.file-pick:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
label { display: block; font-weight: 500; color: var(--ink); margin-bottom: var(--s2); }
input[type="text"] {
  min-height: var(--tap); width: 100%; max-width: 280px; padding: 0 var(--s3); font: 400 var(--fs-body) var(--font-mono);
  color: var(--ink); background: var(--paper); border: var(--stroke) solid var(--ink); border-radius: var(--radius);
}
input[type="text"]::placeholder { color: var(--ink-3); }
.form-row { display: flex; gap: var(--s3); flex-wrap: wrap; align-items: center; }
.form-row input { flex: 1 1 180px; }
.status { margin-top: var(--s3); color: var(--ink-2); font-size: var(--fs-sm); min-height: 1px; }


/* ===== Report ===== */
.page-head { padding: var(--s6) 0 var(--s5); }
.kicker { font: 500 var(--fs-xs)/1.4 var(--font-mono); color: var(--ink-3); margin-bottom: var(--s2); }
.page-head h1 { font-size: clamp(1.875rem, 6vw, 2.625rem); }
.score { margin-top: var(--s2); font-size: var(--fs-lg); color: var(--ink-2); }
.score b { font-family: var(--font-mono); font-weight: 600; color: var(--ink); }

.tabs { display: grid; grid-template-columns: 1fr 1fr; border: var(--stroke) solid var(--ink); }
.tabs button {
  min-height: 52px; border: 0; background: transparent; color: var(--ink-2); font: 700 var(--fs-body)/1 var(--font-sans);
  cursor: pointer; border-bottom: 4px solid transparent; padding-top: 4px;
}
.tabs button + button { border-left: var(--stroke) solid var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); background: var(--paper-2); border-bottom-color: var(--green); }

.first-fix {
  display: grid; grid-template-columns: 1fr auto; gap: var(--s1) var(--s3); align-items: center;
  margin-top: var(--s3); padding: var(--s3) var(--s4); min-height: var(--tap);
  border: var(--stroke) solid var(--ink); border-top: 0; text-decoration: none; color: var(--ink);
}
.first-fix:hover { color: var(--ink); background: var(--paper-2); }
.first-fix .kicker { grid-column: 1 / -1; margin: 0; }
.first-fix .hl { font-weight: 700; }
.first-fix .go { font: 500 var(--fs-xs)/1 var(--font-mono); color: var(--ink-2); grid-column: 1 / -1; }
.tabs + .first-fix { margin-top: 0; }

.pts-lost { font: 600 var(--fs-body)/1 var(--font-mono); color: var(--red); white-space: nowrap; }
.pts-won { font: 600 var(--fs-body)/1 var(--font-mono); color: var(--green); white-space: nowrap; }

.tags { display: flex; flex-wrap: wrap; gap: var(--s2); }
.tag { font: 500 var(--fs-sm)/1 var(--font-mono); padding: 8px 12px; border: var(--stroke) solid var(--ink); }

.rings { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s4); margin-top: var(--s5); }
.ring-box { text-align: center; padding: var(--s4) var(--s2); border: var(--dash); }
.ring { position: relative; width: min(132px, 100%); margin: 0 auto; aspect-ratio: 1; }
.ring svg { width: 100%; height: 100%; display: block; transform: rotate(-90deg); }
.ring .val { position: absolute; inset: 0; display: grid; place-items: center; font: 600 1.625rem/1 var(--font-mono); letter-spacing: -0.02em; }
.ring-lbl { margin-top: var(--s3); font-weight: 700; }
.ring-ctx { font: 400 var(--fs-sm)/1.4 var(--font-mono); color: var(--ink-2); }

.minis { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: var(--s4); border: var(--stroke) solid var(--ink); }
.mini { padding: var(--s3) var(--s2); text-align: center; }
.mini + .mini { border-left: var(--dash); }
.mini .num { font: 600 var(--fs-num)/1.1 var(--font-mono); }
.mini .num.todo { font-size: var(--fs-body); color: var(--red); padding: 6px 0 4px; }
.mini .lbl { font-size: var(--fs-sm); color: var(--ink-2); }
.summary { margin-top: var(--s5); font-size: var(--fs-lg); line-height: 1.55; max-width: 62ch; }

.card-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; margin-bottom: var(--s4); }
.seg { display: inline-grid; grid-template-columns: 1fr 1fr; border: var(--stroke) solid var(--ink); }
.seg button { min-height: 44px; min-width: 72px; padding: 0 var(--s4); border: 0; background: transparent; color: var(--ink-2); font: 700 var(--fs-sm)/1 var(--font-sans); cursor: pointer; }
.seg button + button { border-left: var(--stroke) solid var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.bar { display: flex; gap: 3px; height: 40px; }
.bar span { border: var(--stroke) solid var(--ink); min-width: 8px; }
.legend { margin-top: var(--s4); display: grid; gap: 0; }
.legend div { display: grid; grid-template-columns: 22px 1fr auto; gap: var(--s3); align-items: center; padding: var(--s2) 0; }
.legend div + div { border-top: var(--dash); }
.legend i { width: 20px; height: 20px; border: var(--stroke) solid var(--ink); }
.legend .n { font: 600 var(--fs-body)/1 var(--font-mono); }
.bar-total { margin-top: var(--s3); font: 400 var(--fs-sm)/1.4 var(--font-mono); color: var(--ink-2); }
/* hatch fills instead of extra colours */
.f1 { background: var(--ink); }
.f2 { background: repeating-linear-gradient(45deg, var(--ink) 0 1.5px, transparent 1.5px 5px); }
.f3 { background: repeating-linear-gradient(45deg, var(--ink) 0 1px, transparent 1px 6px), repeating-linear-gradient(-45deg, var(--ink) 0 1px, transparent 1px 6px); }
.f4 { background: repeating-linear-gradient(0deg, var(--ink) 0 1.5px, transparent 1.5px 5px); }
.f5 { background: radial-gradient(var(--ink) 1.2px, transparent 1.6px) 0 0 / 5px 5px; }
.f6 { background: repeating-linear-gradient(-45deg, var(--ink) 0 1px, transparent 1px 9px); }

.fixes { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s4); }
.fix { border: var(--stroke) solid var(--ink); display: grid; grid-template-columns: 56px 1fr; }
.fix .rank { border-right: var(--stroke) solid var(--ink); display: flex; justify-content: center; padding-top: var(--s4); font: 600 1.75rem/1 var(--font-mono); }
.fix:first-child .rank { background: var(--green); color: var(--on-green); }
.fix-body { padding: var(--s4); min-width: 0; }
.fix-top { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s3); }
.fix-top h3 { font-size: var(--fs-lg); }
.try { margin-top: var(--s3); }
.try b { font-weight: 700; }
.moments { margin-top: var(--s3); padding-top: var(--s3); border-top: var(--dash); color: var(--ink-2); font-size: var(--fs-sm); }
.moments .t { font-family: var(--font-mono); color: var(--ink); font-weight: 500; }
.more { margin-top: var(--s3); border-top: var(--dash); }
.more summary { list-style: none; cursor: pointer; min-height: var(--tap); display: flex; align-items: center; gap: var(--s2); font-weight: 700; }
.more summary::-webkit-details-marker { display: none; }
.more summary::before { content: "+"; font: 600 1.125rem/1 var(--font-mono); width: 16px; color: var(--ink-2); }
.more[open] summary::before { content: "-"; }
.advice { display: grid; gap: var(--s3); padding-bottom: var(--s2); }
.advice dt { font: 600 var(--fs-xs)/1.3 var(--font-mono); color: var(--ink-3); }
.advice dd { margin: 2px 0 0; }

.keeps { border: var(--stroke) solid var(--ink); }
.keep { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s3); padding: var(--s4); }
.keep + .keep { border-top: var(--dash); }
.keep h3 { font-size: var(--fs-body); }
.ai-note { margin-top: var(--s5); color: var(--ink-2); font-size: var(--fs-sm); padding-left: var(--s3); border-left: 2px solid var(--rule); }

.tiles { display: grid; grid-template-columns: repeat(3, 1fr); border: var(--stroke) solid var(--ink); margin-bottom: var(--s5); }
.tile { padding: var(--s3) var(--s2); text-align: center; }
.tile + .tile { border-left: var(--dash); }
.tile .num { font: 600 1.5rem/1.1 var(--font-mono); }
.tile .lbl { font-size: var(--fs-sm); font-weight: 700; }
.tile .ctx { font: 400 var(--fs-xs)/1.4 var(--font-mono); color: var(--ink-2); }
.sub-h { margin: var(--s5) 0 var(--s3); font-size: var(--fs-body); }
.fold-body .fixes { gap: var(--s3); }
.early p { color: var(--ink); margin: 0; padding: var(--s2) 0; }
.early p + p { border-top: var(--dash); }
.style-sum { margin-top: var(--s5); color: var(--ink-2); }
.fold.last { margin-top: 0; border-top: 0; }
@media (max-width: 420px) {
  .fix { grid-template-columns: 44px 1fr; }
  .fix .rank { font-size: 1.375rem; }
  .fix-top { flex-direction: column; gap: var(--s2); }
  .mini .num { font-size: 1.5rem; }
  .fold-body { padding-left: 0; }
}
</style>
</head>

<div class="wrap">

</div>

(function () {
  const $ = (id) => document.getElementById(id);
  const root = document.documentElement;
  const mq = matchMedia("(prefers-color-scheme: dark)");
  const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : mq.matches;
  const label = () => { $("themeBtn").textContent = isDark() ? "Light" : "Dark"; };
  $("themeBtn").addEventListener("click", () => {
    root.dataset.theme = isDark() ? "light" : "dark";
    try { localStorage.setItem("etched-theme", root.dataset.theme); } catch (e) {}
    label();
  });
  mq.addEventListener && mq.addEventListener("change", label);
  label();
})();

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (v) => (v === null || v === undefined ? "-" : `${Math.round(v)}%`);
let current = "player_1", barView = "lost";

function clock(sec) {
  const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, ss = String(sec % 60).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${ss}` : `${m}:${ss}`;
}
const MAX_MOMENTS = 5;
function momentsLine(moments) {
  if (!moments || !moments.length) return "";
  const shown = moments.slice(0, MAX_MOMENTS).map((t) => `<span class="t">${clock(t)}</span>`).join(" · ");
  const more = moments.length > MAX_MOMENTS ? ` and ${moments.length - MAX_MOMENTS} more` : "";
  return `<p class="moments">Find these moments in your video: ${shown}${more}</p>`;
}
const firstSentence = (t) => (t || "").split(/(?<=[.!?])\s/)[0];
const headlineOf = (p) => (p.advice && p.advice.headline) || p.title;

function fixCard(p, rank) {
  const a = p.advice;
  const tryLine = a && (a.try_this || firstSentence(a.match_strategy));
  const slot = tryLine ? `<b>Try this:</b> ${esc(tryLine)}` : `<b>Why:</b> ${esc(p.detail)}`;
  const steps = !a ? [] : [["In matches", a.match_strategy], ["Habit to build", a.habit], ["Practice drill", a.practice_drill]].filter(([, t]) => t);
  return `<li class="fix">
    <div class="rank" aria-label="Rank ${rank}">${rank}</div>
    <div class="fix-body">
      <div class="fix-top"><h3>${esc(headlineOf(p))}</h3>${p.points ? `<span class="pts-lost">−${p.points} pts</span>` : ""}</div>
      <p class="try">${slot}</p>
      ${momentsLine(p.moments)}
      <details class="more"><summary>${a ? "How to practise it" : "Details"}</summary>
        <dl class="advice">${steps.map(([h, t]) => `<div><dt>${h}</dt><dd>${esc(t)}</dd></div>`).join("")}<div><dt>Why</dt><dd>${esc(p.detail)}</dd></div></dl>
      </details>
    </div>
  </li>`;
}

function ring(value, color, labelTxt, ctx) {
  const v = value === null || value === undefined ? null : Math.max(0, Math.min(100, value));
  const C = 2 * Math.PI * 42;
  const arc = !v ? "" : `<circle cx="50" cy="50" r="42" fill="none" stroke="${color}" stroke-width="9" stroke-dasharray="${(C * v / 100).toFixed(1)} ${C.toFixed(1)}"/>`;
  return `<div class="ring-box"><div class="ring" role="img" aria-label="${esc(labelTxt)}: ${pct(v)}">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="47" fill="none" stroke="var(--ink)" stroke-width="1"/>
        <circle cx="50" cy="50" r="42" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="1.5 2.5"/>
        <circle cx="50" cy="50" r="37" fill="none" stroke="var(--ink)" stroke-width="1"/>${arc}</svg>
      <div class="val">${pct(v)}</div></div>
    <div class="ring-lbl">${esc(labelTxt)}</div><div class="ring-ctx">${esc(ctx)}</div></div>`;
}

function stackedBar(parts, total, verb) {
  const shown = parts.filter((x) => x.n > 0);
  if (!total || !shown.length) return `<p class="bar-total">No points ${verb} yet.</p>`;
  const bar = shown.map((x) => `<span class="f${x.slot}" style="flex:${x.n}" title="${esc(x.label)}: ${x.n} of ${total} points ${verb} (${Math.round(100 * x.n / total)}%)"></span>`).join("");
  const legend = shown.map((x) => `<div><i class="f${x.slot}"></i><span>${esc(x.label)}</span><span class="n">${x.n}</span></div>`).join("");
  return `<div class="bar" role="img" aria-label="${esc(shown.map((x) => `${x.label} ${x.n}`).join(", "))}">${bar}</div>
    <div class="legend">${legend}</div><p class="bar-total">${total} points ${verb}</p>`;
}

function ordered(list) {
  const ok = list.filter((p) => !p.low_sample);
  return [...ok.filter((p) => p.tier === "headline"), ...ok.filter((p) => p.tier !== "headline")];
}

function render() {
  const P = DATA.players, ids = Object.keys(P);
  $("title").textContent = ids.map((id) => P[id].name).join(" vs ");
  $("subtitle").innerHTML = `Points won: <b>${P[ids[0]].stats.points_won}–${P[ids[1]].stats.points_won}</b>`;
  $("tabs").innerHTML = ids.map((id) =>
    `<button type="button" role="tab" data-id="${id}" aria-selected="${id === current}" tabindex="${id === current ? 0 : -1}">${esc(P[id].name)}</button>`).join("");
  $("tabs").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { current = b.dataset.id; render(); $("tabs").querySelector('[aria-selected="true"]').focus(); }));
  renderPlayer(P[current]);
  $("coverage").innerHTML = DATA.coverage.notes.map((n) => `<p>${esc(n)}</p>`).join("") +
    `<p>Patterns need at least ${DATA.min_sample.occurrences} occurrences out of ${DATA.min_sample.chances} chances before they're ranked; smaller ones are listed as early signs.</p>`;
}
$("tabs").addEventListener("keydown", (e) => {
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  const ids = Object.keys(DATA.players);
  current = ids[(ids.indexOf(current) + (e.key === "ArrowRight" ? 1 : ids.length - 1)) % ids.length];
  render(); $("tabs").querySelector('[aria-selected="true"]').focus();
});

        ${fixes.length > 3 ? `<h3 class="sub-h">Also worth working on</h3><ol class="fixes">${fixes.slice(3).map((p, i) => fixCard(p, i + 4)).join("")}</ol>` : ""}
        ${early.length ? `<h3 class="sub-h">Early signs (too few to rank yet)</h3><div class="early">${early.map((p) => `<p>${esc(p.detail)}</p>`).join("")}</div>` : ""}
        <p class="style-sum">${esc(pl.playstyle.summary)}</p>
      </div></details>
    </section>
  `;
}
render();
</script>
</body>
</html>
