/* ── Design tokens: "Cream" (warm light editorial, tennis green) ─────────
   Shape rule: controls and panels share --radius; pills (tags) use --radius-pill. */
:root {
  color-scheme: light;
  --bg: #fcfaf4;
  --surface: #ffffff;
  --surface-2: #f2eee3;
  --border: #e3ddcd;
  --border-strong: #cfc7b3;
  --text: #1c1f1a;
  --text-2: #3f4339;
  --muted: #5f6357;
  --accent: #17683f;
  --accent-strong: #11542f;
  --accent-soft: #e4f0e6;
  --on-accent: #ffffff;
  --lost: #a8402f;
  --focus: #17683f;
  --shadow: 0 1px 2px rgb(60 52 30 / .06), 0 8px 24px rgb(60 52 30 / .07);
  /* chart ramps: green for won, muted red for lost (one hue each, by lightness) */
  --won-1: #11542f; --won-2: #2f8a58; --won-3: #6db58a; --won-4: #b4dbc1;
  --lost-1: #8c3426; --lost-2: #b85a46; --lost-3: #d68d78; --lost-4: #ecc3b6; --lost-5: #c98f80; --lost-6: #6f675a;
  --ring-2: #3f4339;
  --font-serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-sans: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --fs-xs: 0.875rem;
  --fs-sm: 0.9375rem;
  --fs-body: 1.0625rem;
  --fs-lead: 1.1875rem;
  --fs-h3: 1.1875rem;
  --fs-h2: 1.625rem;
  --fs-h1: clamp(2.125rem, 7vw, 3rem);
  --fs-num: 1.75rem;
  --lh-body: 1.6;
  --lh-tight: 1.12;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px;
  --sp-6: 32px; --sp-7: 48px; --sp-8: 72px;
  --gutter: 16px;
  --col: 760px;
  --tap: 48px;
  --bar-w: 3px;
  --radius: 10px;
  --radius-lg: 14px;
  --radius-pill: 999px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #171611; --surface: #211f19; --surface-2: #2b2921; --border: #37342b; --border-strong: #4a463a;
    --text: #f3efe4; --text-2: #d6d1c3; --muted: #aaa493;
    --accent: #6cc893; --accent-strong: #8ad6a9; --accent-soft: #1f3327; --on-accent: #0f1a13;
    --lost: #e58a78; --focus: #6cc893;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25);
    --won-1: #9ee0b7; --won-2: #6cc893; --won-3: #3d9a66; --won-4: #24603f;
    --lost-1: #f2b3a5; --lost-2: #e58a78; --lost-3: #c4624f; --lost-4: #8e4436; --lost-5: #8a8170; --lost-6: #cfc7b3;
    --ring-2: #d6d1c3;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #171611; --surface: #211f19; --surface-2: #2b2921; --border: #37342b; --border-strong: #4a463a;
  --text: #f3efe4; --text-2: #d6d1c3; --muted: #aaa493;
  --accent: #6cc893; --accent-strong: #8ad6a9; --accent-soft: #1f3327; --on-accent: #0f1a13;
  --lost: #e58a78; --focus: #6cc893;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25);
  --won-1: #9ee0b7; --won-2: #6cc893; --won-3: #3d9a66; --won-4: #24603f;
  --lost-1: #f2b3a5; --lost-2: #e58a78; --lost-3: #c4624f; --lost-4: #8e4436; --lost-5: #8a8170; --lost-6: #cfc7b3;
  --ring-2: #d6d1c3;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--font-sans); font-size: var(--fs-body); line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
.wrap { max-width: calc(var(--col) + 2 * var(--gutter)); margin: 0 auto; padding: 0 var(--gutter) var(--sp-8); }
h1, h2, h3 { margin: 0; color: var(--text); }
h1, h2 { font-family: var(--font-serif); font-weight: 600; letter-spacing: -0.015em; line-height: var(--lh-tight); }
h1 { font-size: var(--fs-h1); }
h2 { font-size: var(--fs-h2); }
h3 { font-size: var(--fs-h3); font-weight: 600; line-height: 1.35; }
p { margin: 0; }
a { color: var(--accent); text-underline-offset: 3px; }
b { font-weight: 600; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.muted { color: var(--muted); }

/* Top bar */
.topbar { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-3) 0; flex-wrap: wrap; }
.brand { display: inline-flex; align-items: center; gap: 10px; min-height: var(--tap); color: var(--text); text-decoration: none; font-weight: 700; letter-spacing: -0.01em; margin-right: auto; }
.brand svg { width: 28px; height: 28px; flex: none; }
.nav { display: flex; gap: var(--sp-1); }
.navlink { display: inline-flex; align-items: center; min-height: var(--tap); padding: 0 var(--sp-3); color: var(--text-2); text-decoration: none; font-weight: 500; border-radius: var(--radius); }
.navlink:hover { background: var(--surface-2); color: var(--text); }
.theme-btn { width: var(--tap); height: var(--tap); display: grid; place-items: center; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: var(--radius); cursor: pointer; }
.theme-btn:hover { border-color: var(--border-strong); }
.theme-btn svg { width: 20px; height: 20px; }
@media (max-width: 560px) { .nav { order: 3; width: 100%; margin: 0 calc(-1 * var(--sp-3)); } }

/* Page head */
.page-head { padding-top: var(--sp-6); }
.kicker { color: var(--muted); font-weight: 500; }
.page-head h1 { margin-top: var(--sp-1); }
.score { margin-top: var(--sp-2); font-size: var(--fs-lead); color: var(--text-2); }

/* Tabs */
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-1); margin-top: var(--sp-5); padding: var(--sp-1); background: var(--surface-2); border-radius: calc(var(--radius) + 4px); }
.tabs button {
  min-height: var(--tap); border: 0; border-radius: var(--radius); background: transparent; cursor: pointer;
  font: 600 var(--fs-body)/1 var(--font-sans); color: var(--muted);
}
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow), inset 0 calc(-1 * var(--bar-w)) 0 var(--accent); }

/* #1 fix line */
.first-fix {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: var(--sp-1) var(--sp-4);
  margin-top: var(--sp-4); padding: var(--sp-3) var(--sp-4) var(--sp-3) var(--sp-4); min-height: 56px;
  border-left: var(--bar-w) solid var(--accent); background: var(--accent-soft); border-radius: 0 var(--radius) var(--radius) 0;
  color: var(--text); text-decoration: none;
}
.first-fix .lbl { grid-column: 1 / -1; font-size: var(--fs-xs); font-weight: 600; color: var(--accent); }
.first-fix .hl { font-weight: 600; line-height: 1.4; }
.first-fix .go { display: inline-flex; align-items: center; gap: var(--sp-2); color: var(--lost); font-weight: 700; white-space: nowrap; }
.first-fix .go svg { width: 18px; height: 18px; color: var(--text-2); }
.first-fix:hover .hl { text-decoration: underline; text-underline-offset: 3px; }

/* Sections */
section { margin-top: var(--sp-7); scroll-margin-top: var(--sp-4); }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); flex-wrap: wrap; margin-bottom: var(--sp-4); }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--sp-5); box-shadow: var(--shadow); }

/* Overview */
.tags { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.tag { display: inline-flex; align-items: center; min-height: 32px; padding: 0 var(--sp-3); border-radius: var(--radius-pill); border: 1px solid var(--border-strong); font-size: var(--fs-sm); font-weight: 500; color: var(--text-2); }
.rings { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-4); margin-top: var(--sp-5); }
.ring-item { display: flex; align-items: center; gap: var(--sp-4); }
.ring { position: relative; width: 92px; height: 92px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .val { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-serif); font-weight: 600; font-size: 1.375rem; }
.ring-lbl { font-weight: 600; }
.ring-ctx { color: var(--text-2); font-size: var(--fs-sm); }
@media (max-width: 480px) {
  .ring-item { flex-direction: column; align-items: flex-start; gap: var(--sp-2); }
  .ring { width: 84px; height: 84px; }
}
.minis { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: var(--sp-5); border-top: 1px solid var(--border); }
.mini { padding: var(--sp-4) var(--sp-2) 0 0; }
.mini + .mini { padding-left: var(--sp-4); border-left: 1px solid var(--border); }
.mini .num { font-family: var(--font-serif); font-weight: 600; font-size: var(--fs-num); line-height: 1.1; }
.mini .num.todo { font-family: var(--font-sans); font-size: var(--fs-sm); color: var(--lost); font-weight: 700; line-height: 2.2; }
.mini .lbl { color: var(--text-2); font-size: var(--fs-sm); line-height: 1.35; margin-top: var(--sp-1); }
.summary { margin-top: var(--sp-5); padding-top: var(--sp-5); border-top: 1px solid var(--border); font-family: var(--font-serif); font-size: var(--fs-lead); line-height: 1.55; color: var(--text); }

/* Segmented switch */
.seg { display: inline-grid; grid-template-columns: 1fr 1fr; padding: var(--sp-1); background: var(--surface-2); border-radius: calc(var(--radius) + 4px); }
.seg button { min-height: 44px; min-width: 72px; padding: 0 var(--sp-4); border: 0; border-radius: var(--radius); background: transparent; font: 600 var(--fs-sm)/1 var(--font-sans); color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

/* Stacked bar */
.bar { display: flex; gap: 2px; height: 28px; border-radius: 6px; overflow: hidden; }
.bar span { display: block; min-width: 6px; }
.legend { display: grid; gap: var(--sp-2); margin-top: var(--sp-4); }
.legend div { display: grid; grid-template-columns: 14px 1fr auto; align-items: center; gap: var(--sp-3); }
.legend i { width: 14px; height: 14px; border-radius: 4px; }
.legend .n { font-weight: 700; font-variant-numeric: tabular-nums; }
.bar-total { margin-top: var(--sp-3); color: var(--muted); font-size: var(--fs-sm); }

/* Fix list (reference: vertical list with one active bar) */
.fixes { display: grid; gap: var(--sp-6); }
.fix { border-left: var(--bar-w) solid var(--border-strong); padding-left: var(--sp-5); }
.fix.first { border-left-color: var(--accent); }
.fix-top { display: grid; grid-template-columns: auto 1fr auto; gap: var(--sp-3); align-items: baseline; }
.rank { font-family: var(--font-serif); font-weight: 600; font-size: 1.5rem; line-height: 1; color: var(--muted); }
.fix.first .rank { color: var(--accent); }
.fix h3 { font-family: var(--font-serif); font-size: 1.3125rem; font-weight: 600; }
.pts { font-weight: 700; color: var(--lost); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pts.plus { color: var(--accent); }
.try { margin-top: var(--sp-3); color: var(--text); }
.try b { color: var(--text); }
.moments { margin-top: var(--sp-3); color: var(--text-2); font-size: var(--fs-sm); }
.moments .t { font-variant-numeric: tabular-nums; color: var(--text); font-weight: 500; }
.more { margin-top: var(--sp-3); }
.more summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: var(--sp-2); min-height: var(--tap); font-weight: 600; color: var(--accent); }
.more summary::-webkit-details-marker { display: none; }
.more summary::after { content: ""; width: 8px; height: 8px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg) translateY(-3px); transition: transform .2s; }
.more[open] summary::after { transform: rotate(225deg) translateY(-1px); }
.advice { display: grid; gap: var(--sp-4); padding: var(--sp-4) var(--sp-5); background: var(--surface-2); border-radius: var(--radius); }
.advice h4 { margin: 0 0 var(--sp-1); font-size: var(--fs-sm); font-weight: 700; color: var(--text); }
.advice p { color: var(--text-2); }

/* Keep doing */
.keeps { display: grid; }
.keep { display: grid; grid-template-columns: 1fr auto; gap: var(--sp-4); align-items: baseline; padding: var(--sp-4) 0; }
.keep + .keep { border-top: 1px solid var(--border); }
.keep:first-child { padding-top: 0; }
.keep:last-child { padding-bottom: 0; }
.keep h3 { font-size: var(--fs-body); }
.ai-note { margin-top: var(--sp-5); color: var(--muted); font-size: var(--fs-sm); max-width: 60ch; }

/* Folds */
.folds { margin-top: var(--sp-7); }
details.fold { border-top: 1px solid var(--border); }
details.fold:last-child { border-bottom: 1px solid var(--border); }
details.fold > summary {
  list-style: none; cursor: pointer; min-height: 60px; display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3);
  font-family: var(--font-serif); font-size: 1.25rem; font-weight: 600; color: var(--text);
}
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: ""; width: 10px; height: 10px; border-right: 2px solid var(--text-2); border-bottom: 2px solid var(--text-2); transform: rotate(45deg) translate(-3px, -3px); transition: transform .2s; flex: none; }
details.fold[open] > summary::after { transform: rotate(225deg) translate(-3px, -3px); }
.fold-body { padding-bottom: var(--sp-6); }
.fold-body p + p { margin-top: var(--sp-3); }
.fold-body .coverage p { color: var(--text-2); }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-3); }
@media (max-width: 480px) { .tiles { grid-template-columns: 1fr; } .tile { display: grid; grid-template-columns: 5rem 1fr; column-gap: var(--sp-3); align-items: baseline; } .tile .ctx { grid-column: 2; } }
.tile { background: var(--surface-2); border-radius: var(--radius); padding: var(--sp-4); }
.tile .num { font-family: var(--font-serif); font-weight: 600; font-size: var(--fs-num); line-height: 1.1; }
.tile .lbl { font-weight: 600; }
.tile .ctx { color: var(--text-2); font-size: var(--fs-sm); }
.sub-h { margin: var(--sp-6) 0 var(--sp-4); font-size: var(--fs-body); }
.early p { color: var(--text-2); }
.early p + p { margin-top: var(--sp-2); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } html { scroll-behavior: auto; } }
</style>
</head>

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (v) => (v === null || v === undefined ? "–" : `${Math.round(v)}%`);
let current = "player_1", barView = "lost";

document.getElementById("themeBtn").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
});

function clock(sec) {
  const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, ss = String(sec % 60).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${ss}` : `${m}:${ss}`;
}
const MAX_MOMENTS = 5;
function momentsLine(moments) {
  if (!moments || !moments.length) return "";
  const shown = moments.slice(0, MAX_MOMENTS).map((t) => `<span class="t">${clock(t)}</span>`).join(" · ");
  const more = moments.length > MAX_MOMENTS ? ` and ${moments.length - MAX_MOMENTS} more` : "";
  return `<p class="moments">Find these moments in your video: ${shown}${more}</p>`;
}
const firstSentence = (t) => (t || "").split(/(?<=[.!?])\s/)[0];

// Every fix has the same shape: rank, headline, points, one line (Try this / Why), moments, fold.
function fixCard(p, rank, isFirst) {
  const a = p.advice;
  const tryLine = a ? (a.try_this || firstSentence(a.match_strategy)) : "";
  const steps = !a ? [] : [["In matches", a.match_strategy], ["Habit to build", a.habit], ["Practice drill", a.practice_drill]].filter(([, t]) => t);
  steps.push(["Why", p.detail]);
  return `<article class="fix${isFirst ? " first" : ""}" ${isFirst ? 'id="fix1"' : ""}>
    <div class="fix-top">
      <span class="rank">${rank}</span>
      <h3>${esc(a?.headline || p.title)}</h3>
      ${p.points ? `<span class="pts">−${p.points} pts</span>` : "<span></span>"}
    </div>
    <p class="try">${tryLine ? `<b>Try this:</b> ${esc(tryLine)}` : `<b>Why:</b> ${esc(p.detail)}`}</p>
    ${momentsLine(p.moments)}
    ${a ? `<details class="more"><summary>How to practise it</summary>
      <div class="advice">${steps.map(([h, t]) => `<div><h4>${h}</h4><p>${esc(t)}</p></div>`).join("")}</div>
    </details>` : ""}
  </article>`;
}

function ring(value, color, label, ctx) {
  const v = value === null || value === undefined ? null : Math.max(0, Math.min(100, value));
  const C = 2 * Math.PI * 42;
  const arc = !v ? "" : `<circle cx="50" cy="50" r="42" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(C * v / 100).toFixed(1)} ${C.toFixed(1)}"/>`;
  return `<div class="ring-item"><div class="ring" role="img" aria-label="${esc(label)}: ${pct(v)}">
      <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="var(--surface-2)" stroke-width="10"/>${arc}</svg>
      <div class="val">${pct(v)}</div></div>
    <div><div class="ring-lbl">${esc(label)}</div><div class="ring-ctx">${esc(ctx)}</div></div></div>`;
}

function stackedBar(parts, total, verb, ramp) {
  const shown = parts.filter((x) => x.n > 0);
  if (!total || !shown.length) return `<p class="muted">No points ${verb} yet.</p>`;
  const bar = shown.map((x) => `<span style="flex:${x.n};background:var(--${ramp}-${x.slot})" title="${esc(x.label)}: ${x.n} of ${total} points ${verb} (${Math.round(100 * x.n / total)}%)"></span>`).join("");
  const legend = shown.map((x) => `<div><i style="background:var(--${ramp}-${x.slot})"></i><span>${esc(x.label)}</span><span class="n">${x.n}</span></div>`).join("");
  return `<div class="bar" role="img" aria-label="${esc(shown.map((x) => `${x.label} ${x.n}`).join(", "))}">${bar}</div>
    <div class="legend">${legend}</div><p class="bar-total">${total} points ${verb} in total</p>`;
}

function render() {
  const P = DATA.players, ids = Object.keys(P);
  $("title").textContent = ids.map((id) => P[id].name).join(" vs ");
  $("subtitle").textContent = `Points won: ${P[ids[0]].stats.points_won}–${P[ids[1]].stats.points_won}`;
  $("tabs").innerHTML = ids.map((id) =>
    `<button role="tab" data-id="${id}" aria-selected="${id === current}">${esc(P[id].name)}</button>`).join("");
  $("tabs").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { current = b.dataset.id; render(); }));
  renderPlayer(P[current]);
}

function renderPlayer(pl) {
  const s = pl.stats, sv = s.serve, rt = s.return;
  const ordered = (list) => {
    const ok = list.filter((p) => !p.low_sample);
    return [...ok.filter((p) => p.tier === "headline"), ...ok.filter((p) => p.tier !== "headline")];
  };
  const fixes = ordered(pl.weaknesses), keeps = ordered(pl.strengths);
  const early = [...pl.weaknesses, ...pl.strengths].filter((p) => p.low_sample);
  const errs = s.lost_by.own_errors;
  const lostParts = [
    { label: "Into the net", n: errs.net || 0, slot: 1 },
    { label: "Long", n: errs.long || 0, slot: 2 },
    { label: "Wide", n: errs.wide || 0, slot: 3 },
    { label: "Missed (direction unclear)", n: errs.unclassified || 0, slot: 4 },
    { label: "Double faults", n: s.lost_by.double_faults, slot: 5 },
    { label: "Opponent's shot not returned", n: s.lost_by.opponent_winners, slot: 6 },
  ];
  const wonParts = [
    { label: "Their shot not returned", n: s.won_by.winners, slot: 1 },
    { label: "Serve not returned", n: s.won_by.aces, slot: 2 },
    { label: "Opponent missed", n: s.won_by.opponent_errors, slot: 3 },
    { label: "Opponent double faults", n: s.won_by.opponent_double_faults, slot: 4 },
  ];
  const rally = s.avg_rally_shots != null ? `<div class="num">${s.avg_rally_shots}</div>` : `<div class="num todo">[TODO]</div>`;
  const top = fixes[0];

  $("player").onclick = (e) => {
    const b = e.target.closest(".seg button");
    if (b && b.dataset.view !== barView) { barView = b.dataset.view; renderPlayer(pl); }
  };
  $("player").innerHTML = `
    ${top ? `<a class="first-fix" href="#fixes">
      <span class="lbl">Your #1 fix</span>
      <span class="hl">${esc(top.advice?.headline || top.title)}</span>
      <span class="go">−${top.points} pts <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></span>
    </a>` : ""}

    <section aria-label="Overview">
      <div class="panel">
        <div class="tags">${pl.playstyle.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>
        <div class="rings">
          ${ring(s.points_won_pct, "var(--accent)", "Points won", `${s.points_won} of ${s.points_played}`)}
          ${ring(sv.serves_in_pct, "var(--ring-2)", "Serves in", `${sv.serves_in} of ${sv.serves_tracked}`)}
        </div>
        <div class="minis">
          <div class="mini" title="Serves the opponent didn't return"><div class="num">${sv.aces}</div><div class="lbl">Aces</div></div>
          <div class="mini" title="At least this many: some serves aren't seen"><div class="num">${sv.double_faults}</div><div class="lbl">Double faults</div></div>
          <div class="mini">${rally}<div class="lbl">Shots per rally</div></div>
        </div>
        ${pl.ai_summary ? `<p class="summary">${esc(pl.ai_summary)}</p>` : ""}
      </div>
    </section>

    <section aria-labelledby="barTitle">
      <div class="sec-head"><h2 id="barTitle">How ${esc(pl.name)} ${barView} points</h2>
        <div class="seg" role="group" aria-label="Show points lost or won">
          <button type="button" data-view="lost" aria-pressed="${barView === "lost"}">Lost</button>
          <button type="button" data-view="won" aria-pressed="${barView === "won"}">Won</button>
        </div></div>
      <div class="panel">
        ${barView === "lost" ? stackedBar(lostParts, s.points_lost, "lost", "lost") : stackedBar(wonParts, s.points_won, "won", "won")}
      </div>
    </section>

    <section id="fixes" aria-labelledby="fixTitle">
      <div class="sec-head"><h2 id="fixTitle">${fixes.length ? `Top ${Math.min(3, fixes.length)} things to fix` : "Things to fix"}</h2></div>
      ${fixes.length ? `<div class="fixes">${fixes.slice(0, 3).map((p, i) => fixCard(p, i + 1, i === 0)).join("")}</div>`
                     : `<p class="muted">Not enough tracked points yet to rank anything.</p>`}
    </section>

    ${keeps.length ? `<section aria-labelledby="keepTitle">
      <div class="sec-head"><h2 id="keepTitle">Keep doing</h2></div>
      <div class="panel keeps">${keeps.slice(0, 3).map((p) => {
        const a = p.advice;
        return `<div class="keep"><div><h3>${esc(a?.headline || p.title)}</h3>${a?.try_this ? `<p class="try">${esc(a.try_this)}</p>` : ""}</div>${p.points ? `<span class="pts plus">+${p.points} pts</span>` : "<span></span>"}</div>`;
      }).join("")}</div>
    </section>` : ""}
    <p class="ai-note">Tips are written by AI from the tracked patterns. They cover tactics and practice, not stroke technique.</p>

    <div class="folds">
      <details class="fold"><summary>More stats</summary><div class="fold-body">
        <div class="tiles">
          <div class="tile"><div class="num">${pct(sv.first_serve_in_pct)}</div><div class="lbl">First serves in</div><div class="ctx">${sv.first_serves - sv.first_serve_faults} of ${sv.first_serves}</div></div>
          <div class="tile"><div class="num">${pct(sv.service_points_won_pct)}</div><div class="lbl">Won on serve</div><div class="ctx">of ${sv.points_served} points</div></div>
          <div class="tile"><div class="num">${pct(rt.return_points_won_pct)}</div><div class="lbl">Won on return</div><div class="ctx">of ${rt.return_points} points</div></div>
        </div>
        ${fixes.length > 3 ? `<h3 class="sub-h">Also worth working on</h3><div class="fixes">${fixes.slice(3).map((p, i) => fixCard(p, i + 4, false)).join("")}</div>` : ""}
        ${early.length ? `<h3 class="sub-h">Early signs (too few to rank yet)</h3><div class="early">${early.map((p) => `<p>${esc(p.detail)}</p>`).join("")}</div>` : ""}
        <p class="muted" style="margin-top:var(--sp-5)">${esc(pl.playstyle.summary)}</p>
      </div></details>
      <details class="fold"><summary>About this data</summary><div class="fold-body coverage">
        ${DATA.coverage.notes.map((n) => `<p>${esc(n)}</p>`).join("")}
        <p>Patterns need at least ${DATA.min_sample.occurrences} occurrences out of ${DATA.min_sample.chances} chances before they're ranked; smaller ones are listed as early signs.</p>
      </div></details>
    </div>
  `;
}

render();
</script>
</body>
</html>
