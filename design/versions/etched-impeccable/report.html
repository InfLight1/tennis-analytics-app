<style>
/* ===== Design tokens: Etched (paper x pen-and-ink) ===== */
:root {
  color-scheme: light;
  /* colour */
  --paper: #F3F1EA;
  --paper-2: #E9E6DC;
  --ink: #121210;
  --ink-2: #33322D;
  --ink-3: #57554D;
  --rule: #121210;
  --rule-soft: rgba(18, 18, 16, 0.32);
  --green: #1D6A33;
  --green-strong: #17592A;
  --on-green: #F6F5EF;
  --red: #9C3628;
  --select: rgba(29, 106, 51, 0.22);
  /* type */
  --font-ui: "Schibsted Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-prose: "Newsreader", ui-serif, Georgia, "Times New Roman", serif;
  --t-body: 1.0625rem;
  --t-small: 1rem;
  --t-h3: 1.2rem;
  --t-h2: 1.625rem;
  --t-h1: clamp(2.1rem, 8vw, 3.25rem);
  --t-num: 2.5rem;
  --lh-body: 1.55;
  --lh-tight: 1.08;
  --track-display: -0.025em;
  /* space */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px; --s8: 72px;
  --gutter: 16px;
  --col: 760px;
  /* shape */
  --radius: 2px;
  --stroke: 1.5px;
  --hair: 1px;
  --dash: 1px dashed var(--rule-soft);
  --shadow: none;
  --tap: 48px;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #151511; --paper-2: #1F1E19; --ink: #EFECE3; --ink-2: #CFCBBF; --ink-3: #A7A397;
    --rule: #EFECE3; --rule-soft: rgba(239, 236, 227, 0.30);
    --green: #7FD08F; --green-strong: #95DDA3; --on-green: #10140F; --red: #E79C8E; --select: rgba(127, 208, 143, 0.28);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #151511; --paper-2: #1F1E19; --ink: #EFECE3; --ink-2: #CFCBBF; --ink-3: #A7A397;
  --rule: #EFECE3; --rule-soft: rgba(239, 236, 227, 0.30);
  --green: #7FD08F; --green-strong: #95DDA3; --on-green: #10140F; --red: #E79C8E; --select: rgba(127, 208, 143, 0.28);
}

/* ===== Base ===== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 var(--t-body)/var(--lh-body) var(--font-ui);
  overflow-x: clip; -webkit-font-smoothing: antialiased;
}
::selection { background: var(--select); color: var(--ink); }
h1, h2, h3 { margin: 0; font-weight: 700; letter-spacing: var(--track-display); text-wrap: balance; }
p { margin: 0; }
a { color: var(--ink); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums lining-nums; }

.wrap { max-width: calc(var(--col) + 2 * var(--gutter)); margin: 0 auto; padding: 0 var(--gutter) var(--s8); position: relative; }
@media (min-width: 840px) {
  :root { --gutter: 40px; }
  .wrap { border-left: var(--dash); border-right: var(--dash); }
}
.rule { position: relative; height: 0; margin: var(--s7) 0 0; }
.rule::before { content: ""; position: absolute; left: 50%; width: 100vw; transform: translateX(-50%); border-top: var(--dash); }

/* ===== Top bar ===== */
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 0 var(--s4); padding: var(--s3) 0; position: relative; }
.topbar::after { content: ""; position: absolute; bottom: 0; left: 50%; width: 100vw; transform: translateX(-50%); border-top: var(--dash); }
.brand { display: inline-flex; align-items: center; gap: var(--s3); min-height: var(--tap); font-weight: 800; font-size: 1.15rem; letter-spacing: -0.02em; text-decoration: none; margin-right: auto; }
.mark { width: 30px; height: 30px; flex: none; display: block; }
.mark rect.b { fill: var(--ink); }
.mark .l { stroke: var(--paper); fill: none; }
.nav { display: flex; align-items: stretch; }
.navlink { display: inline-flex; align-items: center; min-height: var(--tap); padding: 0 var(--s3); font-weight: 600; text-decoration: none; color: var(--ink-2); position: relative; }
.navlink:hover { color: var(--ink); }
.theme-btn { width: var(--tap); height: var(--tap); display: grid; place-items: center; border: 0; background: none; color: var(--ink); cursor: pointer; border-radius: var(--radius); }
.theme-btn:hover { background: var(--paper-2); }
.theme-btn svg { width: 22px; height: 22px; }
@media (max-width: 559px) {
  .nav { order: 3; width: 100%; border-top: var(--dash); margin-top: var(--s1); }
  .navlink { flex: 1; justify-content: center; }
  .navlink + .navlink { border-left: var(--dash); }
}

/* ===== Title ===== */
.page-head { padding: var(--s7) 0 var(--s5); }
.page-head h1 { font-size: var(--t-h1); line-height: var(--lh-tight); font-weight: 800; }
.page-head .meta { margin-top: var(--s3); color: var(--ink-2); font-size: 1.15rem; display: flex; flex-wrap: wrap; gap: var(--s1) var(--s3); }
.page-head .meta .sep { color: var(--ink-3); }

/* ===== Tabs ===== */
.tabs { display: grid; grid-template-columns: 1fr 1fr; border: var(--stroke) solid var(--ink); border-radius: var(--radius); }
.tabs button {
  min-height: 56px; border: 0; background: transparent; color: var(--ink-3); cursor: pointer;
  font: 700 1.1rem var(--font-ui); position: relative; letter-spacing: -0.01em;
}
.tabs button + button { border-left: var(--stroke) solid var(--ink); }
.tabs button:hover { color: var(--ink); background: var(--paper-2); }
.tabs button[aria-selected="true"] { color: var(--ink); background: var(--paper-2); }
.tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--green); }

/* ===== #1 fix line ===== */
.first-fix {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: var(--s2) var(--s3);
  margin-top: var(--s3); padding: var(--s3) var(--s4); min-height: 56px;
  border: var(--hair) dashed var(--ink-3); border-radius: var(--radius); text-decoration: none; color: var(--ink);
}
.first-fix:hover { background: var(--paper-2); }
.first-fix .k { font-weight: 800; white-space: nowrap; }
.first-fix .h { color: var(--ink-2); }
.first-fix .p { color: var(--red); font-weight: 800; white-space: nowrap; display: inline-flex; align-items: center; gap: var(--s2); }
.first-fix svg { width: 16px; height: 16px; }
@media (max-width: 480px) {
  .first-fix { grid-template-columns: 1fr auto; }
  .first-fix .h { grid-column: 1 / -1; grid-row: 2; }
}

/* ===== Section heads ===== */
section[id] { scroll-margin-top: var(--s4); }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: var(--s3) var(--s4); padding-top: var(--s6); margin-bottom: var(--s5); }
.sec-head h2 { font-size: var(--t-h2); line-height: 1.15; }

/* ===== Hero ===== */
.tags { display: flex; flex-wrap: wrap; gap: var(--s2); padding-top: var(--s6); }
.tag { display: inline-flex; align-items: center; min-height: 34px; padding: 0 var(--s3); border: var(--hair) solid var(--ink); border-radius: var(--radius); font-weight: 600; font-size: var(--t-small); }
.dials { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s4); margin-top: var(--s5); }
.dial { text-align: center; }
.dial .ring { position: relative; width: min(100%, 168px); margin: 0 auto; aspect-ratio: 1; }
.dial svg { width: 100%; height: 100%; display: block; }
.dial .val { position: absolute; inset: 0; display: grid; place-items: center; font-size: clamp(1.9rem, 8vw, 2.5rem); font-weight: 800; letter-spacing: -0.03em; }
.dial .lbl { font-weight: 700; margin-top: var(--s2); }
.dial .ctx { color: var(--ink-2); }
.tick { stroke: var(--ink-3); }
.track { stroke: var(--rule-soft); fill: none; }
.arc { stroke: var(--green); fill: none; }
.minis { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: var(--s5); border-top: var(--stroke) solid var(--ink); border-bottom: var(--stroke) solid var(--ink); }
.mini { padding: var(--s3) var(--s2); text-align: center; }
.mini + .mini { border-left: var(--dash); }
.mini .n { font-size: 1.75rem; font-weight: 800; line-height: 1.2; letter-spacing: -0.02em; }
.mini .n.todo { font-size: 1.1rem; line-height: 2.1rem; color: var(--ink-3); letter-spacing: 0; }
.mini .l { color: var(--ink-2); font-size: var(--t-small); line-height: 1.3; }
.summary { font-family: var(--font-prose); font-size: 1.25rem; line-height: 1.5; margin-top: var(--s5); max-width: 62ch; color: var(--ink); }

/* ===== Stacked bar ===== */
.seg { display: inline-grid; grid-template-columns: 1fr 1fr; border: var(--stroke) solid var(--ink); border-radius: var(--radius); }
.seg button { min-height: 44px; min-width: 76px; padding: 0 var(--s4); border: 0; background: transparent; color: var(--ink-2); font: 700 var(--t-small) var(--font-ui); cursor: pointer; }
.seg button + button { border-left: var(--stroke) solid var(--ink); }
.seg button[aria-pressed="true"] { background: var(--green); color: var(--on-green); }
.bar svg { display: block; width: 100%; height: 56px; }
.frame { fill: none; stroke: var(--ink); }
.legend { list-style: none; margin: var(--s4) 0 0; padding: 0; }
.legend li { display: grid; grid-template-columns: 28px 1fr auto; gap: var(--s3); align-items: center; padding: var(--s2) 0; border-top: var(--dash); }
.legend li:last-child { border-bottom: var(--dash); }
.legend svg { width: 28px; height: 18px; display: block; }
.legend .c { font-weight: 800; }
.total { color: var(--ink-2); padding-top: var(--s3); display: flex; justify-content: space-between; }
.total b { color: var(--ink); }
.pt-ink { stroke: var(--ink); fill: none; }
.pt-fill { fill: var(--ink); }

/* ===== Fix entries ===== */
.fixes { list-style: none; margin: 0; padding: 0; border: var(--stroke) solid var(--ink); border-radius: var(--radius); }
.fix { display: grid; grid-template-columns: 40px 1fr; gap: var(--s3) var(--s4); padding: var(--s5) var(--s4); }
.fix + .fix { border-top: var(--stroke) solid var(--ink); }
.fix .rank { font-size: 2.25rem; font-weight: 800; line-height: 1; letter-spacing: -0.04em; padding-top: 2px; }
.fix .top-line { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: var(--s1) var(--s4); }
.fix h3 { font-size: var(--t-h3); line-height: 1.3; flex: 1 1 200px; }
.pts-lost { color: var(--red); font-weight: 800; white-space: nowrap; }
.pts-won { color: var(--green); font-weight: 800; white-space: nowrap; }
.fix .try { margin-top: var(--s3); color: var(--ink-2); }
.fix .try b { color: var(--ink); }
.fix .moments { margin-top: var(--s3); color: var(--ink-2); font-size: var(--t-small); }
.fix .moments span { color: var(--ink); font-weight: 700; }
.fix details { margin-top: var(--s3); border-top: var(--dash); }
.fix details > summary { list-style: none; cursor: pointer; min-height: var(--tap); display: flex; align-items: center; justify-content: space-between; gap: var(--s3); font-weight: 700; }
.fix details > summary::-webkit-details-marker { display: none; }
.advice { display: grid; gap: var(--s4); padding-bottom: var(--s2); }
.advice div b { display: block; font-weight: 700; margin-bottom: 2px; }
.advice div p { color: var(--ink-2); font-family: var(--font-prose); font-size: 1.125rem; line-height: 1.5; }
.fixes.sub { margin-top: var(--s4); }
.fixes.sub .fix { padding: var(--s4); }
.fixes.sub .rank { font-size: 1.6rem; }

/* ===== Keep doing ===== */
.keeps { list-style: none; margin: 0; padding: 0; }
.keep { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s4); padding: var(--s4) 0; border-top: var(--stroke) solid var(--ink); }
.keep:last-child { border-bottom: var(--stroke) solid var(--ink); }
.keep h3 { font-size: 1.125rem; line-height: 1.35; font-weight: 600; }
.ai-note { margin-top: var(--s5); color: var(--ink-2); display: flex; gap: var(--s3); align-items: flex-start; }
.ai-note svg { width: 20px; height: 20px; flex: none; margin-top: 3px; }

/* ===== Folds ===== */
.folds { margin-top: var(--s7); }
details.fold { border-top: var(--stroke) solid var(--ink); }
details.fold:last-child { border-bottom: var(--stroke) solid var(--ink); }
details.fold > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: var(--s3); min-height: 60px; font-weight: 700; font-size: 1.15rem; }
details.fold > summary::-webkit-details-marker { display: none; }
.pm { width: 18px; height: 18px; position: relative; flex: none; }
.pm::before, .pm::after { content: ""; position: absolute; background: var(--ink); left: 0; right: 0; top: 8px; height: 2px; transition: transform .3s var(--ease); }
.pm::after { transform: rotate(90deg); }
details[open] > summary .pm::after { transform: rotate(0deg); }
.fold-body { padding: 0 0 var(--s5); }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); border-top: var(--dash); border-bottom: var(--dash); }
.tile { padding: var(--s3) var(--s2); }
.tile + .tile { border-left: var(--dash); padding-left: var(--s3); }
.tile .n { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; }
.tile .l { font-weight: 600; line-height: 1.3; }
.tile .x { color: var(--ink-2); font-size: var(--t-small); }
@media (max-width: 420px) {
  .tiles { grid-template-columns: 1fr; }
  .tile + .tile { border-left: 0; border-top: var(--dash); padding-left: var(--s2); }
  .tile { display: grid; grid-template-columns: 5.5rem 1fr; column-gap: var(--s3); align-items: baseline; }
  .tile .n { grid-row: span 2; }
}
.sub-h { font-size: var(--t-h3); margin-top: var(--s6); }
.early { margin: var(--s3) 0 0; padding: 0; list-style: none; }
.early li { padding: var(--s2) 0; border-top: var(--dash); color: var(--ink-2); }
.playsum { margin-top: var(--s5); color: var(--ink-2); }
.coverage p { color: var(--ink-2); margin-top: var(--s3); max-width: 68ch; }
.coverage p:first-child { margin-top: 0; }
.muted { color: var(--ink-2); }

@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { transition: none !important; } }
</style>

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (v) => (v === null || v === undefined ? "–" : `${Math.round(v)}%`);
let current = "player_1", barView = "lost";

$("themeBtn").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
});

function clock(sec) {
  const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, ss = String(sec % 60).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${ss}` : `${m}:${ss}`;
}
const MAX_MOMENTS = 5;
function momentsLine(moments) {
  if (!moments || !moments.length) return "";
  const shown = moments.slice(0, MAX_MOMENTS).map((t) => `<span>${clock(t)}</span>`).join(" · ");
  const more = moments.length > MAX_MOMENTS ? ` and ${moments.length - MAX_MOMENTS} more` : "";
  return `<p class="moments num">Find these moments in your video: ${shown}${more}</p>`;
}
const firstSentence = (t) => (t || "").split(/(?<=[.!?])\s/)[0];
const ordered = (list) => {
  const ok = list.filter((p) => !p.low_sample);
  return [...ok.filter((p) => p.tier === "headline"), ...ok.filter((p) => p.tier !== "headline")];
};

// Engraved dial: fine ticks, faint track, green arc.
function dial(value, label, ctx) {
  const v = value == null ? null : Math.max(0, Math.min(100, value));
  const r = 40, C = 2 * Math.PI * r;
  let ticks = "";
  for (let i = 0; i < 40; i++) {
    const a = (i / 40) * 2 * Math.PI - Math.PI / 2, long = i % 10 === 0;
    const r1 = 48, r2 = long ? 54 : 51.5;
    ticks += `<line class="tick" x1="${(60 + r1 * Math.cos(a)).toFixed(2)}" y1="${(60 + r1 * Math.sin(a)).toFixed(2)}" x2="${(60 + r2 * Math.cos(a)).toFixed(2)}" y2="${(60 + r2 * Math.sin(a)).toFixed(2)}" stroke-width="${long ? 1.5 : 0.9}"/>`;
  }
  const arc = v ? `<circle class="arc" cx="60" cy="60" r="${r}" stroke-width="9" stroke-dasharray="${(C * v / 100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 60 60)"/>` : "";
  return `<div class="dial"><div class="ring" role="img" aria-label="${esc(label)}: ${pct(v)}, ${esc(ctx)}">
      <svg viewBox="0 0 120 120" aria-hidden="true">${ticks}<circle class="track" cx="60" cy="60" r="${r}" stroke-width="9"/>${arc}</svg>
      <div class="val num">${pct(v)}</div></div>
    <div class="lbl">${esc(label)}</div><div class="ctx num">${esc(ctx)}</div></div>`;
}

// Stacked bar drawn with engraving patterns instead of extra colours.
function stackedBar(parts, total, verb) {
  const shown = parts.filter((x) => x.n > 0);
  if (!total || !shown.length) return `<p class="muted">No points ${verb} yet.</p>`;
  const W = 600, H = 56, gap = 4;
  const usable = W - gap * (shown.length - 1);
  let x = 0;
  const rects = shown.map((p) => {
    const w = usable * p.n / total;
    const r = `<g><title>${esc(p.label)}: ${p.n} of ${total} points ${verb} (${Math.round(100 * p.n / total)}%)</title>
      <rect x="${x.toFixed(2)}" y="0" width="${w.toFixed(2)}" height="${H}" fill="url(#p${p.slot})"/>
      <rect class="frame" x="${(x + 0.75).toFixed(2)}" y="0.75" width="${(w - 1.5).toFixed(2)}" height="${H - 1.5}" stroke-width="1.5" vector-effect="non-scaling-stroke"/></g>`;
    x += w + gap;
    return r;
  }).join("");
  const sw = (slot) => `<svg viewBox="0 0 28 18" aria-hidden="true"><rect x="0.75" y="0.75" width="26.5" height="16.5" fill="url(#p${slot})"/><rect class="frame" x="0.75" y="0.75" width="26.5" height="16.5" stroke-width="1.5"/></svg>`;
  const legend = shown.map((p) => `<li>${sw(p.slot)}<span>${esc(p.label)}</span><span class="c num">${p.n}</span></li>`).join("");
  return `<div class="bar" role="img" aria-label="${esc(shown.map((p) => `${p.label} ${p.n}`).join(", "))}"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${rects}</svg></div>
    <ul class="legend">${legend}</ul><p class="total num"><span>Points ${verb}</span><b>${total}</b></p>`;
}

// One fix, same shape every time: "Try this" from the advice, else "Why" from the detail.
function fixCard(p, rank) {
  const a = p.advice;
  const tryLine = a ? (a.try_this || firstSentence(a.match_strategy)) : "";
  const pts = p.points ? `<span class="pts-lost num">−${p.points} pts</span>` : "";
  const steps = !a ? [] : [["In matches", a.match_strategy], ["Habit to build", a.habit], ["Practice drill", a.practice_drill]].filter(([, t]) => t);
  steps.push(["Why", p.detail]);
  return `<li class="fix">
    <div class="rank num" aria-label="Number ${rank}">${rank}</div>
    <div>
      <div class="top-line"><h3>${esc(a?.headline || p.title)}</h3>${pts}</div>
      <p class="try">${tryLine ? `<b>Try this:</b> ${esc(tryLine)}` : `<b>Why:</b> ${esc(p.detail)}`}</p>
      ${momentsLine(p.moments)}
      ${a ? `<details><summary>How to practise it<span class="pm" aria-hidden="true"></span></summary><div class="advice">
        ${steps.map(([h, t]) => `<div><b>${h}</b><p>${esc(t)}</p></div>`).join("")}</div></details>` : ""}
    </div>
  </li>`;
}

function render() {
  const P = PROFILE.players, ids = Object.keys(P);
  $("title").textContent = ids.map((id) => P[id].name).join(" vs ");
  $("subtitle").textContent = `Points won: ${P[ids[0]].stats.points_won}–${P[ids[1]].stats.points_won}`;
  $("tabs").innerHTML = ids.map((id) =>
    `<button type="button" role="tab" id="tab-${id}" aria-controls="player" data-id="${id}" aria-selected="${id === current}" tabindex="${id === current ? 0 : -1}">${esc(P[id].name)}</button>`).join("");
  $("player").setAttribute("role", "tabpanel");
  $("player").setAttribute("aria-labelledby", `tab-${current}`);
  renderPlayer(P[current]);
  $("coverage").innerHTML = PROFILE.coverage.notes.map((n) => `<p>${esc(n)}</p>`).join("") +
    `<p>Patterns need at least ${PROFILE.min_sample.occurrences} occurrences out of ${PROFILE.min_sample.chances} chances before they're ranked; smaller ones are listed as early signs.</p>`;
}

$("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-id]");
  if (b && b.dataset.id !== current) { current = b.dataset.id; render(); $(`tab-${current}`).focus(); }
});
$("tabs").addEventListener("keydown", (e) => {
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  const ids = Object.keys(PROFILE.players);
  current = ids[(ids.indexOf(current) + (e.key === "ArrowRight" ? 1 : ids.length - 1)) % ids.length];
  render(); $(`tab-${current}`).focus();
});

        <div class="mini">${rally}<div class="l">Shots per rally</div></div>
      </div>
      ${pl.ai_summary ? `<p class="summary">${esc(pl.ai_summary)}</p>` : ""}
    </section>

    <div class="rule" aria-hidden="true"></div>
    <section id="howpoints" aria-labelledby="barH">
      <div class="sec-head"><h2 id="barH">How ${esc(pl.name)} ${barView} points</h2>
        <div class="seg" role="group" aria-label="Show points lost or won">
          <button type="button" data-view="lost" aria-pressed="${barView === "lost"}">Lost</button>
          <button type="button" data-view="won" aria-pressed="${barView === "won"}">Won</button>
        </div></div>
      ${barView === "lost" ? stackedBar(lostParts, s.points_lost, "lost") : stackedBar(wonParts, s.points_won, "won")}
    </section>

    <div class="rule" aria-hidden="true"></div>
    <section id="fixes" aria-labelledby="fixH">
      <div class="sec-head"><h2 id="fixH">${top.length ? `Top ${top.length} things to fix` : "Things to fix"}</h2></div>
      ${top.length ? `<ol class="fixes">${top.map((p, i) => fixCard(p, i + 1)).join("")}</ol>`
                   : `<p class="muted">Not enough tracked points yet to rank anything.</p>`}
    </section>

    ${keeps.length ? `<div class="rule" aria-hidden="true"></div>
    <section id="keep" aria-labelledby="keepH">
      <div class="sec-head"><h2 id="keepH">Keep doing</h2></div>
      <ul class="keeps">${keeps.slice(0, 3).map((p) => `<li class="keep"><h3>${esc(p.advice?.headline || p.title)}</h3>${p.points ? `<span class="pts-won num">+${p.points} pts</span>` : ""}</li>`).join("")}</ul>
    </section>` : ""}
    <p class="ai-note"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 9 V14.5" stroke="currentColor" stroke-width="1.8"/><circle cx="10" cy="6" r="1.1" fill="currentColor"/></svg>
      <span>Tips are written by AI from the tracked patterns. They cover tactics and practice, not stroke technique.</span></p>
  `;

  $("moreBody").innerHTML = `
    <div class="tiles">
      <div class="tile"><div class="n num">${pct(sv.first_serve_in_pct)}</div><div class="l">First serves in</div><div class="x num">${sv.first_serves - sv.first_serve_faults} of ${sv.first_serves}</div></div>
      <div class="tile"><div class="n num">${pct(sv.service_points_won_pct)}</div><div class="l">Won on serve</div><div class="x num">of ${sv.points_served} points</div></div>
      <div class="tile"><div class="n num">${pct(rt.return_points_won_pct)}</div><div class="l">Won on return</div><div class="x num">of ${rt.return_points} points</div></div>
    </div>
    ${fixes.length > 3 ? `<h3 class="sub-h">Also worth working on</h3><ol class="fixes sub">${fixes.slice(3).map((p, i) => fixCard(p, i + 4)).join("")}</ol>` : ""}
    ${early.length ? `<h3 class="sub-h">Early signs (too few to rank yet)</h3><ul class="early">${early.map((p) => `<li>${esc(p.detail)}</li>`).join("")}</ul>` : ""}
    <p class="playsum">${esc(pl.playstyle.summary)}</p>`;

  $("player").querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", () => {
    if (b.dataset.view !== barView) { barView = b.dataset.view; renderPlayer(pl); document.querySelector(`.seg button[data-view="${barView}"]`).focus(); }
  }));
}

render();
</script>
</body>
</html>
