<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match Report</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1c7a4a">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="site.css">
<style>
  header.page { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-top: 8px; }
  .tabs { display: flex; gap: 6px; margin: 16px 0 4px; background: var(--surface-2); padding: 4px; border-radius: 12px; }
  .tabs button { flex: 1; border: none; background: transparent; padding: 10px; font-weight: 700; font-size: 1.05rem; color: var(--text-2); }
  .tabs button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px #0002; }
  .style-tags { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 12px; }
  .tag { font-size: 0.9rem; padding: 4px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }

  /* Hero: two big rings, then how points were lost. */
  .hero { margin-top: 14px; }
  .rings { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; text-align: center; }
  .ring { position: relative; width: 100%; max-width: 170px; margin: 0 auto; }
  .ring svg { display: block; width: 100%; height: auto; transform: rotate(-90deg); }
  .ring .val { position: absolute; inset: 0; display: grid; place-content: center; font-size: 2.3rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .ring-lbl { font-weight: 700; font-size: 1.1rem; margin-top: 6px; }
  .ring-ctx { color: var(--text-2); font-size: 0.95rem; }
  .summary { font-size: 1.05rem; margin: 16px 0 0; }
  .minis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; text-align: center; }
  .mini { background: var(--surface-2); border-radius: 12px; padding: 10px 6px; }
  .mini .num { font-size: 1.45rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .mini .lbl { font-size: 0.85rem; color: var(--text-2); }
  .moments { grid-column: 2; font-size: 0.95rem; color: var(--text-2); }
  .moments b { color: var(--text); font-variant-numeric: tabular-nums; font-weight: 600; }
  .seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg button { border: none; background: transparent; min-height: 36px; padding: 4px 14px; font-weight: 700; color: var(--text-2); }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px #0002; }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

  /* Pattern cards: headline + one "Try this" line; details behind a tap. */
  .pattern { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: start; }
  .rank { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 1.15rem; }
  .weak .rank { background: var(--bad-soft); color: var(--bad); }
  .pts { font-weight: 800; font-size: 1rem; white-space: nowrap; }
  .weak .pts { color: var(--bad); }
  .strong .pts { color: var(--accent); }
  .ptitle { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .try { grid-column: 2; font-size: 1.05rem; }
  .try b { color: var(--accent); }
  .more { grid-column: 1 / -1; }
  .more summary { cursor: pointer; font-size: 0.95rem; color: var(--accent); font-weight: 600; padding: 8px 0 2px; list-style: none; }
  .more summary::-webkit-details-marker { display: none; }
  .more summary::after { content: " ▾"; }
  .more[open] summary::after { content: " ▴"; }
  .advice { border-top: 1px dashed var(--border); margin-top: 6px; padding-top: 4px; font-size: 1rem; }
  .advice b { display: block; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-top: 10px; }
  .keep { display: flex; gap: 12px; align-items: baseline; padding: 12px 0; border-top: 1px solid var(--border); }
  .keep:first-child { border-top: none; padding-top: 0; }
  .keep:last-child { padding-bottom: 0; }
  .keep .pts { margin-left: auto; }
  .keep .try { margin-top: 4px; color: var(--text-2); }
  .ai-note { font-size: 0.85rem; color: var(--muted); margin-top: 8px; }

  /* Folded "More stats". */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; }
  .tile { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; }
  .tile .num { font-size: 1.7rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .tile .lbl { font-size: 0.95rem; font-weight: 600; }
  .tile .ctx { font-size: 0.85rem; color: var(--muted); }
  .sub-h { margin: 20px 0 6px; }
  details.fold > summary { cursor: pointer; font-weight: 700; font-size: 1.05rem; }
  .coverage { font-size: 0.9rem; color: var(--text-2); }
  .coverage p { margin: 8px 0 0; }

  .bar { display: flex; height: 34px; border-radius: 8px; overflow: hidden; gap: 2px; background: var(--surface); margin: 12px 0 10px; }
  .bar span { display: block; height: 100%; min-width: 4px; position: relative; cursor: default; }
  .legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 6px 18px; font-size: 0.95rem; }
  .legend div { display: flex; align-items: center; gap: 8px; }
  .legend i { width: 14px; height: 14px; border-radius: 3px; flex: none; }
  .legend .n { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; }
  #tip {
    position: fixed; pointer-events: none; background: var(--text); color: var(--bg); font-size: 0.9rem;
    padding: 6px 9px; border-radius: 6px; display: none; z-index: 10; max-width: 260px;
  }
  .names { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end; margin-top: 10px; }
  .names label { font-size: 0.85rem; color: var(--text-2); }
  @media (max-width: 520px) {
    .names { grid-template-columns: 1fr; }
    .ring .val { font-size: 1.9rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header id="topbar" data-page="report"></header>
  <header class="page">
    <div>
      <div class="muted">Match report</div>
      <h1 id="title">Loading…</h1>
      <div class="sub" id="subtitle"></div>
    </div>
    <button id="editNamesBtn" class="hidden">Edit names</button>
  </header>

  <form id="namesForm" class="card names hidden">
    <div><label for="n1">Player who starts at the near end (closest to the camera)</label><input id="n1" maxlength="40"></div>
    <div><label for="n2">Player who starts at the far end</label><input id="n2" maxlength="40"></div>
    <button type="submit">Save</button>
  </form>

  <div id="error" class="card error hidden"></div>
  <nav class="tabs hidden" id="tabs" role="tablist"></nav>
  <main id="player"></main>
  <details class="card fold hidden" id="coverageBox"><summary>About this data</summary><div class="coverage" id="coverage"></div></details>
</div>
<div id="tip" role="tooltip"></div>

<script src="site.js"></script>
<script src="passcode.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const JOB = params.get("job");
const BACKEND = (params.get("backend") || "").replace(/\/$/, "");   // empty = this site
let profile = null, current = "player_1", barView = "lost";

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (v) => (v === null || v === undefined ? "–" : `${Math.round(v)}%`);

async function load() {
  try {
    const src = params.get("file") || (JOB ? `${BACKEND}/api/profile/${encodeURIComponent(JOB)}` : null);
    if (!src) throw new Error("No report selected. Open this page from the app after processing finishes.");
    const res = await fetch(src);
    if (!res.ok) throw new Error(res.status === 404 ? "This report isn't ready yet." : `Couldn't load the report (HTTP ${res.status}).`);
    profile = await res.json();
    if (params.get("insights")) {             // local testing: separate insights file
      try { profile.insights = await (await fetch(params.get("insights"))).json(); } catch (e) {}
    }
    if (JOB && JOB !== "76a383379d90") $("editNamesBtn").classList.remove("hidden");   // the example report is read only
    render();
    if (JOB) Site.rememberReport(JOB, $("title").textContent);
  } catch (e) {
    $("title").textContent = "Report unavailable";
    $("error").textContent = e.message;
    $("error").classList.remove("hidden");
  }
}

function render() {
  const P = profile.players;
  const ids = Object.keys(P);
  $("title").textContent = ids.map((id) => P[id].name).join(" vs ");
  $("subtitle").textContent = `Points won: ${P[ids[0]].stats.points_won}–${P[ids[1]].stats.points_won}`;
  $("tabs").innerHTML = ids.map((id) =>
    `<button role="tab" data-id="${id}" aria-selected="${id === current}">${esc(P[id].name)}</button>`).join("");
  $("tabs").classList.remove("hidden");
  $("tabs").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { current = b.dataset.id; render(); }));
  $("n1").value = P.player_1?.name || ""; $("n2").value = P.player_2?.name || "";
  renderPlayer(P[current]);
  $("coverage").innerHTML = profile.coverage.notes.map((n) => `<p>${esc(n)}</p>`).join("") +
    `<p>Patterns need at least ${profile.min_sample.occurrences} occurrences out of ${profile.min_sample.chances} chances before they're ranked; smaller ones are listed as early signs.</p>`;
  $("coverageBox").classList.remove("hidden");
}

function adviceFor(pid) {
  const ins = profile.insights && profile.insights.players && profile.insights.players[pid];
  const byId = {};
  (ins?.insights || []).forEach((i) => { byId[i.pattern_id] = i; });
  return { summary: ins?.game_summary, byId };
}

// One fix: headline + points + a single "Try this" line; the rest behind a tap.
// Insights older than VERSION 4 have no try_this: fall back to the match strategy.
function fixCard(p, advice, rank) {
  const a = advice.byId[p.id];
  const pts = p.points ? `<span class="pts">−${p.points} pts</span>` : "";
  const tryLine = a?.try_this || (a?.match_strategy || "").split(/(?<=[.!?])\s/)[0];
  const steps = !a ? [] : [["In matches", a.match_strategy], ["Habit to build", a.habit], ["Practice drill", a.practice_drill]]
    .filter(([, t]) => t);
  return `<div class="card pattern weak">
    <div class="rank">${rank}</div>
    <div class="ptitle"><h3>${esc(a?.headline || p.title)}</h3>${pts}</div>
    <div class="try">${tryLine ? `<b>Try this:</b> ${esc(tryLine)}` : esc(p.detail)}</div>
    ${momentsLine(p.moments)}
    <details class="more"><summary>${a ? "How to practise it" : "Details"}</summary><div class="advice">
      ${steps.map(([h, t]) => `<b>${h}</b>${esc(t)}`).join("")}
      <b>Why</b>${esc(p.detail)}</div></details>
  </div>`;
}

// Video times (seconds) as m:ss, or h:mm:ss past an hour.
function clock(sec) {
  const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, ss = String(sec % 60).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${ss}` : `${m}:${ss}`;
}
// "Watch in your video: 0:25 · 2:07 · …" -- where each counted point starts.
const MAX_MOMENTS = 5;
function momentsLine(moments) {
  if (!moments || !moments.length) return "";
  const shown = moments.slice(0, MAX_MOMENTS).map((t) => `<b>${clock(t)}</b>`).join(" · ");
  const more = moments.length > MAX_MOMENTS ? ` and ${moments.length - MAX_MOMENTS} more` : "";
  return `<div class="moments">▶ Watch in your video: ${shown}${more}</div>`;
}

// Donut ring: share of a whole, value printed in the middle.
function ring(value, color, label, ctx) {
  const v = value === null || value === undefined ? null : Math.max(0, Math.min(100, value));
  const C = 2 * Math.PI * 42;
  const arc = v === null || v === 0 ? "" : `<circle cx="50" cy="50" r="42" fill="none" stroke="${color}" stroke-width="12"
      stroke-linecap="round" stroke-dasharray="${(C * v / 100).toFixed(1)} ${C.toFixed(1)}"/>`;
  return `<div><div class="ring" role="img" aria-label="${esc(label)}: ${pct(v)}">
      <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="var(--surface-2)" stroke-width="12"/>${arc}</svg>
      <div class="val">${pct(v)}</div></div>
    <div class="ring-lbl">${esc(label)}</div><div class="ring-ctx">${esc(ctx)}</div></div>`;
}

// Stacked bar: segments in fixed slot order; 2px surface gaps; hover tooltip; legend with counts.
function stackedBar(parts, total, verb) {
  const shown = parts.filter((x) => x.n > 0);
  if (!total || !shown.length) return `<div class="muted">No points ${verb} yet.</div>`;
  const bar = shown.map((x) => `<span style="flex:${x.n};background:var(--s${x.slot})"
      data-tip="${esc(x.label)}: ${x.n} of ${total} points ${verb} (${Math.round(100 * x.n / total)}%)"></span>`).join("");
  const legend = shown.map((x) => `<div><i style="background:var(--s${x.slot})"></i>${esc(x.label)}<span class="n">${x.n}</span></div>`).join("");
  return `<div class="bar" role="img" aria-label="${esc(shown.map((x) => `${x.label} ${x.n}`).join(", "))}">${bar}</div><div class="legend">${legend}</div>`;
}

function renderPlayer(pl) {
  const s = pl.stats, sv = s.serve, rt = s.return;
  const advice = adviceFor(pl.id);
  // Points-ranked patterns first, then serve/return/rally-length context ones.
  const ordered = (list) => {
    const ok = list.filter((p) => !p.low_sample);
    return [...ok.filter((p) => p.tier === "headline"), ...ok.filter((p) => p.tier !== "headline")];
  };
  const fixes = ordered(pl.weaknesses), keeps = ordered(pl.strengths);
  const early = [...pl.weaknesses, ...pl.strengths].filter((p) => p.low_sample);
  const errs = s.lost_by.own_errors;

  const lostParts = [
    { label: "Into the net", n: errs.net || 0, slot: 1 },
    { label: "Long", n: errs.long || 0, slot: 2 },
    { label: "Wide", n: errs.wide || 0, slot: 3 },
    { label: "Missed (direction unclear)", n: errs.unclassified || 0, slot: 4 },
    { label: "Double faults", n: s.lost_by.double_faults, slot: 5 },
    { label: "Opponent's shot not returned", n: s.lost_by.opponent_winners, slot: 6 },
  ];
  const wonParts = [
    { label: "Their shot not returned", n: s.won_by.winners, slot: 1 },
    { label: "Serve not returned", n: s.won_by.aces, slot: 2 },
    { label: "Opponent missed", n: s.won_by.opponent_errors, slot: 3 },
    { label: "Opponent double faults", n: s.won_by.opponent_double_faults, slot: 4 },
  ];
  // Rally length: average shots per point (older reports: share of short points).
  const rl = s.rally_length, played = rl.short.played + rl.medium.played + rl.long.played;
  const rally = s.avg_rally_shots != null ? s.avg_rally_shots : pct(played ? 100 * rl.short.played / played : null);
  const rallyLbl = s.avg_rally_shots != null ? "Shots per rally" : "Short points";

  $("player").onclick = (e) => {
    const b = e.target.closest(".seg button");
    if (b && b.dataset.view !== barView) { barView = b.dataset.view; renderPlayer(pl); }
  };
  $("player").innerHTML = `
    <section class="card hero">
      <div class="style-tags">${pl.playstyle.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>
      <div class="rings">
        ${ring(s.points_won_pct, "var(--accent)", "Points won", `${s.points_won} of ${s.points_played}`)}
        ${ring(sv.serves_in_pct, "var(--s1)", "Serves in", `${sv.serves_in} of ${sv.serves_tracked}`)}
      </div>
      <div class="minis">
        <div class="mini" title="Serves the opponent didn't return"><div class="num">${sv.aces}</div><div class="lbl">Aces</div></div>
        <div class="mini" title="At least this many: some serves aren't seen"><div class="num">${sv.double_faults}</div><div class="lbl">Double faults</div></div>
        <div class="mini"><div class="num">${rally}</div><div class="lbl">${rallyLbl}</div></div>
      </div>
      ${advice.summary ? `<p class="summary">${esc(advice.summary)}</p>` : ""}
    </section>
    <section class="card">
      <div class="card-head"><h3>How ${esc(pl.name)} ${barView} points</h3>
        <div class="seg" role="group" aria-label="Show points lost or won">
          <button type="button" data-view="lost" aria-pressed="${barView === "lost"}">Lost</button>
          <button type="button" data-view="won" aria-pressed="${barView === "won"}">Won</button>
        </div></div>
      ${barView === "lost" ? stackedBar(lostParts, s.points_lost, "lost") : stackedBar(wonParts, s.points_won, "won")}
    </section>

    <h2>${fixes.length ? `Top ${Math.min(3, fixes.length)} things to fix` : "Things to fix"}</h2>
    ${fixes.length ? fixes.slice(0, 3).map((p, i) => fixCard(p, advice, i + 1)).join("")
                   : `<div class="muted">Not enough tracked points yet to rank anything.</div>`}

    ${keeps.length ? `<h2>Keep doing</h2><div class="card strong">${keeps.slice(0, 3).map((p) => {
        const a = advice.byId[p.id];
        return `<div class="keep"><div><h3>${esc(a?.headline || p.title)}</h3>${a?.try_this ? `<div class="try">${esc(a.try_this)}</div>` : ""}</div>${p.points ? `<span class="pts">+${p.points} pts</span>` : ""}</div>`;
      }).join("")}</div>` : ""}
    ${profile.insights ? `<div class="ai-note">Tips are written by AI from the tracked patterns. They cover tactics and practice, not stroke technique.</div>` : ""}

    <details class="card fold"><summary>More stats</summary>
      <div class="tiles">
        <div class="tile"><div class="num">${pct(sv.first_serve_in_pct)}</div><div class="lbl">First serves in</div><div class="ctx">${sv.first_serves - sv.first_serve_faults} of ${sv.first_serves}</div></div>
        <div class="tile"><div class="num">${pct(sv.service_points_won_pct)}</div><div class="lbl">Won on serve</div><div class="ctx">of ${sv.points_served} points</div></div>
        <div class="tile"><div class="num">${pct(rt.return_points_won_pct)}</div><div class="lbl">Won on return</div><div class="ctx">of ${rt.return_points} points</div></div>
      </div>
      ${fixes.length > 3 ? `<h3 class="sub-h">Also worth working on</h3>${fixes.slice(3).map((p, i) => fixCard(p, advice, i + 4)).join("")}` : ""}
      ${early.length ? `<h3 class="sub-h">Early signs (too few to rank yet)</h3>${early.map((p) => `<p style="margin:6px 0 0">${esc(p.detail)}</p>`).join("")}` : ""}
      <p class="muted" style="margin-top:16px">${esc(pl.playstyle.summary)}</p>
    </details>
  `;
}

// ── hover/tap tooltip for chart segments ────────────────────────────────
document.addEventListener("pointermove", (e) => {
  const t = e.target.closest && e.target.closest("[data-tip]");
  const tip = $("tip");
  if (!t) { tip.style.display = "none"; return; }
  tip.textContent = t.dataset.tip;
  tip.style.display = "block";
  tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + "px";
  tip.style.top = (e.clientY - tip.offsetHeight - 12) + "px";
});

// ── rename players (job mode) ───────────────────────────────────────────
$("editNamesBtn").addEventListener("click", () => $("namesForm").classList.toggle("hidden"));
$("namesForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = new FormData();
  form.append("player1_name", $("n1").value);
  form.append("player2_name", $("n2").value);
  try {
    const res = await fetch(`${BACKEND}/api/names/${encodeURIComponent(JOB)}`, { method: "POST", body: form });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const names = (await res.json()).names;
    for (const [pid, pl] of Object.entries(profile.players)) pl.name = names[pid] || (pid === "player_1" ? "Player 1" : "Player 2");
    $("namesForm").classList.add("hidden");
    render();
    Site.rememberReport(JOB, $("title").textContent);
  } catch (err) { alert(`Couldn't save names: ${err.message}`); }
});

load();
</script>
</body>
</html>
