<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match Report · Advantage AI</title>
<meta name="description" content="Match report: what is costing each player points and what to practise.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F1A14">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
/* ── Design tokens: every decision lives here ─────────────────────────── */
:root {
  --font-serif: "Newsreader", "Iowan Old Style", Georgia, serif;
  --font-sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --text-sm: 0.9375rem;
  --text-base: 1.0625rem;
  --text-lg: 1.1875rem;
  --text-xl: 1.5rem;
  --text-2xl: 2rem;
  --text-display: clamp(2.25rem, 1.5rem + 3.6vw, 3.5rem);
  --text-num: 2.25rem;
  --leading-tight: 1.08;
  --leading-snug: 1.3;
  --leading-body: 1.55;
  --tracking-display: -0.025em;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-5: 24px; --space-6: 32px; --space-7: 48px; --space-8: 64px; --space-9: 96px;
  --gutter: 16px;
  --col: 760px;
  --tap: 48px;
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-pill: 999px;
  --bar-w: 3px;
  --ring-size: 168px;
  --ring-size-phone: 136px;
  --ring-num: 2.75rem;
  --panel-pad: var(--space-6);
  --panel-gap: var(--space-5);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --dur: 220ms;

  --focus: 0 0 0 3px var(--bg), 0 0 0 5px var(--accent);
}

/* ── Base ─────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: var(--space-5); }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 400 var(--text-base)/var(--leading-body) var(--font-sans);
  -webkit-font-smoothing: antialiased; caret-color: var(--accent); scrollbar-color: var(--line-strong) var(--bg); }
::selection { background: var(--accent); color: var(--on-accent); }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
:focus-visible { outline: none; box-shadow: var(--focus); border-radius: var(--radius-sm); }
h1, h2, h3 { margin: 0; font-weight: 500; text-wrap: balance; }
h2 { font: 700 var(--text-2xl)/var(--leading-tight) var(--font-serif); letter-spacing: -0.015em; }
h3 { font: 600 var(--text-lg)/var(--leading-snug) var(--font-sans); }
p { margin: 0; text-wrap: pretty; }
.muted { color: var(--muted); }
.wrap { max-width: calc(var(--col) + 2 * var(--gutter)); margin: 0 auto; padding: 0 var(--gutter); }
.num { font-variant-numeric: tabular-nums; }

/* ── Top bar ──────────────────────────────────────────────────────────── */
.topbar { border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 0 var(--space-2); min-height: 64px; }
.brand-ai { color: var(--accent); }
.brand { display: inline-flex; align-items: center; gap: 10px; min-height: var(--tap); margin-right: auto;
  color: var(--ink); text-decoration: none; font-weight: 650; font-size: var(--text-lg); letter-spacing: -0.01em; }
.nav { display: flex; gap: var(--space-1); }
.nav a { display: inline-flex; align-items: center; min-height: var(--tap); padding: 0 var(--space-3);
  color: var(--ink-2); text-decoration: none; font-weight: 550; border-radius: var(--radius-sm); }
.nav a:hover { color: var(--ink); background: var(--surface-2); }
@media (max-width: 559px) {
    .nav { order: 3; width: 100%; margin: 0 calc(-1 * var(--space-3)); }
}

/* ── Page head + tabs ─────────────────────────────────────────────────── */
.page-head { padding: var(--space-7) 0 var(--space-5); }
.page-head .label { color: var(--muted); font-weight: 550; }
.page-head h1 { margin-top: var(--space-1); font: 700 var(--text-display)/var(--leading-tight) var(--font-serif); letter-spacing: var(--tracking-display); }
.page-head h1 .vs { color: var(--muted); font-style: italic; font-weight: 400; }
.page-head .score { margin-top: var(--space-2); font-size: var(--text-lg); color: var(--ink-2); }
.page-head .score b { color: var(--ink); font-variant-numeric: tabular-nums; }

.tabs { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--line); }
.tabs button { min-height: 56px; border: 0; background: transparent; cursor: pointer; color: var(--dim);
  font: 700 var(--text-xl)/1 var(--font-serif); letter-spacing: -0.01em; position: relative; border-radius: 0;
  transition: color var(--dur) var(--ease-out); }
.tabs button:hover { color: var(--ink-2); }
.tabs button[aria-selected="true"] { color: var(--ink); }
.tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: var(--bar-w); background: var(--accent); border-radius: 2px; }

.first-fix { display: grid; grid-template-columns: 1fr auto; gap: var(--space-2) var(--space-4); align-items: start;
  margin: var(--space-5) 0 0; padding: var(--space-5) var(--space-5) var(--space-5) calc(var(--space-5) + var(--bar-w));
  position: relative; border-radius: var(--radius-lg); background: var(--accent-soft); color: var(--ink); text-decoration: none;
  transition: background var(--dur) var(--ease-out); }
.first-fix::before { content: ""; position: absolute; left: 0; top: var(--space-4); bottom: var(--space-4); width: 4px; border-radius: 0 3px 3px 0; background: var(--accent); }
.first-fix:hover { background: color-mix(in oklab, var(--accent-soft), var(--accent) 12%); }
.first-fix .ff-label { grid-column: 1 / -1; font-weight: 650; color: var(--accent); letter-spacing: 0.01em; }
.first-fix .ff-text { font: 700 var(--text-2xl)/var(--leading-snug) var(--font-serif); letter-spacing: -0.015em; text-wrap: pretty; }
.first-fix .pts { font-size: var(--text-base); min-height: 34px; padding: 0 14px; margin-top: 4px; }
.first-fix .ff-go { grid-column: 1 / -1; display: inline-flex; align-items: center; gap: var(--space-2); margin-top: var(--space-1); font-weight: 650; color: var(--accent); }
.first-fix .ff-go svg { flex: none; }
@media (max-width: 559px) {
  .first-fix { grid-template-columns: 1fr; padding: var(--space-4) var(--space-4) var(--space-4) calc(var(--space-4) + var(--bar-w)); }
  .first-fix .ff-text { font-size: var(--text-xl); }
  .first-fix .pts { justify-self: start; margin-top: 0; }
}

/* ── Sections ─────────────────────────────────────────────────────────── */
.sec { margin-top: var(--panel-gap); padding: var(--panel-pad); background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-1); scroll-margin-top: var(--space-4); }
@media (max-width: 559px) { .sec { padding: var(--space-5) var(--space-4); } }
.sec > h2 { margin-bottom: var(--space-5); }
.sec-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-5); }

/* hero */
.tags { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-bottom: var(--space-5); }
.tag { display: inline-flex; align-items: center; min-height: 32px; padding: 0 var(--space-3); border-radius: var(--radius-pill);
  border: 1px solid var(--line-strong); color: var(--ink-2); font-weight: 550; font-size: var(--text-sm); }
.rings { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-5); }
.ring-item { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--space-3); }
.ring { position: relative; width: var(--ring-size); height: var(--ring-size); flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .val { position: absolute; inset: 0; display: grid; place-items: center; font: 700 var(--ring-num)/1 var(--font-serif); font-variant-numeric: tabular-nums; }
.ring-lbl { font-weight: 650; font-size: var(--text-lg); }
.ring-ctx { color: var(--muted); font-variant-numeric: tabular-nums; }
@media (max-width: 559px) {
  :root { --ring-size: var(--ring-size-phone); --ring-num: 2.25rem; }
  .rings { gap: var(--space-3); }
}
.minis { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); margin: var(--space-6) 0 0; padding: 0; }
.mini { padding: var(--space-4); background: var(--surface-2); border-radius: var(--radius-md); }
.mini .mv { margin: 0; font: 700 var(--text-num)/1 var(--font-serif); font-variant-numeric: tabular-nums; }
.mini .mv.todo { font: 600 var(--text-base)/2.25rem var(--font-sans); color: var(--muted); }
.mini .ml { margin-top: var(--space-2); color: var(--ink-2); font-size: var(--text-sm); font-weight: 550; }
.summary { margin-top: var(--space-6); font: 700 1.3125rem/1.5 var(--font-serif); color: var(--ink); max-width: 62ch; }

/* lost/won switch */
.seg { display: inline-flex; padding: 3px; border-radius: var(--radius-pill); background: var(--surface-2); }
.seg button { min-height: 42px; min-width: 76px; padding: 0 var(--space-4); border: 0; border-radius: var(--radius-pill);
  background: transparent; color: var(--ink-2); font: 600 var(--text-base)/1 var(--font-sans); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }
.bar { display: flex; gap: 2px; height: 28px; border-radius: var(--radius-sm); overflow: hidden; }
.bar span { min-width: 6px; }
.legend { list-style: none; margin: var(--space-4) 0 0; padding: 0; }
.legend li { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) 0; border-top: 1px solid var(--line); color: var(--ink-2); }
.legend li:first-child { border-top: 0; }
.legend i { width: 14px; height: 14px; border-radius: 4px; flex: none; }
.legend .n { margin-left: auto; font-weight: 650; color: var(--ink); font-variant-numeric: tabular-nums; }
.legend .total { color: var(--muted); }

/* fixes: vertical list, the open (or first) one carries the green bar */
.fixes { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-5); }
.fix { position: relative; display: grid; grid-template-columns: 2.5rem 1fr; gap: 0 var(--space-3); padding: var(--space-1) 0 var(--space-1) var(--space-5); }
.fix::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: var(--bar-w); border-radius: 2px; background: var(--line); transition: background var(--dur) var(--ease-out); }
.fix.is-first::before, .fix:has(details[open])::before { background: var(--accent); }
.rank { font: 700 2.5rem/1 var(--font-serif); color: var(--dim); font-variant-numeric: tabular-nums; }
.fix.is-first .rank, .fix:has(details[open]) .rank { color: var(--accent); }
.fix-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-2) var(--space-3); }
.fix-head h3 { text-wrap: pretty; font: 700 var(--text-xl)/var(--leading-snug) var(--font-serif); letter-spacing: -0.01em; flex: 1 1 14ch; }
.pts { display: inline-flex; align-items: center; min-height: 28px; padding: 0 10px; border-radius: var(--radius-pill);
  font-weight: 700; font-size: var(--text-sm); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pts.lost { color: var(--bad); background: var(--bad-soft); }
.pts.won { color: var(--accent); background: var(--accent-soft); }
.try { margin-top: var(--space-3); color: var(--ink-2); max-width: 62ch; }
.try b { color: var(--ink); font-weight: 650; }
.moments { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); margin-top: var(--space-3); color: var(--muted); font-size: var(--text-sm); }
.moments .t { color: var(--ink-2); font-weight: 600; font-variant-numeric: tabular-nums; }

/* watch your points (2026-11-01): tap a time or "Watch" and a small player opens at the bottom */
.watch-all { display: inline-flex; align-items: center; gap: var(--space-2); min-height: 40px; padding: 0 var(--space-4); border: 0;
  border-radius: var(--radius-pill); background: var(--accent); color: var(--on-accent); font: 650 var(--text-sm)/1 var(--font-sans); cursor: pointer; }
.watch-all:hover { background: var(--accent-strong); }
.tbtn { min-height: 36px; min-width: 52px; padding: 0 var(--space-3); border: 1px solid var(--line-strong); border-radius: var(--radius-pill);
  background: transparent; color: var(--ink-2); font: 600 var(--text-sm)/1 var(--font-sans); font-variant-numeric: tabular-nums; cursor: pointer; }
.tbtn:hover { border-color: var(--accent); color: var(--ink); }
.tbtn.on { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
.ff-watch { margin-top: var(--space-3); display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); color: var(--muted); font-size: var(--text-sm); }
#watch { position: fixed; z-index: 20; right: var(--space-4); bottom: var(--space-4); width: min(460px, calc(100vw - 2 * var(--space-4)));
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius-lg); box-shadow: var(--shadow-1); overflow: hidden; }
#watch video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; }
.w-stage { position: relative; }
/* full screen (Nov 1): the whole player grows, so the score, ball marker and point buttons stay on.
   The video's own full-screen button is hidden because it would drop them. iPhones can't make a
   page element full screen, so there the player just fills the window (.w-full). */
#watch:fullscreen, #watch.w-full { display: flex; flex-direction: column; background: #000; }
#watch.w-full { position: fixed; inset: 0; z-index: 100; width: auto; border: 0; border-radius: 0; }
#watch:fullscreen .w-stage, #watch.w-full .w-stage { flex: 1; min-height: 0; display: flex; }
#watch:fullscreen video, #watch.w-full video { flex: 1; width: 100%; height: 100%; aspect-ratio: auto; object-fit: contain; }
#watch:fullscreen .w-bar, #watch.w-full .w-bar { background: var(--surface); padding-bottom: max(var(--space-2), env(safe-area-inset-bottom)); }
#watch:fullscreen .w-score, #watch.w-full .w-score { left: 16px; top: max(16px, env(safe-area-inset-top)); font-size: 16px; }
#wBall { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
/* scoreboard over the video: names, finished sets, games, points; dot = server */
.w-score { position: absolute; left: 8px; top: 8px; pointer-events: none; border-collapse: collapse; border-radius: 6px; overflow: hidden;
  background: rgba(8, 18, 12, 0.84); color: #fff; font: 600 12px/1 var(--font-sans); font-variant-numeric: tabular-nums; }
.w-score td { padding: 4px 6px; text-align: center; }
.w-score td.nm { text-align: left; max-width: 9em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.w-score td.sv::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 5px; border-radius: 50%; background: #E9FF4D; vertical-align: 1px; }
.w-score td.set { color: rgba(255, 255, 255, 0.7); }
.w-score .end { margin-left: 5px; font-weight: 500; font-size: 10px; color: rgba(255, 255, 255, 0.65); }
.w-score td.pt { min-width: 2.2em; background: rgba(255, 255, 255, 0.14); color: #E9FF4D; }
.w-bar { display: flex; align-items: center; gap: var(--space-1); padding: var(--space-2) var(--space-2) var(--space-2) var(--space-4); }
.w-title { flex: 1; min-width: 0; font-weight: 650; font-size: var(--text-sm); }
.w-title .w-sub { display: block; color: var(--muted); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.w-btn { width: var(--tap); height: var(--tap); flex: none; display: grid; place-items: center; border: 0; border-radius: var(--radius-pill);
  background: transparent; color: var(--ink); cursor: pointer; }
.w-btn:hover { background: var(--surface-2); }
/* slow motion: small and quiet until it's on (Rudra: "make the button subtle") */
.w-speed { height: 32px; padding: 0 8px; flex: none; border: 1px solid transparent; border-radius: var(--radius-pill); background: transparent;
  color: var(--dim); font: 600 var(--text-sm)/1 var(--font-sans); font-variant-numeric: tabular-nums; cursor: pointer; }
.w-speed:hover { color: var(--ink-2); }
.w-speed[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
.w-btn:disabled { color: var(--dim); cursor: default; background: transparent; }
.w-msg { padding: var(--space-5) var(--space-4); color: var(--ink-2); }
body.watching .end { height: 60vh; }
@media (min-width: 560px) { body.watching .end { height: 340px; } }
@media (max-width: 559px) { #watch { left: 0; right: 0; bottom: 0; width: auto; border-width: 1px 0 0; border-radius: var(--radius-lg) var(--radius-lg) 0 0; } }

/* stats, each with one plain line (2026-11-01) */
.stats-x { list-style: none; margin: 0; padding: 0; }
.stats-x li { display: grid; grid-template-columns: 5.5rem 1fr; gap: 0 var(--space-4); padding: var(--space-4) 0; border-top: 1px solid var(--line); }
.stats-x li:first-child { border-top: 0; padding-top: 0; }
.stats-x .v { font: 700 var(--text-num)/1 var(--font-serif); font-variant-numeric: tabular-nums; }
.stats-x .l { font-weight: 650; }
.stats-x .x { margin-top: 2px; color: var(--ink-2); max-width: 58ch; }
.keep .why { display: block; margin-top: var(--space-1); color: var(--ink-2); font: 400 var(--text-base)/var(--leading-body) var(--font-sans); }
.sure p { color: var(--ink-2); max-width: 62ch; }
.sure p + p { margin-top: var(--space-3); }
.fix-body { grid-column: 2; min-width: 0; }
@media (max-width: 559px) {
  .fix { grid-template-columns: 1fr; padding-left: var(--space-4); }
  .rank { font-size: 2rem; margin-bottom: var(--space-2); }
  .fix-body { grid-column: 1; }
}
details.more { margin-top: var(--space-3); }
details summary { list-style: none; cursor: pointer; }
details summary::-webkit-details-marker { display: none; }
details.more > summary { display: inline-flex; align-items: center; gap: var(--space-2); min-height: var(--tap); font-weight: 650; color: var(--accent); }
details summary svg { flex: none; transition: transform var(--dur) var(--ease-out); }
details[open] > summary svg { transform: rotate(180deg); }
.advice { display: grid; gap: var(--space-4); padding: var(--space-4) var(--space-5); background: var(--surface-2); border-radius: var(--radius-md); }
.advice div { color: var(--ink-2); max-width: 62ch; }
.advice b { display: block; color: var(--ink); font-weight: 650; margin-bottom: 2px; }

/* keep doing */
.keeps { list-style: none; margin: 0; padding: 0; }
.keep { display: flex; align-items: baseline; gap: var(--space-3); padding: var(--space-4) 0; border-top: 1px solid var(--line); }
.keep:first-child { border-top: 0; padding-top: 0; }
.keep h3 { flex: 1; text-wrap: pretty; font: 700 var(--text-lg)/var(--leading-snug) var(--font-serif); font-size: 1.3125rem; }
.ai-note { margin-top: var(--space-6); color: var(--muted); font-size: var(--text-sm); max-width: 62ch; }

/* folds */
details.fold { margin-top: var(--space-3); padding: 0 var(--panel-pad); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); }
#player > details.fold { margin-top: var(--panel-gap); }
@media (max-width: 559px) { details.fold { padding: 0 var(--space-4); } }
details.fold > summary { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); min-height: 64px;
  font: 700 var(--text-xl)/1.2 var(--font-serif); color: var(--ink); }
details.fold > summary:hover { color: var(--accent); }
details.fold > summary svg { color: var(--muted); }
.fold-body { padding: 0 0 var(--space-6); }
.fold-body p + p { margin-top: var(--space-3); }
.fold-body p { color: var(--ink-2); max-width: 66ch; }
.sub-h { margin: var(--space-7) 0 var(--space-4); font: 600 var(--text-lg)/1.3 var(--font-sans); }
.early { list-style: none; margin: 0; padding: 0; }
.early li { padding: var(--space-3) 0; border-top: 1px solid var(--line); color: var(--ink-2); }
.early li:first-child { border-top: 0; }
.playstyle { margin-top: var(--space-6); }

#tip { position: fixed; z-index: 10; display: none; max-width: 260px; padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm);
  background: var(--ink); color: var(--bg); font-size: var(--text-sm); pointer-events: none; box-shadow: var(--shadow-1); }
.end { height: var(--space-8); }

@media (min-width: 768px) {
  :root { --gutter: 24px; }
  .page-head { padding-top: var(--space-8); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } html { scroll-behavior: auto; } }


/* Live-report extras: edit names, loading and error states. */
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--space-3); }
#namesForm { margin-top: var(--space-4); padding: var(--space-5); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
  display: grid; grid-template-columns: 1fr 1fr auto; gap: var(--space-3); align-items: end; }
#namesForm label { display: block; font-size: var(--text-sm); color: var(--ink-2); margin-bottom: var(--space-2); }
#namesForm input { width: 100%; font: inherit; min-height: var(--tap); padding: 0 var(--space-3); border-radius: var(--radius-sm);
  border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--ink); }

<script>
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const JOB = params.get("job");
const EXAMPLES = ["76a383379d90", "e0e0e0e0e0e0"];   // read-only showcase match + its test-site copy
const BACKEND = (params.get("backend") || "").replace(/\/$/, "");   // empty = this site
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (v) => (v === null || v === undefined ? "–" : `${Math.round(v)}%`);
const CHEV = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>`;
let profile = null, DATA = null, HAS_INSIGHTS = false, current = "player_1", barView = "lost";

// The page draws from one shape: each pattern carries its AI advice (matched by pattern id),
// each player carries the AI one-paragraph summary.
function shape(pf) {
  const out = { coverage: pf.coverage, min_sample: pf.min_sample, players: {} };
  for (const [pid, pl] of Object.entries(pf.players)) {
    const ins = pf.insights && pf.insights.players && pf.insights.players[pid];
    const byId = {};
    (ins?.insights || []).forEach((i) => { byId[i.pattern_id] = i; });
    const withAdvice = (p) => ({ ...p, advice: byId[p.id] || null });
    out.players[pid] = { ...pl, id: pid, ai_summary: ins?.game_summary,
      weaknesses: pl.weaknesses.map(withAdvice), strengths: pl.strengths.map(withAdvice) };
  }
  return out;
}

async function load() {
  try {
    const src = params.get("file") || (JOB ? `${BACKEND}/api/profile/${encodeURIComponent(JOB)}` : null);
    if (!src) throw new Error("No report selected. Open this page from the app after processing finishes.");
    const res = await fetch(src);
    if (!res.ok) throw new Error(res.status === 404 ? "This report isn't ready yet." : `Couldn't load the report (HTTP ${res.status}).`);
    profile = await res.json();
    if (params.get("insights")) {             // local testing: separate insights file
      try { profile.insights = await (await fetch(params.get("insights"))).json(); } catch (e) {}
    }
    HAS_INSIGHTS = !!profile.insights;
    DATA = shape(profile);
    if (JOB && !EXAMPLES.includes(JOB)) {   // the example report (and its test-site copy) is read only
      $("editNamesBtn").classList.remove("hidden");
      $("deleteBtn").classList.remove("hidden");
    }
    $("n1").value = profile.players.player_1?.name || ""; $("n2").value = profile.players.player_2?.name || "";
    Site.teamNameHints([$("n1"), $("n2")]);
    render();
    if (params.get("watch")) document.querySelector(".poster")?.click();   // "Watch the points" on the dashboard
    $("pdfBtn").classList.remove("hidden");
    if (JOB) Site.rememberReport(JOB, $("title").textContent);
    if (Site.dev && JOB && !EXAMPLES.includes(JOB)) {   // timings: dev mode only
      fetch(`${BACKEND}/api/status/${encodeURIComponent(JOB)}`).then((r) => r.json())
        .then((st) => { timingHtml = timingFrom(st); if (timingHtml) render(); }).catch(() => {});
    }
  } catch (e) {
    $("title").textContent = "Report unavailable";
    $("error").textContent = e.message;
    $("error").classList.remove("hidden");
  }
}

function clock(sec) {
  const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, ss = String(sec % 60).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${ss}` : `${m}:${ss}`;
}
const MAX_MOMENTS = 5;
const PLAY_ICON = `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z"/></svg>`;
// Each point as [start, end] seconds; older reports only have start times.
const clipsOf = (p) => p.clips && p.clips.length ? p.clips : (p.moments || []).map((t) => [t, t + 12]);
function momentsLine(p) {
  const moments = p.moments;
  if (!moments || !moments.length) return "";
  const shown = moments.slice(0, MAX_MOMENTS).map((t, i) =>
    `<button type="button" class="tbtn" data-w="${esc(p.id)}" data-i="${i}" aria-label="Watch the point at ${clock(t)}">${clock(t)}</button>`).join("");
  const more = moments.length > MAX_MOMENTS ? `<span>and ${moments.length - MAX_MOMENTS} more</span>` : "";
  return `<p class="moments"><button type="button" class="watch-all" data-w="${esc(p.id)}" data-i="0">${PLAY_ICON} Watch ${moments.length === 1 ? "this point" : `these ${moments.length} points`}</button>${shown}${more}</p>`;
}
const firstSentence = (t) => (t || "").split(/(?<=[.!?])\s/)[0];
const headlineOf = (p) => (p.advice && p.advice.headline) || p.title;

// One fix, always the same shape: rank, headline, −N pts, one line (Try this / Why), times, fold.
function fixCard(p, rank, first) {
  const a = p.advice;
  const pts = p.points ? `<span class="pts lost">−${p.points} pts</span>` : "";
  const tryLine = a ? (a.try_this || firstSentence(a.match_strategy)) : "";
  const line = tryLine ? `<b>Try this:</b> ${esc(tryLine)}` : `<b>Why:</b> ${esc(p.detail)}`;
  const steps = !a ? [] : [["In matches", a.match_strategy], ["Habit to build", a.habit], ["Practice drill", a.practice_drill]].filter(([, t]) => t);
  return `<li class="fix${first ? " is-first" : ""}" id="fix-${esc(p.id)}">
    <div class="rank" aria-label="Number ${rank}">${rank}</div>
    <div class="fix-body">
      <div class="fix-head"><h3>${esc(headlineOf(p))}</h3>${pts}</div>
      <p class="try">${line}</p>
      ${momentsLine(p)}
      <details class="more"><summary>${a ? "How to practise it" : "Details"} ${CHEV}</summary>
        <div class="advice">${steps.map(([h, t]) => `<div><b>${h}</b>${esc(t)}</div>`).join("")}<div><b>Why</b>${esc(p.detail)}</div></div>
      </details>
    </div>
  </li>`;
}

function ring(value, color, label, ctx) {
  const v = value === null || value === undefined ? null : Math.max(0, Math.min(100, value));
  const C = 2 * Math.PI * 42;
  const arc = !v ? "" : `<circle cx="50" cy="50" r="42" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(C * v / 100).toFixed(1)} ${C.toFixed(1)}"/>`;
  return `<div class="ring-item"><div class="ring" role="img" aria-label="${esc(label)}: ${pct(v)}, ${esc(ctx)}">
      <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="var(--surface-2)" stroke-width="10"/>${arc}</svg>
      <div class="val">${pct(v)}</div></div>
    <div><div class="ring-lbl">${esc(label)}</div><div class="ring-ctx">${esc(ctx)}</div></div></div>`;
}

function stackedBar(parts, total, verb, palette) {
  const shown = parts.filter((x) => x.n > 0);
  if (!total || !shown.length) return `<p class="muted">No points ${verb} yet.</p>`;
  const bar = shown.map((x) => `<span style="flex:${x.n};background:var(--${palette}-${x.slot})" data-tip="${esc(x.label)}: ${x.n} of ${total} points ${verb} (${Math.round(100 * x.n / total)}%)"></span>`).join("");
  const legend = shown.map((x) => `<li><i style="background:var(--${palette}-${x.slot})"></i>${esc(x.label)}<span class="n">${x.n}</span></li>`).join("");
  return `<div class="bar" role="img" aria-label="${esc(shown.map((x) => `${x.label} ${x.n}`).join(", "))}">${bar}</div>
    <ul class="legend">${legend}<li class="total">Total points ${verb}<span class="n">${total}</span></li></ul>`;
}

// The match in one line: points won, sets when the app counted them, video length.
function matchLine(P, ids) {
  const m = profile.match || {}, sc = m.score || {};
  const bits = [`Points won <b>${P[ids[0]].stats.points_won}–${P[ids[1]].stats.points_won}</b>`];
  const sets = (sc.completed_sets || []).map((s) => s.join("-")).join(", ");   // [player_1 games, player_2 games]
  if (sets) bits.push(`Sets <b>${esc(sets)}</b>`);
  if (sc.match_winner && P[sc.match_winner]) bits.push(`<b>${esc(P[sc.match_winner].name)}</b> won`);
  if (m.length_s) bits.push(`<b>${Math.max(1, Math.round(m.length_s / 60))} min</b> of video`);
  const c = DATA.coverage, found = c.rallies_detected - c.first_serve_faults - c.unconfirmed_serve_faults;
  if (found > c.points_decided) bits.push(`<a href="#${current}-sure">${c.points_decided} of ${found} points called</a>`);
  return bits.join(" · ");
}

// Serve and return stats, each with one plain line saying what it means (Rudra, Nov 1).
// Double faults, missed shots and rally length are left out: the bars and fixes above
// already show them (pretend users, Nov 1: "it says the same thing three times").
const wonOf = (pctWon, n) => Math.round((pctWon || 0) * n / 100);
function statRows(s) {
  const sv = s.serve, rt = s.return, rows = [];
  const add = (v, l, x) => rows.push({ v, l, x });
  if (sv.first_serves) {
    const p = sv.first_serve_in_pct;
    add(pct(p), "First serves in", `${sv.first_serves - sv.first_serve_faults} of ${sv.first_serves} first serves went in. ` +
      (p >= 65 ? "Reliable: most points start on a first serve." : p < 50 ? "Under half, so the opponent sees a lot of second serves." : "About half: every extra first serve in takes pressure off the second."));
  }
  if (sv.second_serves && sv.second_serves_in != null) {
    add(pct(sv.second_serve_in_pct), "Second serves in", `${sv.second_serves_in} of ${sv.second_serves} second serves went in. Every miss here is a double fault.`);
  }
  if (sv.first_serve_points && sv.second_serve_points) {
    const p1 = sv.first_serve_points_won_pct, p2 = sv.second_serve_points_won_pct;
    add(`${pct(p1)}<br>${pct(p2)}`, "Points won: 1st serve, 2nd serve",
      `Won ${wonOf(p1, sv.first_serve_points)} of ${sv.first_serve_points} points on the first serve and ${wonOf(p2, sv.second_serve_points)} of ${sv.second_serve_points} on the second. ` +
      (p1 - p2 >= 15 ? "The second serve is where points slip away: the opponent can attack it." : p2 - p1 >= 15 ? "Points after a second serve went better than after a first serve this match." : "About the same on both serves."));
  }
  if (sv.points_served) {
    const p = sv.service_points_won_pct;
    add(pct(p), "Won on serve", `Won ${wonOf(p, sv.points_served)} of ${sv.points_served} points when serving. ` +
      (p >= 55 ? "Serving gave an edge." : p < 45 ? "Lost more than half of these." : "About even on serve."));
  }
  if (rt.return_points) {
    const p = rt.return_points_won_pct;
    add(pct(p), "Won on return", `Won ${wonOf(p, rt.return_points)} of ${rt.return_points} points when the opponent served. ` +
      (p >= 50 ? "Even or better when returning." : "Lost most of these: the opponent held serve well."));
  }
  return rows;
}
function statsHtml(s, idp) {
  return `<section class="sec" aria-labelledby="${idp}statH"><h2 id="${idp}statH">Serve and return, explained</h2>
    <ul class="stats-x">${statRows(s).map((r) => `<li><div class="v">${r.v}</div><div><div class="l">${esc(r.l)}</div><p class="x">${esc(r.x)}</p></div></li>`).join("")}</ul>
  </section>`;
}

// How sure the app is: how many of the points it found it could call.
function sureHtml(idp) {
  const c = DATA.coverage, found = c.rallies_detected - c.first_serve_faults - c.unconfirmed_serve_faults;
  const left = Math.max(0, found - c.points_decided);
  return `<section class="sec sure" id="${idp || `${current}-`}sure" aria-labelledby="${idp}sureH"><h2 id="${idp}sureH">How sure the app is</h2>
    <p>The app called the winner of <b class="num">${c.points_decided} of ${found}</b> points it found. ${left
      ? `It wasn't sure about the other ${left}, so they're left out of every number on this page.` : "It was sure about all of them."}</p>
    <p>On one match labeled by hand, it named the right winner for 17 of 20 points (85%). "About this data" below lists what it can't measure yet.</p>
  </section>`;
}

function render() {
  const P = DATA.players, ids = Object.keys(P);
  $("tabs").classList.remove("hidden");
  $("title").innerHTML = ids.map((id) => esc(P[id].name)).join(' <span class="vs">vs</span> ');
  $("subtitle").innerHTML = matchLine(P, ids);
  $("tabs").innerHTML = ids.map((id) => `<button type="button" role="tab" id="tab-${id}" data-id="${id}" aria-selected="${id === current}" tabindex="${id === current ? 0 : -1}">${esc(P[id].name)}</button>`).join("");
  $("player").setAttribute("aria-labelledby", `tab-${current}`);
  renderPlayer(P[current]);
  $("shareBtn").classList.remove("hidden");
  $("coverageBox").classList.remove("hidden");
  $("coverage").innerHTML = DATA.coverage.notes.map((n) => `<p>${esc(n)}</p>`).join("") +
    `<p>Patterns need at least ${DATA.min_sample.occurrences} occurrences out of ${DATA.min_sample.chances} chances before they're ranked; smaller ones are left out.</p>` +
    timingHtml;
}

// "How long it took" (2026-10-14, for benchmarks; dev mode only, see site.js): from the job's
// step start times (server clock) and the upload time the page measured. Not on the example.
let timingHtml = "";
function timingFrom(st) {
  const t = st.stage_times || {};
  const clock = (sec) => { const n = Math.round(sec); return n >= 60 ? `${Math.floor(n / 60)} min ${n % 60} s` : `${n} s`; };
  const span = (a, ...ends) => { const e = ends.map((k) => t[k]).find((v) => v && t[a] && v >= t[a]); return e ? e - t[a] : null; };
  const rows = [
    ["Upload (from pressing Upload to 100%)", st.upload_seconds || null],
    ["Recording", span("recording", "preparing")],
    ["Putting the video together", span("preparing", "uploaded", "queued")],
    ["Waiting for a computer to start", span("queued", "detecting")],
    ["Finding the ball and players", span("detecting", "analyzing")],
    ["Working out the points and writing tips", span("analyzing", "done")],
    ["From pressing Start analysis to the report", st.marked_at && t.done && t.done > st.marked_at && !t.recording ? t.done - st.marked_at : null],
    ["From the end of the match to the report", t.recording && t.preparing && t.done ? t.done - t.preparing : null],
  ].filter(([, v]) => v != null && v >= 0);
  if (!rows.length) return "";
  return `<h3 class="sub-h">How long it took</h3><ul class="early">` +
    rows.map(([k, v]) => `<li>${esc(k)}: <b class="num">${clock(v)}</b></li>`).join("") + "</ul>";
}
$("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button[role=tab]");
  if (b && b.dataset.id !== current) { current = b.dataset.id; render(); $(`tab-${current}`).focus(); }
});
$("tabs").addEventListener("keydown", (e) => {
  if (!DATA || (e.key !== "ArrowRight" && e.key !== "ArrowLeft")) return;
  const ids = Object.keys(DATA.players), i = ids.indexOf(current);
  current = ids[(i + (e.key === "ArrowRight" ? 1 : ids.length - 1)) % ids.length];
  render(); $(`tab-${current}`).focus();
});

// The screen view (DESIGN.md). The player element lives in the Watch tile; it steps out while the page redraws.
function renderPlayer(pl) {
  const box = $("watch");
  if (!box.classList.contains("hidden")) watchClose();
  document.body.appendChild(box);
  $("player").innerHTML = courtHtml(pl);
  $("watchSlot")?.appendChild(box);
}

// The report's lines talk about "they"; here we talk to the player whose tab is open.
const you = (t) => String(t ?? "").replace(/\btheir\b/g, "your").replace(/\bthey\b/g, "you");
const pips = (n, of, cls) => (of && of <= 20 ? `<div class="pips" aria-hidden="true">${Array.from({ length: of }, (_, i) => `<i${i < n ? ` class="${cls}"` : ""}></i>`).join("")}</div>` : "");
const orderedOf = (list) => { const ok = list.filter((p) => !p.low_sample); return [...ok.filter((p) => p.tier === "headline"), ...ok.filter((p) => p.tier !== "headline")]; };

function fixRow(p) {
  const a = p.advice;
  const steps = !a ? [] : [["Tactic", a.match_strategy], ["Habit", a.habit], ["Drill", a.practice_drill]].filter(([, t]) => t);
  return `<li id="fix-${esc(p.id)}"><details><summary><span class="minus">−${p.points}<small>point${p.points === 1 ? "" : "s"}</small></span>
      <span><span class="nm">${esc(you(headlineOf(p)))}</span><span class="ln">${esc(you(p.detail))}</span></span>
      <span class="more">Tips<svg aria-hidden="true"><use href="#chev"/></svg></span></summary>
    ${a && a.try_this ? `<p class="try"><b>Try this</b>${esc(a.try_this)}</p>` : ""}
    ${steps.length ? `<dl class="fold">${steps.map(([k, t]) => `<div><dt>${k}</dt><dd>${esc(t)}</dd></div>`).join("")}</dl>` : a ? "" : `<p class="fix-more">No tips for this one yet.</p>`}
    ${momentsLine(p)}</details></li>`;
}

function barHtml(pl) {
  const { lostParts, wonParts } = barParts(pl.stats);
  return barView === "lost" ? stackedBar(lostParts, pl.stats.points_lost, "lost", "lost") : stackedBar(wonParts, pl.stats.points_won, "won", "won");
}

// Point by point: the player's lead after each called point, from the report's own point list.
function flowHtml(pl) {
  const pts = (profile.points || []).filter((p) => p.winner);
  if (pts.length < 2) return "";
  const end = Math.max(...pts.map((p) => p.e || p.s), 1);
  let lead = 0, best = 0, worst = 0;
  const steps = [];
  for (const p of pts) {
    lead += p.winner === pl.id ? 1 : -1;
    steps.push([p.e || p.s, lead]);
    best = Math.max(best, lead); worst = Math.min(worst, lead);
  }
  const span = Math.max(best, -worst, 1), Y = (v) => 100 - v * (88 / span), X = (t) => (640 * t / end).toFixed(1);
  let d = `M0,${Y(0)}`;
  for (const [t, v] of steps) d += ` H${X(t)} V${Y(v)}`;
  d += " H640";
  const ticks = [...new Set([best, 0, worst])];
  const label = (v) => (v === 0 ? "Level" : v > 0 ? `Up ${v}` : `Down ${-v}`);
  const mins = Array.from({ length: 5 }, (_, i) => clock(Math.round(end * i / 4)));
  const finish = steps[steps.length - 1][1];
  const say = finish === 0 ? "Ended level" : finish > 0 ? `Ended up ${finish}` : `Ended down ${-finish}`;
  return `<div class="sh"><h2 class="h-l">Point by point</h2><p>Your lead after each of the ${pts.length} points the app called.</p></div>
    <section class="tile flow" aria-label="Point by point"><div class="chart">
      <svg viewBox="0 0 640 200" preserveAspectRatio="none" role="img" aria-label="${esc(say)}. Biggest lead ${best}, furthest behind ${-worst}.">
        <defs><clipPath id="ab"><rect width="640" height="100"/></clipPath><clipPath id="be"><rect y="100" width="640" height="100"/></clipPath></defs>
        ${ticks.filter((v) => v).map((v) => `<path d="M0 ${Y(v)} H640" stroke="var(--line)" stroke-dasharray="3 5" vector-effect="non-scaling-stroke"/>`).join("")}
        <path d="M0 100 H640" stroke="var(--ink-3)" vector-effect="non-scaling-stroke"/>
        <path d="${d} V100 Z" fill="var(--ball)" clip-path="url(#ab)"/>
        <path d="${d} V100 Z" fill="var(--lost)" fill-opacity=".55" clip-path="url(#be)"/>
        <path d="${d}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
      </svg>
      ${ticks.map((v) => `<span class="yl" style="top:${Y(v)}px">${label(v)}</span>`).join("")}
      <div class="xl" aria-hidden="true">${mins.map((m) => `<span>${m}</span>`).join("")}</div></div>
      <div class="legend2"><span><i style="background:var(--ball)"></i>You were ahead</span><span><i style="background:var(--lost)"></i>You were behind</span></div>
      <p class="verdict">${esc(say)}.</p></section>`;
}

function courtHtml(pl) {
  const s = pl.stats, sv = s.serve;
  const fixes = orderedOf(pl.weaknesses), keeps = orderedOf(pl.strengths).slice(0, 3);
  const top = fixes.slice(0, 3), n1 = top[0];
  const moments = (n1 && n1.moments) || [];
  const a1 = n1 && n1.advice;
  const tryThis = a1 ? (a1.try_this || firstSentence(a1.match_strategy)) : "";
  const strip = n1 ? `<section class="tile strip" aria-label="Your number one fix">
      <div class="tag"><small>YOUR</small>#1 FIX</div>
      <div class="what"><h2 class="h-l">${esc(you(headlineOf(n1)))}</h2><p>${esc(you(n1.detail))}</p></div>
      <div class="count"><span class="board-num">${n1.points}<small>${n1.chances ? `of ${n1.chances} ` : ""}points lost</small></span>${pips(n1.points, n1.chances, "lost")}</div>
    </section>` : `<section class="tile strip"><div class="tag"><small>YOUR</small>#1 FIX</div><div class="what"><h2 class="h-l">Nothing to rank yet</h2><p>Not enough tracked points to pick a fix.</p></div></section>`;
  const watch = moments.length ? `<section class="tile g-video" aria-labelledby="wH">
      <div class="vhead"><h2 class="h-m" id="wH">Watch the ${moments.length === 1 ? "point" : `${moments.length} points`}</h2><span class="muted">Tap a time to jump there</span></div>
      <button type="button" class="poster" data-w="${esc(n1.id)}" data-i="0" aria-label="Play the first point"><span><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg></span></button>
      <div id="watchSlot"></div>
      <div class="moments">${moments.map((t, i) => `<button type="button" class="tbtn" data-w="${esc(n1.id)}" data-i="${i}" aria-label="Watch the point at ${clock(t)}">${clock(t)}</button>`).join("")}</div>
      ${tryThis ? `<p class="try"><b>Try this next match</b>${esc(tryThis)}</p>` : ""}
    </section>` : "";
  const fixTile = top.length ? `<section class="tile g-fixes" id="fixes" aria-labelledby="fxH"><h2 class="h-m" id="fxH" style="margin-bottom:6px">Top ${top.length === 1 ? "fix" : `${top.length} fixes`}</h2>
      <ol class="fixes">${top.map(fixRow).join("")}</ol></section>` : "";
  const kpi = (p) => `<div class="tile kpi"><h3>${esc(you(headlineOf(p)))}</h3>${p.points
    ? `<span class="board-num">${p.points}<small>${p.chances ? `of ${p.chances} ` : ""}points won</small></span>${pips(p.points, p.chances, "won")}`
    : `<p>${esc(you(p.detail))}</p>`}</div>`;
  const rl = s.rally_length, played = rl.short.played + rl.medium.played + rl.long.played;
  const rally = s.avg_rally_shots != null ? s.avg_rally_shots : pct(played ? 100 * rl.short.played / played : null);
  const rows = statRows(s);
  return `${strip}
    <div class="rgrid${watch && fixTile ? "" : " one"}">${watch}${fixTile}</div>
    ${keeps.length ? `<div class="sh"><h2 class="h-l">What went well</h2></div><div class="kpis">${keeps.map(kpi).join("")}</div>
      ${HAS_INSIGHTS ? `<p class="ai-note">Tips are written by AI from the tracked patterns. They cover tactics and practice, not stroke technique.</p>` : ""}` : ""}
    <div class="sh"><h2 class="h-l">How the match went</h2></div>
    <div class="pair">
      <section class="tile game" aria-label="Your game">
        ${pl.playstyle.tags.length ? `<div class="tags">${pl.playstyle.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
        ${pl.ai_summary ? `<p class="summary">${esc(pl.ai_summary)}</p>` : ""}
        <div class="minis">
          <div class="mini" title="Serves the opponent didn't return"><div class="mv">${sv.aces}</div><div class="ml">Aces</div></div>
          <div class="mini" title="At least this many: some serves aren't seen"><div class="mv">${sv.double_faults}</div><div class="ml">Double faults</div></div>
          <div class="mini"><div class="mv">${rally}</div><div class="ml">${s.avg_rally_shots != null ? "Shots per rally" : "Short points"}</div></div>
        </div>
      </section>
      <section class="tile" aria-labelledby="barH">
        <div class="sec-head"><h3 class="h-m" id="barH">How ${esc(pl.name)} <span id="barWord">${barView}</span> points</h3>
          <div class="seg" role="group" aria-label="Show points lost or won">
            <button type="button" data-view="lost" aria-pressed="${barView === "lost"}">Lost</button>
            <button type="button" data-view="won" aria-pressed="${barView === "won"}">Won</button>
          </div></div>
        <div id="barBox">${barHtml(pl)}</div>
      </section>
    </div>
    ${rows.length ? `<div class="sh"><h2 class="h-l">Serve and return</h2></div>
      <div class="sgrid n${rows.length}">${rows.map((r) => `<div class="tile stat"><span class="board-num">${r.v}</span><h3>${esc(r.l)}</h3><p>${esc(r.x)}</p></div>`).join("")}</div>` : ""}
    ${flowHtml(pl)}
    ${sureHtml("")}`;
}

function barParts(s) {
  const errs = s.lost_by.own_errors;
  return {
    lostParts: [
      { label: "Into the net", n: errs.net || 0, slot: 1 },
      { label: "Long", n: errs.long || 0, slot: 2 },
      { label: "Wide", n: errs.wide || 0, slot: 3 },
      { label: "Missed (direction unclear)", n: errs.unclassified || 0, slot: 4 },
      { label: "Double faults", n: s.lost_by.double_faults, slot: 5 },
      { label: "Opponent's shot not returned", n: s.lost_by.opponent_winners, slot: 6 },
    ],
    wonParts: [
      { label: "Their shot not returned", n: s.won_by.winners, slot: 1 },
      { label: "Serve not returned", n: s.won_by.aces, slot: 2 },
      { label: "Opponent missed", n: s.won_by.opponent_errors, slot: 3 },
      { label: "Opponent double faults", n: s.won_by.opponent_double_faults, slot: 4 },
    ],
  };
}

// One player's report as HTML. print: both Lost and Won bars (no switch), ids made unique.
function playerHtml(pl, print = false) {
  const idp = print ? `${pl.id}-` : "";
  const s = pl.stats, sv = s.serve, rt = s.return;
  const ordered = (list) => { const ok = list.filter((p) => !p.low_sample); return [...ok.filter((p) => p.tier === "headline"), ...ok.filter((p) => p.tier !== "headline")]; };
  const fixes = ordered(pl.weaknesses), keeps = ordered(pl.strengths);
  const { lostParts, wonParts } = barParts(s);
  const rl = s.rally_length, played = rl.short.played + rl.medium.played + rl.long.played;
  // Same fallback as the live report: no shot count yet -> share of short points.
  const rally = `<div class="mv num">${s.avg_rally_shots != null ? s.avg_rally_shots : pct(played ? 100 * rl.short.played / played : null)}</div>`;
  const rallyLbl = s.avg_rally_shots != null ? "Shots per rally" : "Short points";
  const top = fixes.slice(0, 3);
  const n1 = top[0];

  return `
    ${n1 ? `<a class="first-fix" href="#${idp}fixes">
      <span class="ff-label">Your #1 fix</span>
      <span class="ff-text">${esc(headlineOf(n1))}</span>
      ${n1.points ? `<span class="pts lost">−${n1.points} pts</span>` : ""}
      <span class="ff-go">See how to fix it <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></span>
    </a>
    ${!print && n1.moments && n1.moments.length ? `<div class="ff-watch"><button type="button" class="watch-all" data-w="${esc(n1.id)}" data-i="0">${PLAY_ICON} Watch the ${n1.moments.length === 1 ? "point" : `${n1.moments.length} points`}</button>See it happen in your video.</div>` : ""}` : ""}

    <section class="sec" aria-label="Overview">
      <div class="tags">${pl.playstyle.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>
      <div class="rings">
        ${ring(s.points_won_pct, "var(--accent)", "Points won", `${s.points_won} of ${s.points_played}`)}
        ${ring(sv.serves_in_pct, "var(--ink-2)", "Serves in", `${sv.serves_in} of ${sv.serves_tracked}`)}
      </div>
      <div class="minis">
        <div class="mini" title="Serves the opponent didn't return"><div class="mv num">${sv.aces}</div><div class="ml">Aces</div></div>
        <div class="mini" title="At least this many: some serves aren't seen"><div class="mv num">${sv.double_faults}</div><div class="ml">Double faults</div></div>
        <div class="mini">${rally}<div class="ml">${rallyLbl}</div></div>
      </div>
      ${pl.ai_summary ? `<p class="summary">${esc(pl.ai_summary)}</p>` : ""}
    </section>

    ${print ? `
    <section class="sec"><h2>How ${esc(pl.name)} lost points</h2>${stackedBar(lostParts, s.points_lost, "lost", "lost")}</section>
    <section class="sec"><h2>How ${esc(pl.name)} won points</h2>${stackedBar(wonParts, s.points_won, "won", "won")}</section>` : `
    <section class="sec" aria-labelledby="barH">
      <div class="sec-head"><h2 id="barH">How ${esc(pl.name)} ${barView} points</h2>
        <div class="seg" role="group" aria-label="Show points lost or won">
          <button type="button" data-view="lost" aria-pressed="${barView === "lost"}">Lost</button>
          <button type="button" data-view="won" aria-pressed="${barView === "won"}">Won</button>
        </div></div>
      ${barView === "lost" ? stackedBar(lostParts, s.points_lost, "lost", "lost") : stackedBar(wonParts, s.points_won, "won", "won")}
    </section>`}

    <section class="sec" id="${idp}fixes" aria-labelledby="${idp}fixH">
      <h2 id="${idp}fixH">${top.length ? `Top ${top.length} things to fix` : "Things to fix"}</h2>
      ${top.length ? `<ol class="fixes">${top.map((p, i) => fixCard(p, i + 1, i === 0)).join("")}</ol>` : `<p class="muted">Not enough tracked points yet to rank anything.</p>`}
    </section>

    ${keeps.length ? `<section class="sec" aria-labelledby="${idp}keepH"><h2 id="${idp}keepH">What went well</h2>
      <ul class="keeps">${keeps.slice(0, 3).map((p) => `<li class="keep"><h3>${esc(headlineOf(p))}<span class="why">${esc(p.detail)}</span></h3>${p.points ? `<span class="pts won">+${p.points} pts</span>` : ""}</li>`).join("")}</ul>
      ${HAS_INSIGHTS ? `<p class="ai-note">Tips are written by AI from the tracked patterns. They cover tactics and practice, not stroke technique.</p>` : ""}
    </section>` : ""}

    ${statsHtml(s, idp)}

    ${sureHtml(idp)}`;
}
$("player").addEventListener("click", (e) => {
  const b = e.target.closest(".seg button");
  if (b && b.dataset.view !== barView) {
    barView = b.dataset.view;
    $("barBox").innerHTML = barHtml(DATA.players[current]);
    $("barWord").textContent = barView;
    document.querySelectorAll(".seg button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  }
});

document.addEventListener("pointermove", (e) => {
  const t = e.target.closest && e.target.closest("[data-tip]");
  const tip = $("tip");
  if (!t) { tip.style.display = "none"; return; }
  tip.textContent = t.dataset.tip;
  tip.style.display = "block";
  tip.style.left = Math.max(8, Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8)) + "px";
  tip.style.top = (e.clientY - tip.offsetHeight - 12) + "px";
});


// ── Watch your points (2026-11-01) ──────────────────────────────────────
// Tapping a time or "Watch" opens a small player at the bottom. It plays that pattern's points
// one after another (each from 3 s before the moment it's decided to 2 s after), with
// previous/next, a scoreboard and a marker on the ball. The video is the server's small watch
// copy, reached through a signed link.
const W = { pat: null, i: 0, url: null, retry: null };
const wVideo = $("wVideo");
async function watchUrl() {
  if (W.url) return W.url;
  if (!JOB) throw new Error("There's no video for this report.");
  const res = await fetch(`${BACKEND}/api/watch/${encodeURIComponent(JOB)}`);
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(j.error || "The video isn't available right now."), { signin: !!j.signin });
  if (!j.ready) throw new Error(j.message || "The video isn't available right now.");
  W.url = BACKEND + j.url;
  return W.url;
}
function watchTitle() {
  const clips = clipsOf(W.pat), n = clips.length;
  $("wTitle").innerHTML = `Point ${W.i + 1} of ${n} · <span class="num">${clock(W.pat.moments[W.i] ?? clips[W.i][0])}</span><span class="w-sub">${esc(headlineOf(W.pat))}</span>`;
  $("wPrev").disabled = W.i === 0;
  $("wNext").disabled = W.i >= n - 1;
  document.querySelectorAll(".tbtn").forEach((b) => b.classList.toggle("on", b.dataset.w === W.pat.id && +b.dataset.i === W.i));
}
function watchSeek() {
  W.ended = false;
  const go = () => { wVideo.currentTime = clipsOf(W.pat)[W.i][0]; wVideo.play().catch(() => {}); };
  if (wVideo.readyState >= 1) go(); else wVideo.addEventListener("loadedmetadata", go, { once: true });
  watchTitle();
}
async function watchOpen(patId, i) {
  const pl = DATA && DATA.players[current];
  const p = pl && [...pl.weaknesses, ...pl.strengths].find((x) => x.id === patId);
  if (!p || !(p.moments || []).length) return;
  W.pat = p; W.i = Math.min(i, clipsOf(p).length - 1);
  clearTimeout(W.retry);
  $("watch").classList.remove("hidden");
  document.body.classList.add("watching");
  $("watch").scrollIntoView({ block: "center" });
  watchTitle();
  loadBall();
  try {
    const url = await watchUrl();
    $("wMsg").classList.add("hidden");
    wVideo.classList.remove("hidden");
    if (wVideo.dataset.src !== url) { wVideo.dataset.src = url; wVideo.src = url; }
    watchSeek();
  } catch (e) {
    wVideo.classList.add("hidden");
    $("wMsg").textContent = e.message;
    if (e.signin) $("wMsg").insertAdjacentHTML("beforeend", ` <a href="/account">Sign in</a>`);
    $("wMsg").classList.remove("hidden");
    if (e.signin) return;      // no point retrying until they sign in
    // still being made: try again on its own while the player is open
    W.retry = setTimeout(() => { if (!$("watch").classList.contains("hidden")) watchOpen(W.pat.id, W.i); }, 20000);
  }
}
function watchClose() {
  clearTimeout(W.retry);
  if (isFull()) toggleFull();
  wVideo.pause();
  $("watch").classList.add("hidden");
  document.body.classList.remove("watching");
  document.querySelectorAll(".tbtn.on").forEach((b) => b.classList.remove("on"));
}
// At the end of a point, go on to the next one (only when it played through, not after a jump ahead).
wVideo.addEventListener("timeupdate", () => {
  if (!W.pat) return;
  const clips = clipsOf(W.pat), end = clips[W.i][1], t = wVideo.currentTime;
  if (W.ended || t < end || t > end + 3) return;
  wVideo.pause();             // stop on the moment; the player moves on with "next" (pretend users: clips ran away)
  W.ended = true;
});
wVideo.addEventListener("error", () => {   // an expired link: get a fresh one next time
  if (!wVideo.dataset.src) return;
  W.url = null; delete wVideo.dataset.src;
  $("wMsg").textContent = "The video stopped loading. Tap a time to try again.";
  $("wMsg").classList.remove("hidden");
  wVideo.classList.add("hidden");
});
$("wPrev").addEventListener("click", () => { if (W.i > 0) { W.i--; watchSeek(); } });
$("wNext").addEventListener("click", () => { if (W.i < clipsOf(W.pat).length - 1) { W.i++; watchSeek(); } });
$("wClose").addEventListener("click", watchClose);
$("wReplay").addEventListener("click", () => watchSeek());
const watchBox = $("watch");
const isFull = () => document.fullscreenElement === watchBox || document.webkitFullscreenElement === watchBox || watchBox.classList.contains("w-full");
function fullChanged() {
  $("wFull").setAttribute("aria-pressed", String(isFull()));
  $("wFull").setAttribute("aria-label", isFull() ? "Leave full screen" : "Full screen");
  document.body.style.overflow = watchBox.classList.contains("w-full") ? "hidden" : "";
  requestAnimationFrame(() => drawBall(wVideo.currentTime));
}
async function toggleFull() {
  if (isFull()) {
    if (document.fullscreenElement) await document.exitFullscreen().catch(() => {});
    else if (document.webkitFullscreenElement) document.webkitExitFullscreen();
    watchBox.classList.remove("w-full");
  } else if (watchBox.requestFullscreen || watchBox.webkitRequestFullscreen) {
    // a browser that refuses (or never answers) gets the fill-the-window view instead
    const asked = watchBox.requestFullscreen ? watchBox.requestFullscreen() : (watchBox.webkitRequestFullscreen(), null);
    await Promise.race([Promise.resolve(asked).catch(() => {}), new Promise((r) => setTimeout(r, 800))]);
    if (!isFull()) watchBox.classList.add("w-full");
  } else watchBox.classList.add("w-full");
  fullChanged();
}
$("wFull").addEventListener("click", toggleFull);
wVideo.addEventListener("dblclick", (e) => { e.preventDefault(); toggleFull(); });
document.addEventListener("fullscreenchange", fullChanged);
document.addEventListener("webkitfullscreenchange", fullChanged);
$("wSpeed").addEventListener("click", () => {
  const slow = $("wSpeed").getAttribute("aria-pressed") !== "true";
  $("wSpeed").setAttribute("aria-pressed", String(slow));
  wVideo.playbackRate = wVideo.defaultPlaybackRate = slow ? 0.5 : 1;
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape" || $("watch").classList.contains("hidden")) return;
  if (watchBox.classList.contains("w-full")) toggleFull(); else if (!document.fullscreenElement) watchClose();
});
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-w]");
  if (b) watchOpen(b.dataset.w, +b.dataset.i);
});

// Scoreboard: the score before the point being shown (after it, once it's over).
const POINT_WORDS = ["0", "15", "30", "40"];
function pointWords(a, b, tb) {
  if (tb) return [String(a), String(b)];
  if (a >= 3 && b >= 3) return a === b ? ["40", "40"] : a > b ? ["AD", "40"] : ["40", "AD"];
  return [POINT_WORDS[Math.min(a, 3)], POINT_WORDS[Math.min(b, 3)]];
}
function drawScore(t) {
  const pts = profile.points || [], box = $("wScore");
  let i = -1;
  for (let k = 0; k < pts.length && pts[k].s <= t + 0.5; k++) i = k;
  if (i < 0 || !DATA) { box.classList.add("hidden"); return; }
  const now = t > pts[i].e + 0.5 && pts[i + 1] ? pts[i + 1] : pts[i];
  const ids = ["player_1", "player_2"], words = pointWords(now.pts[0], now.pts[1], now.tb);
  const key = JSON.stringify([now, words]);
  if (box.dataset.key === key) return;
  box.dataset.key = key;
  box.innerHTML = "<tbody>" + ids.map((id, r) => `<tr><td class="nm${now.server === id ? " sv" : ""}">${esc(DATA.players[id]?.name || id)}${now.near ? `<span class="end">${now.near === id ? "near" : "far"}</span>` : ""}</td>${
    now.sets.map((g) => `<td class="set">${g[r]}</td>`).join("")}<td>${now.games[r]}</td><td class="pt">${words[r]}</td></tr>`).join("") + "</tbody>";
  box.classList.remove("hidden");
}

// Ball marker: a bright ring where the app saw the ball, with a short fading trail.
const BALL = { track: null, loading: null };
function loadBall() {
  if (BALL.track || BALL.loading || !JOB) return;
  // the first request for an older report builds the file on the server, so allow it time; a failure
  // tries again the next time a point is opened
  BALL.loading = fetch(`${BACKEND}/api/ball/${encodeURIComponent(JOB)}`).then((r) => (r.ok ? r.json() : null))
    .then((t) => { BALL.track = t && t.f && t.f.length ? t : null; if (BALL.track) drawBall(wVideo.currentTime); })
    .catch(() => {}).finally(() => { BALL.loading = null; });
}
function ballIndex(f) {          // last detection at or before frame f
  const a = BALL.track.f;
  let lo = 0, hi = a.length - 1, ans = -1;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (a[m] <= f) { ans = m; lo = m + 1; } else hi = m - 1; }
  return ans;
}
function drawBall(t) {
  const c = $("wBall"), ctx = c.getContext("2d"), dpr = window.devicePixelRatio || 1;
  const cw = c.clientWidth, ch = c.clientHeight;
  if (c.width !== Math.round(cw * dpr) || c.height !== Math.round(ch * dpr)) { c.width = Math.round(cw * dpr); c.height = Math.round(ch * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cw, ch);
  if (!BALL.track || !wVideo.videoWidth) return;
  // where the picture sits inside the player (black bars if it isn't 16:9)
  const s = Math.min(cw / wVideo.videoWidth, ch / wVideo.videoHeight);
  const vw = wVideo.videoWidth * s, vh = wVideo.videoHeight * s, ox = (cw - vw) / 2, oy = (ch - vh) / 2;
  const T = BALL.track, f = Math.round(t * T.fps), i = ballIndex(f);
  if (i < 0) return;
  const at = (k) => [ox + T.x[k] / 1000 * vw, oy + T.y[k] / 1000 * vh];
  // the ball's own size (Rudra, Nov 1: no big circle); older files have no size
  const rad = (k) => Math.max(2.5, (T.s && T.s[k] ? T.s[k] / 10000 : 0.005) * vw / 2);
  for (let k = Math.max(0, i - 6); k < i; k++) {            // trail
    if (f - T.f[k] > 8) continue;
    const [x, y] = at(k);
    ctx.fillStyle = `rgba(233, 255, 77, ${0.1 + 0.06 * (k - i + 7)})`;
    ctx.beginPath(); ctx.arc(x, y, rad(k) * 0.6, 0, 2 * Math.PI); ctx.fill();
  }
  if (f - T.f[i] > 1) return;                                // no ball seen in this frame
  const [x, y] = at(i), r = rad(i);
  ctx.fillStyle = "rgba(233, 255, 77, 0.9)";
  ctx.strokeStyle = "rgba(0, 0, 0, 0.6)";
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();
}
function onVideoFrame(now, meta) {
  const t = meta && meta.mediaTime != null ? meta.mediaTime : wVideo.currentTime;
  drawBall(t);
  drawScore(t);
  if ("requestVideoFrameCallback" in wVideo) wVideo.requestVideoFrameCallback(onVideoFrame);
  else requestAnimationFrame(() => onVideoFrame());
}
if ("requestVideoFrameCallback" in wVideo) wVideo.requestVideoFrameCallback(onVideoFrame);
else requestAnimationFrame(() => onVideoFrame());
wVideo.addEventListener("seeking", () => { $("wScore").classList.add("hidden"); delete $("wScore").dataset.key; });
wVideo.addEventListener("seeked", () => { drawBall(wVideo.currentTime); drawScore(wVideo.currentTime); });

// Share with your coach: the phone's share sheet, or copy the link on a computer.
// A coach opens it with their team sign-in (they see their team's reports) or the passcode.
$("shareBtn").addEventListener("click", async () => {
  const url = location.href.split("#")[0];
  if (navigator.share) {
    try { await navigator.share({ title: `${$("title").textContent} · Advantage AI`, text: "My match report", url }); } catch (e) {}
    return;
  }
  const label = $("shareBtn").lastChild;
  try {
    await navigator.clipboard.writeText(url);
    label.textContent = " Link copied";
    setTimeout(() => { label.textContent = " Share with your coach"; }, 2500);
  } catch (e) { prompt("Copy this link and send it to your coach:", url); }
});

// ── rename players (job mode) ───────────────────────────────────────────
// Save as PDF (2026-10-14): the browser's own print screen, which saves a PDF on phones and
// computers. The print view has both players one after the other, the light colours, every
// fold open and both Lost and Won bars; the page goes back to how it was afterwards.
let printState = null;
function preparePrint() {
  if (printState || !DATA) return;
  printState = { title: document.title };
  const ids = Object.keys(DATA.players);
  $("printView").innerHTML = ids.map((id) => `<div class="print-player">
      <h2 class="print-name">${esc(DATA.players[id].name)}</h2>${playerHtml({ ...DATA.players[id], id }, true)}</div>`).join("");
  $("printView").querySelectorAll("details").forEach((d) => { d.open = true; });
  $("coverageBox").open = true;
  const when = new Date().toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  $("printDate").textContent = `Saved ${when}`;
  document.title = `Advantage AI report - ${ids.map((id) => DATA.players[id].name).join(" vs ")}`;
}
function restoreAfterPrint() {
  if (!printState) return;
  document.title = printState.title;
  $("printView").innerHTML = "";
  printState = null;
}
window.addEventListener("beforeprint", preparePrint);     // also when printing from the browser menu
window.addEventListener("afterprint", restoreAfterPrint);
$("pdfBtn").addEventListener("click", () => {
  preparePrint();
  setTimeout(() => window.print(), 50);                     // let the light colours apply first
});

$("editNamesBtn").addEventListener("click", () => $("namesForm").classList.toggle("hidden"));
$("deleteBtn").addEventListener("click", async () => {
  if (!confirm("Delete this report?\n\nThe report and its video are removed for good.")) return;
  $("deleteBtn").disabled = true;
  try {
    const res = await Site.deleteReport(JOB);
    if (!res.ok) { alert(`Couldn't delete it: ${res.error}`); $("deleteBtn").disabled = false; return; }
    location.href = Site.session() ? "/app" : "/new#reports";
  } catch (e) {
    alert("Couldn't reach the server. Check the connection and try again.");
    $("deleteBtn").disabled = false;
  }
});
$("namesForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = new FormData();
  form.append("player1_name", $("n1").value);
  form.append("player2_name", $("n2").value);
  try {
    const res = await fetch(`${BACKEND}/api/names/${encodeURIComponent(JOB)}`, { method: "POST", body: form });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const names = (await res.json()).names;
    for (const [pid, pl] of Object.entries(profile.players)) pl.name = names[pid] || (pid === "player_1" ? "Player 1" : "Player 2");
    DATA = shape(profile);
    $("namesForm").classList.add("hidden");
    render();
    Site.rememberReport(JOB, $("title").textContent);
  } catch (err) { alert(`Couldn't save names: ${err.message}`); }
});

load();
</script>
